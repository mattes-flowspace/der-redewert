<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Lokal</title>
<style>
:root{
  --bg:#ffffff; --side:#f7f7f5; --text:#37352f; --muted:#787774; --line:#e9e9e7;
  --hover:rgba(55,53,47,.06); --accent:#2383e2; --code:#f1f1ef; --callout:#f1f1ef;
  --danger:#d44c47; --card:#ffffff; --shadow:0 4px 16px rgba(15,15,15,.12);
  --t-gray:#e3e2e0; --t-brown:#eee0da; --t-orange:#fadec9; --t-yellow:#fdecc8;
  --t-green:#dbeddb; --t-blue:#d3e5ef; --t-purple:#e8deee; --t-pink:#f5e0e9; --t-red:#ffe2dd;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191919; --side:#202020; --text:#e6e6e4; --muted:#9b9b9b; --line:#2f2f2f;
    --hover:rgba(255,255,255,.06); --accent:#529cca; --code:#2a2a2a; --callout:#252525;
    --card:#252525; --shadow:0 4px 16px rgba(0,0,0,.5);
    --t-gray:#373737; --t-brown:#4a3c35; --t-orange:#5c3b23; --t-yellow:#564328;
    --t-green:#243d30; --t-blue:#143a4e; --t-purple:#3c2d49; --t-pink:#4e2c3c; --t-red:#522e2a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:4px}
input,select,textarea{font:inherit;color:inherit}

/* Seitenleiste */
#side{width:260px;min-width:260px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
#side header{padding:14px 14px 6px;font-weight:600;display:flex;align-items:center;gap:8px}
#side header span{flex:1}
.side-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 14px;color:var(--muted);font-size:14px}
.side-btn:hover{background:var(--hover)}
#tree{flex:1;overflow:auto;padding:6px 6px 20px}
.node{display:flex;align-items:center;gap:2px;padding:2px 4px;border-radius:4px;font-size:14px;cursor:pointer;user-select:none}
.node:hover{background:var(--hover)}
.node.active{background:var(--hover);font-weight:600}
.node .tw{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;flex:none}
.node .ic{width:20px;text-align:center;flex:none}
.node .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .add{visibility:hidden;color:var(--muted);width:20px}
.node:hover .add{visibility:visible}
.node.drop{outline:2px solid var(--accent)}
.section-title{font-size:12px;color:var(--muted);padding:10px 8px 2px;font-weight:600}

/* Hauptbereich */
#main{flex:1;overflow:auto;height:100%}
#topbar{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;color:var(--muted);z-index:5;min-height:44px}
#topbar .crumb{cursor:pointer;padding:2px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
#topbar .crumb:hover{background:var(--hover)}
#topbar .sp{flex:1}
#topbar button{padding:3px 8px;color:var(--muted)}
#topbar button:hover{background:var(--hover)}
#menuBtn{display:none}
.page{max-width:900px;margin:0 auto;padding:30px 60px 120px}
.page.wide{max-width:none;padding:30px 60px 120px}
.icon-big{font-size:58px;line-height:1;cursor:pointer;display:inline-block;border-radius:6px;padding:4px}
.icon-big:hover{background:var(--hover)}
.add-icon{color:var(--muted);font-size:14px;padding:2px 6px}
.add-icon:hover{background:var(--hover)}
h1.title{font-size:40px;line-height:1.2;margin:8px 0 16px;outline:none;font-weight:700;word-break:break-word}
h1.title:empty:before{content:"Ohne Titel";color:var(--muted);opacity:.5}

/* Inhalt */
.doc{min-height:200px;cursor:text}
.doc:empty:before{content:"Hier klicken zum Schreiben …";color:var(--muted)}
.doc h1{font-size:30px;margin:1.4em 0 .3em}.doc h2{font-size:24px;margin:1.3em 0 .3em}.doc h3{font-size:20px;margin:1.2em 0 .2em}
.doc p{margin:.35em 0}
.doc img{max-width:100%;border-radius:4px;display:block;margin:.6em 0}
.doc code{background:var(--code);padding:.1em .35em;border-radius:4px;font-size:.88em;color:#eb5757}
.doc pre{background:var(--code);padding:16px;border-radius:6px;overflow:auto;font-size:13.5px}
.doc pre code{background:none;color:inherit;padding:0}
.doc blockquote{border-left:3px solid currentColor;margin:.5em 0;padding:0 0 0 14px}
.doc .callout{background:var(--callout);border-radius:6px;padding:14px 16px;margin:.6em 0}
.doc table{border-collapse:collapse;margin:.6em 0;font-size:14px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--side)}
.doc hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.doc ul,.doc ol{padding-left:1.6em;margin:.3em 0}
.doc li.task{list-style:none;margin-left:-1.4em}
.doc li.task input{margin-right:8px}
.doc a{color:var(--text);text-decoration:underline;text-decoration-color:var(--muted)}
.doc a.pagelink{text-decoration:none;border-bottom:1px solid var(--line);font-weight:500}
.doc a.pagelink:before{content:"↗ ";color:var(--muted)}
.doc details{margin:.3em 0}
textarea.editor{width:100%;min-height:400px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:14px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;outline:none}
textarea.editor:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:6px 0}
.children{margin-top:30px;border-top:1px solid var(--line);padding-top:10px}
.children a{display:flex;gap:8px;padding:4px 6px;text-decoration:none;border-radius:4px}
.children a:hover{background:var(--hover)}

/* Eigenschaften */
.props{margin:0 0 20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.prop{display:flex;align-items:flex-start;min-height:34px;font-size:14px}
.prop .k{width:180px;flex:none;color:var(--muted);padding:6px 6px;display:flex;gap:6px;align-items:center}
.prop .v{flex:1;padding:4px 6px;border-radius:4px;min-height:30px}
.prop .v:hover{background:var(--hover)}

/* Datenbank */
.dbbar{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);margin-bottom:8px;flex-wrap:wrap}
.tab{padding:6px 10px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.dbbar .sp{flex:1}
.dbbar input{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:3px 8px;font-size:13px;width:180px}
.btn{padding:4px 10px;font-size:14px;border-radius:4px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.tablewrap{overflow:auto;border-top:1px solid var(--line)}
table.db{border-collapse:collapse;font-size:14px;min-width:100%}
table.db th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.db th:hover{background:var(--hover)}
table.db td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top;min-width:120px;max-width:380px}
table.db td .cell{padding:6px 8px;min-height:34px;cursor:text;word-break:break-word}
table.db td .cell:hover{background:var(--hover)}
table.db td.tcell .cell{font-weight:500;display:flex;gap:6px;align-items:flex-start}
table.db td.tcell .open{visibility:hidden;margin-left:auto;font-size:12px;border:1px solid var(--line);padding:0 6px;color:var(--muted);background:var(--bg)}
table.db tr:hover td.tcell .open{visibility:visible}
table.db th:last-child,table.db td:last-child{border-right:0}
.cell input[type=text],.cell input[type=date],.cell input[type=number],.cell textarea,.prop .v input,.prop .v textarea{width:100%;border:0;outline:2px solid var(--accent);border-radius:3px;background:var(--bg);padding:2px 4px;font-size:14px}
.newrow{padding:6px 8px;color:var(--muted);font-size:14px;cursor:pointer}
.newrow:hover{background:var(--hover)}
.tag{display:inline-block;padding:0 7px;border-radius:3px;font-size:13px;margin:1px 4px 1px 0;line-height:1.6;white-space:nowrap}
.board{display:flex;gap:12px;overflow:auto;padding:8px 0 20px;align-items:flex-start}
.col{width:260px;flex:none;border-radius:6px;padding:6px;min-height:80px}
.col.drop{outline:2px dashed var(--accent)}
.col h4{margin:2px 4px 8px;font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center}
.col h4 .n{color:var(--muted);font-weight:400}
.cardx{background:var(--card);box-shadow:0 0 0 1px var(--line),0 2px 4px rgba(15,15,15,.06);border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:14px}
.cardx:hover{filter:brightness(.97)}
.cardx .t{font-weight:500;margin-bottom:4px}
.cardx .m{font-size:12px;color:var(--muted)}

/* Popover, Dialoge */
.pop{position:fixed;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:6px;padding:6px;z-index:50;min-width:220px;font-size:14px}
.pop .item{display:block;width:100%;text-align:left;padding:5px 8px}
.pop .item:hover{background:var(--hover)}
.pop .item.danger{color:var(--danger)}
.pop label{display:block;font-size:12px;color:var(--muted);margin:6px 8px 2px}
.pop input,.pop select{width:calc(100% - 16px);margin:0 8px 6px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.4);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:60}
.dialog{background:var(--card);border-radius:10px;box-shadow:var(--shadow);width:min(620px,92vw);max-height:72vh;display:flex;flex-direction:column;overflow:hidden}
.dialog input.q{border:0;border-bottom:1px solid var(--line);padding:14px 18px;font-size:17px;background:transparent;outline:none}
.dialog .res{overflow:auto;padding:6px}
.dialog .r{display:block;padding:8px 12px;border-radius:6px;text-decoration:none;cursor:pointer}
.dialog .r:hover,.dialog .r.sel{background:var(--hover)}
.dialog .r small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dialog .body{padding:20px 24px;overflow:auto}
.dialog h2{margin:0 0 10px;font-size:20px}
.dialog ol{padding-left:20px}
.drop-zone{border:2px dashed var(--line);border-radius:8px;padding:30px;text-align:center;color:var(--muted);margin:14px 0;cursor:pointer}
.drop-zone.on{border-color:var(--accent);color:var(--accent)}
.log{font:12px/1.5 ui-monospace,monospace;background:var(--code);border-radius:6px;padding:10px;white-space:pre-wrap;max-height:180px;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2f2f2f;color:#fff;padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
.empty{color:var(--muted);text-align:center;margin-top:20vh}
.empty .big{font-size:48px}

@media (max-width: 760px){
  #side{position:fixed;left:-280px;z-index:40;transition:left .2s;box-shadow:var(--shadow)}
  body.side-open #side{left:0}
  #menuBtn{display:inline-block}
  .page,.page.wide{padding:20px 16px 100px}
  .prop .k{width:120px}
  h1.title{font-size:30px}
}
</style>
</head>
<body>
<nav id="side">
  <header><span>🗂️ Notion Lokal</span></header>
  <button class="side-btn" id="btnSearch">🔍 Suchen <span style="margin-left:auto;font-size:11px">Strg K</span></button>
  <button class="side-btn" id="btnImport">📥 Notion importieren</button>
  <button class="side-btn" id="btnExport">📤 Export (Markdown/CSV)</button>
  <button class="side-btn" id="btnTrash">🗑️ Papierkorb</button>
  <div class="section-title">SEITEN</div>
  <div id="tree"></div>
  <button class="side-btn" id="btnNewPage" style="padding:8px 14px">＋ Neue Seite</button>
  <button class="side-btn" id="btnNewDb" style="padding:0 14px 12px">＋ Neue Datenbank</button>
</nav>
<main id="main">
  <div id="topbar"><button id="menuBtn">☰</button><span id="crumbs"></span><span class="sp"></span><span id="status"></span><button id="btnMore" title="Mehr">•••</button></div>
  <div id="view"></div>
</main>
<div id="toast"></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Hilfsfunktionen
// ---------------------------------------------------------------------------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};
async function api(method, url, body, raw=false) {
  const opt = {method, headers:{}};
  if (body !== undefined) {
    if (raw) opt.body = body; else { opt.body = JSON.stringify(body); opt.headers["Content-Type"]="application/json"; }
  }
  const r = await fetch(url, opt);
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2200); }
function debounce(fn, ms){ let t; const d=(...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms)}; d.flush=(...a)=>{clearTimeout(t); fn(...a)}; return d; }
const defaultIcon = k => k==="database" ? "🗃️" : "📄";
function setStatus(s){ $("#status").textContent = s; }

const TAGCOLORS = ["gray","brown","orange","yellow","green","blue","purple","pink","red"];
function tagColor(v){ let n=0; for (const c of String(v)) n=(n*31+c.charCodeAt(0))>>>0; return `var(--t-${TAGCOLORS[n%TAGCOLORS.length]})`; }

// ---------------------------------------------------------------------------
// Markdown -> HTML (Notion-Export-kompatibel, ohne externe Bibliothek)
// ---------------------------------------------------------------------------
function safeUrl(u){
  u = String(u||"").trim();
  if (/^(javascript|vbscript|data):/i.test(u) && !/^data:image\//i.test(u)) return "#";
  return u;
}
function inline(s){
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_,c)=>{ codes.push(c); return `\u0000${codes.length-1}\u0000`; });
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_,a,u)=>`<img alt="${a}" src="${esc(safeUrl(u.replace(/&amp;/g,"&")))}" loading="lazy">`);
  s = s.replace(/\[((?:[^\[\]]|\[[^\]]*\])*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_,t,u)=>{
    u = u.replace(/&amp;/g,"&");
    if (u.startsWith("#/p/")) return `<a class="pagelink" href="${esc(u)}">${t}</a>`;
    const ext = !u.startsWith("#") && !u.startsWith("/");
    return `<a href="${esc(safeUrl(u))}"${ext?' target="_blank" rel="noopener"':''}>${t}</a>`;
  });
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<em>$2</em>").replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g,"$1<em>$2</em>");
  s = s.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  s = s.replace(/&lt;br\s*\/?&gt;/g,"<br>");
  s = s.replace(/\u0000(\d+)\u0000/g, (_,i)=>`<code>${esc(codes[+i])}</code>`);
  return s;
}
function md(src){
  const lines = String(src||"").replace(/\r\n/g,"\n").split("\n");
  let out = "", i = 0, para = [];
  const flush = () => { if (para.length){ out += `<p>${para.map(inline).join("<br>")}</p>`; para=[]; } };
  const indentOf = l => { const m=l.match(/^(\s*)/)[1]; return m.replace(/\t/g,"    ").length; };
  const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  while (i < lines.length){
    const l = lines[i];
    if (/^\s*```/.test(l)){
      flush(); const lang = l.trim().slice(3); const buf=[]; i++;
      while (i<lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++; out += `<pre><code data-lang="${esc(lang)}">${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    if (/^\s*<aside>\s*$/i.test(l)){
      flush(); const buf=[]; i++; let depth=1;
      while (i<lines.length){ if (/<aside>/i.test(lines[i])) depth++; if (/<\/aside>/i.test(lines[i]) && --depth===0) break; buf.push(lines[i++]); }
      i++; out += `<div class="callout">${md(buf.join("\n"))}</div>`; continue;
    }
    if (/^\s*<details>/i.test(l)){
      flush(); const buf=[]; i++; let sum="";
      const sm = l.match(/<summary>(.*?)<\/summary>/i); if (sm) sum=sm[1];
      while (i<lines.length && !/<\/details>/i.test(lines[i])){ const m=lines[i].match(/<summary>(.*?)<\/summary>/i); if(m) sum=m[1]; else buf.push(lines[i]); i++; }
      i++; out += `<details><summary>${inline(sum)}</summary>${md(buf.join("\n"))}</details>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ flush(); const n=Math.min(m[1].length+0,6); out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){ flush(); out+="<hr>"; i++; continue; }
    if (/^\s*>/.test(l)){
      flush(); const buf=[]; while(i<lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,""));
      out += `<blockquote>${md(buf.join("\n"))}</blockquote>`; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      flush(); const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head = cells(l); i += 2; let rows="";
      while (i<lines.length && /^\s*\|/.test(lines[i])) rows += "<tr>"+cells(lines[i++]).map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>";
      out += `<table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`; continue;
    }
    if (listRe.test(l)){
      flush();
      // Liste inkl. eingerückter Folgezeilen einsammeln
      const items=[]; const base=indentOf(l);
      while (i<lines.length){
        const cur = lines[i];
        const lm = cur.match(listRe);
        if (lm && indentOf(cur)===base){ items.push({marker:lm[2], text:lm[3], sub:[]}); i++; continue; }
        if (cur.trim()==="" ){ // Leerzeile: Liste läuft weiter, wenn danach eingerückt oder gleiche Liste
          const nx = lines[i+1]; if (nx!==undefined && (indentOf(nx)>base && nx.trim() || (listRe.test(nx) && indentOf(nx)===base))){ if(items.length) items[items.length-1].sub.push(""); i++; continue; }
          break;
        }
        if (indentOf(cur)>base && items.length){ items[items.length-1].sub.push(cur.slice(Math.min(indentOf(cur), base+4) > base ? base+ (indentOf(cur)-base>=4?4:indentOf(cur)-base) : base)); i++; continue; }
        break;
      }
      const ordered = /\d/.test(items[0].marker);
      out += ordered ? "<ol>" : "<ul>";
      for (const it of items){
        const tm = it.text.match(/^\[([ xX])\]\s*(.*)$/);
        const subHtml = it.sub.some(s=>s.trim()) ? md(it.sub.join("\n")) : "";
        if (tm) out += `<li class="task"><input type="checkbox" disabled${tm[1]!==" "?" checked":""}>${inline(tm[2])}${subHtml}</li>`;
        else out += `<li>${inline(it.text)}${subHtml}</li>`;
      }
      out += ordered ? "</ol>" : "</ul>";
      continue;
    }
    if (l.trim()===""){ flush(); i++; continue; }
    para.push(l.trim()); i++;
  }
  flush();
  return out;
}

// ---------------------------------------------------------------------------
// Zustand & Routing
// ---------------------------------------------------------------------------
let TREE = [], CURRENT = null, EXPANDED = new Set(JSON.parse(localStorage.getItem("nl_expanded")||"[]"));
const saveExpanded = () => { try{ localStorage.setItem("nl_expanded", JSON.stringify([...EXPANDED])); }catch{} };

async function loadTree(){ TREE = await api("GET","/api/tree"); renderTree(); }

function renderTree(){
  const byParent = {};
  const ids = new Set(TREE.map(n=>n.id));
  for (const n of TREE){ const p = ids.has(n.parent_id) ? n.parent_id : null; (byParent[p] ||= []).push(n); }
  // Seiten unter Datenbankzeilen sind nicht im Baum -> Elternkette über Zeilen ausblenden
  const tree = $("#tree"); tree.innerHTML = "";
  const roots = (byParent[null]||[]).filter(n => !n.parent_id);
  const walk = (list, depth, el) => {
    for (const n of list){
      const kids = byParent[n.id] || [];
      const open = EXPANDED.has(n.id);
      const row = h("div",{class:"node"+(CURRENT&&CURRENT.id===n.id?" active":""), style:`padding-left:${4+depth*14}px`, draggable:"true"},
        h("span",{class:"tw", onclick:e=>{e.stopPropagation(); open?EXPANDED.delete(n.id):EXPANDED.add(n.id); saveExpanded(); renderTree();}}, kids.length ? (open?"▼":"▶") : "•"),
        h("span",{class:"ic"}, n.icon || defaultIcon(n.kind)),
        h("span",{class:"lb"}, n.title || "Ohne Titel"),
        n.kind==="page" ? h("button",{class:"add", title:"Unterseite", onclick:e=>{e.stopPropagation(); newPage(n.id);}},"＋") : null);
      row.onclick = () => go(n.id);
      row.ondragstart = e => { e.dataTransfer.setData("text/nl-page", n.id); };
      row.ondragover = e => { if (n.kind!=="page") return; e.preventDefault(); row.classList.add("drop"); };
      row.ondragleave = () => row.classList.remove("drop");
      row.ondrop = async e => { row.classList.remove("drop"); const id=e.dataTransfer.getData("text/nl-page"); if(!id||id===n.id) return; e.preventDefault();
        try{ await api("PUT",`/api/page/${id}`,{parent_id:n.id}); EXPANDED.add(n.id); saveExpanded(); await loadTree(); toast("Verschoben"); }catch(err){ toast(err.message); } };
      el.append(row);
      if (open && kids.length) walk(kids, depth+1, el);
    }
  };
  walk(roots, 0, tree);
  if (!roots.length) tree.append(h("div",{class:"hint", style:"padding:8px"},"Noch keine Seiten. Importiere deinen Notion-Export oder lege eine neue Seite an."));
  // Drop auf leeren Bereich = oberste Ebene
  tree.ondragover = e => e.preventDefault();
  tree.ondrop = async e => { if (e.target!==tree) return; const id=e.dataTransfer.getData("text/nl-page"); if(!id) return;
    await api("PUT",`/api/page/${id}`,{parent_id:null}); await loadTree(); };
}

function go(id){ location.hash = "#/p/"+id; document.body.classList.remove("side-open"); }

async function route(){
  const m = location.hash.match(/^#\/p\/([0-9a-zA-Z_-]+)/);
  if (m) return openPage(m[1]);
  CURRENT = null; renderTree(); renderHome();
}
window.addEventListener("hashchange", route);

function renderHome(){
  $("#crumbs").innerHTML = "";
  const v = $("#view"); v.innerHTML = "";
  const roots = TREE.filter(n=>!n.parent_id);
  v.append(h("div",{class:"page"},
    roots.length ? [h("h1",{class:"title"},"Willkommen 👋"), h("p",{class:"hint"},"Deine Seiten liegen jetzt lokal auf deinem Rechner."),
      h("div",{class:"children", style:"border:0"}, roots.map(n=>h("a",{href:"#/p/"+n.id}, h("span",{}, n.icon||defaultIcon(n.kind)), n.title||"Ohne Titel")))]
    : h("div",{class:"empty"}, h("div",{class:"big"},"🗂️"), h("h2",{},"Noch leer"),
        h("p",{},"Importiere deinen Notion-Export, um loszulegen."),
        h("button",{class:"btn primary", onclick:openImport},"Notion-Export importieren"))));
}

let saveTimer = null;
async function openPage(id){
  if (saveTimer) saveTimer.flush();
  let p;
  try { p = await api("GET", `/api/page/${id}`); }
  catch(e){ $("#view").innerHTML = `<div class="page empty"><div class="big">🤷</div><h2>Seite nicht gefunden</h2></div>`; return; }
  CURRENT = p;
  // Elternknoten im Baum aufklappen
  for (const c of p.breadcrumbs) EXPANDED.add(c.id); saveExpanded();
  renderTree();
  renderCrumbs(p);
  const v = $("#view"); v.innerHTML = "";
  if (p.deleted) v.append(h("div",{style:"background:var(--t-red);padding:8px 16px;font-size:14px;text-align:center"},"Diese Seite liegt im Papierkorb. ",
    h("button",{class:"btn", style:"text-decoration:underline", onclick:async()=>{await api("POST",`/api/restore/${p.id}`); await loadTree(); openPage(p.id);}},"Wiederherstellen")));
  const page = h("div",{class:"page"+(p.kind==="database"?" wide":"")});
  v.append(page);

  // Icon + Titel
  const iconEl = p.icon ? h("div",{class:"icon-big", title:"Icon ändern", onclick:()=>pickIcon(p)}, p.icon)
                        : h("button",{class:"add-icon", onclick:()=>pickIcon(p)},"☺ Icon hinzufügen");
  page.append(iconEl);
  const titleEl = h("h1",{class:"title", contenteditable:"plaintext-only", spellcheck:"false"}, p.title);
  if (titleEl.contentEditable !== "plaintext-only") titleEl.contentEditable = "true";
  titleEl.onkeydown = e => { if (e.key==="Enter"){ e.preventDefault(); titleEl.blur(); } };
  titleEl.oninput = debounce(async ()=>{ p.title = titleEl.textContent.trim(); await save(p.id,{title:p.title}); const n=TREE.find(x=>x.id===p.id); if(n){n.title=p.title; renderTree();} renderCrumbs(p); }, 500);
  page.append(titleEl);

  if (p.kind==="row") page.append(renderProps(p));
  if (p.kind==="database"){
    page.append(renderDoc(p, true));
    page.append(renderDatabase(p));
  } else {
    page.append(renderDoc(p, false));
  }
  if (p.children && p.children.length){
    page.append(h("div",{class:"children"}, h("div",{class:"section-title", style:"padding-left:6px"},"UNTERSEITEN"),
      p.children.map(c=>h("a",{href:"#/p/"+c.id}, h("span",{}, c.icon||defaultIcon(c.kind)), c.title||"Ohne Titel"))));
  }
  $("#main").scrollTop = 0;
}

function renderCrumbs(p){
  const c = $("#crumbs"); c.innerHTML = "";
  for (const b of [...p.breadcrumbs, p]){
    if (c.childNodes.length) c.append(h("span",{}," / "));
    c.append(h("span",{class:"crumb", onclick:()=>go(b.id)}, (b.icon||defaultIcon(b.kind))+" "+(b.title||"Ohne Titel")));
  }
}

async function save(id, data){
  setStatus("Speichert …");
  try { await api("PUT", `/api/page/${id}`, data); setStatus("Gespeichert"); setTimeout(()=>{ if($("#status").textContent==="Gespeichert") setStatus(""); },1200); }
  catch(e){ setStatus("Fehler beim Speichern!"); toast(e.message); }
}

function renderDoc(p, compact){
  const wrap = h("div");
  const show = () => {
    wrap.innerHTML = "";
    const doc = h("div",{class:"doc", html: md(p.content)});
    if (compact && !p.content.trim()){ doc.style.minHeight="0"; doc.innerHTML=""; doc.append(h("div",{class:"hint", style:"cursor:pointer"},"＋ Beschreibung hinzufügen")); }
    doc.onclick = e => { if (e.target.closest("a, input, summary")) return; edit(); };
    wrap.append(doc);
  };
  const edit = () => {
    wrap.innerHTML = "";
    const ta = h("textarea",{class:"editor", spellcheck:"true"}); ta.value = p.content;
    const grow = () => { ta.style.height="auto"; ta.style.height = Math.max(compact?120:400, ta.scrollHeight+4)+"px"; };
    saveTimer = debounce(()=>save(p.id,{content:p.content}), 700);
    ta.oninput = () => { p.content = ta.value; grow(); saveTimer(); };
    ta.onkeydown = e => {
      if (e.key==="Escape" || (e.key==="Enter" && (e.ctrlKey||e.metaKey))){ e.preventDefault(); ta.blur(); }
      if (e.key==="Tab"){ e.preventDefault(); const s=ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); ta.oninput(); }
    };
    ta.onblur = () => { saveTimer.flush(); show(); };
    ta.onpaste = async e => {
      const f = [...(e.clipboardData?.files||[])][0]; if (!f) return;
      e.preventDefault(); const url = await uploadFile(p.id, f);
      ta.setRangeText(f.type.startsWith("image/") ? `![${f.name}](${url})` : `[${f.name}](${url})`, ta.selectionStart, ta.selectionEnd, "end"); ta.oninput();
    };
    ta.ondrop = async e => {
      const files=[...(e.dataTransfer?.files||[])]; if(!files.length) return; e.preventDefault();
      for (const f of files){ const url=await uploadFile(p.id,f); ta.setRangeText((f.type.startsWith("image/")?"!":"")+`[${f.name}](${url})\n`, ta.selectionStart, ta.selectionEnd, "end"); }
      ta.oninput();
    };
    wrap.append(ta, h("div",{class:"hint"},"Markdown · Bilder per Einfügen/Ziehen · Esc oder Strg+Enter zum Beenden · Links auf Seiten: [Titel](#/p/ID)"));
    grow(); ta.focus();
  };
  show();
  return wrap;
}

async function uploadFile(pid, f){
  setStatus("Lädt hoch …");
  const r = await api("POST", `/api/upload?page=${encodeURIComponent(pid)}&name=${encodeURIComponent(f.name||"bild.png")}`, f, true);
  setStatus(""); return r.url;
}

const EMOJIS = "📄 📝 📚 📁 🗂️ 🗃️ 📌 ⭐ ✅ 💡 🎯 🚀 🎨 🎬 🧊 🖼️ 📷 🎞️ 🧠 💬 📅 🗓️ 💼 💰 🏠 ❤️ 🔥 🌱 ⚙️ 🔧 🧪 📈 👥 🤝 ✈️ 🍳 🎵 🎮 🧘 🏃".split(" ");
function pickIcon(p){
  const pop = popover(event.target);
  const grid = h("div",{style:"display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:4px"});
  for (const e of EMOJIS) grid.append(h("button",{class:"item", style:"font-size:20px;text-align:center;padding:4px", onclick:()=>set(e)}, e));
  const inp = h("input",{placeholder:"Eigenes Emoji/Zeichen …"});
  inp.onkeydown = e => { if (e.key==="Enter") set(inp.value.trim()); };
  pop.append(grid, inp, h("button",{class:"item danger", onclick:()=>set("")},"Icon entfernen"));
  async function set(icon){ closePop(); p.icon = icon; await save(p.id,{icon}); await loadTree(); openPage(p.id); }
}

// Eigenschaften (Datenbankzeile)

function renderProps(p){
  const box = h("div",{class:"props"});
  for (const col of p.db_schema){
    if (col.type==="title") continue;
    const v = h("div",{class:"v"});
    renderCellValue(v, col, p.props[col.name] ?? "");
    v.onclick = e => { if (e.target.closest("a")) return; editCell(v, col, p.props[col.name] ?? "", async val => {
      p.props[col.name] = val; await save(p.id,{props:p.props}); renderCellValue(v, col, val); }, p.parent_id); };
    box.append(h("div",{class:"prop"}, h("div",{class:"k"}, typeIcon(col.type), col.name), v));
  }
  return box;
}
const TYPES = {title:"Titel", text:"Text", number:"Zahl", select:"Auswahl", multi_select:"Mehrfachauswahl", date:"Datum", checkbox:"Checkbox", url:"URL", email:"E-Mail", relation:"Verknüpfung", files:"Dateien"};
function typeIcon(t){ return ({title:"Aa", text:"≡", number:"#", select:"◉", multi_select:"☰", date:"📅", checkbox:"☑", url:"🔗", email:"@", relation:"↗", files:"📎"})[t]||"≡"; }

function renderCellValue(el, col, val){
  el.innerHTML = "";
  val = val ?? "";
  switch (col.type){
    case "checkbox": {
      const on = /^(yes|ja|true|1|x)$/i.test(val);
      el.append(h("input",{type:"checkbox", checked:on, style:"pointer-events:none"})); break;
    }
    case "select": if (val) el.append(h("span",{class:"tag", style:`background:${tagColor(val)}`}, val)); break;
    case "multi_select": for (const t of String(val).split(",").map(s=>s.trim()).filter(Boolean)) el.append(h("span",{class:"tag", style:`background:${tagColor(t)}`}, t)); break;
    case "url": if (val) el.append(h("a",{href:safeUrl(val), target:"_blank", rel:"noopener"}, val)); break;
    case "email": if (val) el.append(h("a",{href:"mailto:"+val}, val)); break;
    default:
      if (/\]\(/.test(val)) el.innerHTML = inline(val);
      else el.textContent = val;
  }
}

function editCell(el, col, val, commit, dbId){
  if (el.querySelector("input,textarea,select")) return;
  if (col.type==="checkbox"){ const on=/^(yes|ja|true|1|x)$/i.test(val); commit(on?"No":"Yes"); return; }
  if (col.type==="select" || col.type==="multi_select") return editTags(el, col, val, commit, dbId);
  el.innerHTML = "";
  const multi = col.type==="text" || col.type==="relation" || col.type==="files";
  const inp = multi ? h("textarea",{rows:Math.min(8, Math.max(1, String(val).split("\n").length))}) : h("input",{type: col.type==="number"?"text":"text"});
  inp.value = val;
  let done = false;
  const finish = ok => { if (done) return; done = true; const nv = inp.value; if (ok && nv!==val) commit(nv); else renderCellValue(el, col, val); };
  inp.onkeydown = e => { if (e.key==="Escape"){ e.preventDefault(); finish(false); } if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); finish(true); } };
  inp.onblur = () => finish(true);
  el.append(inp); inp.focus(); inp.select?.();
  if (col.type==="date") el.append(h("div",{class:"hint"},"z. B. 10.11.2026 oder 2026-11-10"));
}

function optionsFor(col, dbId){
  const opts = new Set(col.options || []);
  const rows = (CURRENT && CURRENT.kind==="database" && CURRENT.id===dbId) ? CURRENT.rows : (DBCACHE[dbId]||[]);
  for (const r of rows){ const v = r.props?.[col.name]; if (v) for (const t of (col.type==="multi_select"? v.split(","):[v])) if (t.trim()) opts.add(t.trim()); }
  return [...opts].sort((a,b)=>a.localeCompare(b,"de"));
}
const DBCACHE = {};
function editTags(el, col, val, commit, dbId){
  const multi = col.type==="multi_select";
  let cur = String(val||"").split(multi?",":"\u0001").map(s=>s.trim()).filter(Boolean);
  const pop = popover(el);
  const inp = h("input",{placeholder: multi ? "Option suchen oder neu anlegen …" : "Option wählen oder neu …"});
  const list = h("div");
  const draw = () => {
    list.innerHTML = "";
    const q = inp.value.trim().toLowerCase();
    if (cur.length) list.append(h("div",{style:"padding:2px 8px 6px"}, cur.map(t=>h("span",{class:"tag", style:`background:${tagColor(t)};cursor:pointer`, title:"Entfernen", onclick:()=>{cur=cur.filter(x=>x!==t); apply();}}, t+" ×"))));
    const opts = optionsFor(col, dbId).filter(o=>!q || o.toLowerCase().includes(q));
    for (const o of opts) list.append(h("button",{class:"item", onclick:()=>toggle(o)}, h("span",{class:"tag", style:`background:${tagColor(o)}`}, o), cur.includes(o)?" ✓":""));
    if (q && !opts.some(o=>o.toLowerCase()===q)) list.append(h("button",{class:"item", onclick:()=>toggle(inp.value.trim())}, "Neu: ", h("span",{class:"tag", style:`background:${tagColor(inp.value.trim())}`}, inp.value.trim())));
    if (!multi && cur.length) list.append(h("button",{class:"item danger", onclick:()=>{cur=[]; apply(); closePop();}},"Leeren"));
  };
  const toggle = o => { if (multi) cur = cur.includes(o) ? cur.filter(x=>x!==o) : [...cur, o]; else { cur = [o]; } inp.value=""; apply(); if(!multi) closePop(); };
  const apply = () => { const nv = cur.join(", "); val = nv; commit(nv); draw(); };
  inp.oninput = draw;
  inp.onkeydown = e => { if (e.key==="Enter" && inp.value.trim()) toggle(inp.value.trim()); if (e.key==="Escape") closePop(); };
  pop.append(inp, list); draw(); inp.focus();
}

// Datenbankansicht (Tabelle & Board)
// ---------------------------------------------------------------------------
function dbState(id){ try{ return JSON.parse(localStorage.getItem("nl_db_"+id)||"{}"); }catch{ return {}; } }
function setDbState(id, s){ try{ localStorage.setItem("nl_db_"+id, JSON.stringify(s)); }catch{} }

function renderDatabase(p){
  DBCACHE[p.id] = p.rows;
  const st = Object.assign({view:"table", sort:null, dir:1, filter:"", group:null}, dbState(p.id));
  const wrap = h("div");
  const body = h("div");
  const filterInp = h("input",{placeholder:"🔍 Filtern …", value:st.filter});
  filterInp.oninput = debounce(()=>{ st.filter = filterInp.value; setDbState(p.id, st); draw(); }, 200);
  const tabs = h("div",{style:"display:flex"});
  const bar = h("div",{class:"dbbar"}, tabs, h("span",{class:"sp"}), filterInp,
    h("button",{class:"btn", onclick:e=>addColumn(p, e.target)},"＋ Spalte"),
    h("button",{class:"btn primary", onclick:()=>addRow(p)},"Neu"));
  wrap.append(bar, body);

  const visibleRows = () => {
    let rows = p.rows.slice();
    const q = st.filter.trim().toLowerCase();
    if (q) rows = rows.filter(r => (r.title+" "+Object.values(r.props).join(" ")).toLowerCase().includes(q));
    if (st.sort){
      const col = p.schema.find(c=>c.name===st.sort);
      const key = r => { const v = col?.type==="title" ? r.title : (r.props[st.sort]||""); if (col?.type==="number") return parseFloat(String(v).replace(",","."))||0; if (col?.type==="date") return parseDate(v); return String(v).toLowerCase(); };
      rows.sort((a,b)=>{ const x=key(a), y=key(b); return (x<y?-1:x>y?1:0)*st.dir; });
    }
    return rows;
  };

  const draw = () => {
    tabs.innerHTML = "";
    for (const [k,lb] of [["table","▦ Tabelle"],["board","▥ Board"]]) tabs.append(h("button",{class:"tab"+(st.view===k?" on":""), onclick:()=>{st.view=k; setDbState(p.id,st); draw();}}, lb));
    body.innerHTML = "";
    if (st.view==="board") body.append(drawBoard()); else body.append(drawTable());
  };

  const drawTable = () => {
    const tw = h("div",{class:"tablewrap"});
    const t = h("table",{class:"db"});
    const tr = h("tr");
    p.schema.forEach((col, ci) => {
      tr.append(h("th",{onclick:e=>colMenu(p, ci, e.currentTarget, st, draw)}, h("span",{style:"opacity:.7;margin-right:6px"}, typeIcon(col.type)), col.name, st.sort===col.name ? (st.dir>0?" ↑":" ↓") : ""));
    });
    t.append(h("thead",{},tr));
    const tb = h("tbody");
    for (const r of visibleRows()){
      const row = h("tr");
      for (const col of p.schema){
        const cell = h("div",{class:"cell"});
        if (col.type==="title"){
          cell.append(h("span",{}, r.icon||""), h("span",{class:"tt"}, r.title || ""), h("button",{class:"open", onclick:e=>{e.stopPropagation(); go(r.id);}},"ÖFFNEN"));
          cell.onclick = e => { if (e.target.closest("button")) return; editCell(cell, {type:"text"}, r.title, async val => { r.title = val; r.props[col.name]=val; await save(r.id,{title:val}); draw(); }); };
          row.append(h("td",{class:"tcell"}, cell));
        } else {
          renderCellValue(cell, col, r.props[col.name]);
          cell.onclick = e => { if (e.target.closest("a")) return; editCell(cell, col, r.props[col.name]||"", async val => { r.props[col.name]=val; renderCellValue(cell, col, val); await save(r.id,{props:r.props}); }, p.id); };
          row.append(h("td",{}, cell));
        }
      }
      row.oncontextmenu = e => { e.preventDefault(); rowMenu(p, r, e, draw); };
      tb.append(row);
    }
    t.append(tb);
    tw.append(t, h("div",{class:"newrow", onclick:()=>addRow(p)},"＋ Neu"),
      h("div",{class:"hint", style:"padding:4px 8px"}, `${visibleRows().length} von ${p.rows.length} Einträgen · Rechtsklick auf eine Zeile für mehr`));
    return tw;
  };

  const drawBoard = () => {
    const groupable = p.schema.filter(c=>c.type==="select" || c.type==="multi_select" || c.type==="checkbox");
    if (!groupable.length) return h("div",{class:"hint", style:"padding:20px"},"Für das Board wird eine Spalte vom Typ „Auswahl“ benötigt. Klicke auf eine Spaltenüberschrift, um den Typ zu ändern.");
    if (!st.group || !groupable.some(c=>c.name===st.group)) st.group = groupable[0].name;
    const col = p.schema.find(c=>c.name===st.group);
    const sel = h("select",{style:"margin:6px 0;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg)"}, groupable.map(c=>h("option",{value:c.name, selected:c.name===st.group}, "Gruppiert nach: "+c.name)));
    sel.onchange = () => { st.group = sel.value; setDbState(p.id, st); draw(); };
    const rows = visibleRows();
    const groups = col.type==="checkbox" ? ["Yes","No"] : ["", ...optionsFor(col, p.id)];
    const board = h("div",{class:"board"});
    for (const g of groups){
      const items = rows.filter(r => { const v=(r.props[col.name]||"").trim();
        if (col.type==="checkbox") return (/^(yes|ja|true|1|x)$/i.test(v)?"Yes":"No")===g;
        if (col.type==="multi_select") return g==="" ? !v : v.split(",").map(s=>s.trim()).includes(g);
        return v===g; });
      if (g==="" && !items.length) continue;
      const c = h("div",{class:"col", style:`background:${g?`color-mix(in srgb, ${tagColor(g)} 35%, transparent)`:"var(--hover)"}`},
        h("h4",{}, g ? h("span",{class:"tag", style:`background:${tagColor(g)}`}, col.type==="checkbox" ? (g==="Yes"?"✓ Ja":"Nein") : g) : h("span",{},"Ohne "+col.name), h("span",{class:"n"}, items.length)));
      for (const r of items){
        const others = p.schema.filter(x=>x.type!=="title" && x.name!==col.name && r.props[x.name]).slice(0,3);
        const card = h("div",{class:"cardx", draggable:"true", onclick:()=>go(r.id)},
          h("div",{class:"t"}, (r.icon?r.icon+" ":"")+(r.title||"Ohne Titel")),
          others.map(x=>{ const m=h("div",{class:"m"}); renderCellValue(m, x, r.props[x.name]); return m; }));
        card.ondragstart = e => e.dataTransfer.setData("text/nl-row", r.id);
        c.append(card);
      }
      c.append(h("div",{class:"newrow", onclick:()=>addRow(p, g ? {[col.name]: g} : {})},"＋ Neu"));
      c.ondragover = e => { e.preventDefault(); c.classList.add("drop"); };
      c.ondragleave = () => c.classList.remove("drop");
      c.ondrop = async e => { c.classList.remove("drop"); const id=e.dataTransfer.getData("text/nl-row"); const r=p.rows.find(x=>x.id===id); if(!r) return;
        let v = g; if (col.type==="multi_select"){ const prev=(r.props[col.name]||"").split(",").map(s=>s.trim()).filter(Boolean); v = g ? [...new Set([...prev.filter(x=>!groups.includes(x)), g])].join(", ") : ""; }
        r.props[col.name] = v; await save(r.id,{props:r.props}); draw(); };
      board.append(c);
    }
    return h("div",{}, sel, board);
  };

  draw();
  return wrap;
}

function parseDate(v){
  v = String(v||"").split("→")[0].trim(); if (!v) return 0;
  let m;
  if ((m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/))) return new Date(+(m[3].length===2?"20"+m[3]:m[3]), m[2]-1, +m[1]).getTime();
  const t = Date.parse(v.replace(/(\d+)\. /,"$1 ")); return isNaN(t) ? 0 : t;
}

async function addRow(p, props={}){
  const tcol = p.schema.find(c=>c.type==="title")?.name || "Name";
  const r = await api("POST","/api/page",{kind:"row", parent_id:p.id, title:"", props:{...props, [tcol]:""}});
  go(r.id);
}

function addColumn(p, anchor){
  const pop = popover(anchor);
  const name = h("input",{placeholder:"Spaltenname"});
  const type = h("select",{}, Object.entries(TYPES).filter(([k])=>k!=="title").map(([k,v])=>h("option",{value:k},v)));
  const ok = async () => { const n=name.value.trim(); if(!n) return; if (p.schema.some(c=>c.name===n)) return toast("Name existiert schon");
    p.schema.push({name:n, type:type.value}); await save(p.id,{schema:p.schema}); closePop(); openPage(p.id); };
  name.onkeydown = e => { if (e.key==="Enter") ok(); };
  pop.append(h("label",{},"Name"), name, h("label",{},"Typ"), type, h("button",{class:"item", style:"color:var(--accent)", onclick:ok},"Hinzufügen"));
  name.focus();
}

function colMenu(p, ci, anchor, st, redraw){
  const col = p.schema[ci];
  const pop = popover(anchor);
  const name = h("input",{value:col.name});
  const type = h("select",{disabled: col.type==="title"}, Object.entries(TYPES).filter(([k])=>col.type==="title"||k!=="title").map(([k,v])=>h("option",{value:k, selected:k===col.type},v)));
  const apply = async () => {
    const nn = name.value.trim() || col.name;
    if (nn !== col.name){
      if (p.schema.some(c=>c.name===nn)) return toast("Name existiert schon");
      // Werte in allen Zeilen umbenennen
      for (const r of p.rows){ if (col.name in r.props){ r.props[nn] = r.props[col.name]; delete r.props[col.name]; await api("PUT",`/api/page/${r.id}`,{props:r.props}); } }
      if (st.sort===col.name) st.sort = nn;
      col.name = nn;
    }
    col.type = type.value;
    await save(p.id,{schema:p.schema}); closePop(); redraw();
  };
  name.onkeydown = e => { if (e.key==="Enter") apply(); };
  pop.append(h("label",{},"Name"), name, h("label",{},"Typ"), type,
    h("button",{class:"item", style:"color:var(--accent)", onclick:apply},"Übernehmen"),
    h("button",{class:"item", onclick:()=>{st.sort=col.name; st.dir=1; setDbState(p.id,st); closePop(); redraw();}},"↑ Aufsteigend sortieren"),
    h("button",{class:"item", onclick:()=>{st.sort=col.name; st.dir=-1; setDbState(p.id,st); closePop(); redraw();}},"↓ Absteigend sortieren"),
    st.sort ? h("button",{class:"item", onclick:()=>{st.sort=null; setDbState(p.id,st); closePop(); redraw();}},"Sortierung entfernen") : null,
    ci>1 ? h("button",{class:"item", onclick:async()=>{ [p.schema[ci-1],p.schema[ci]]=[p.schema[ci],p.schema[ci-1]]; await save(p.id,{schema:p.schema}); closePop(); redraw(); }},"← Nach links") : null,
    ci>0 && ci<p.schema.length-1 ? h("button",{class:"item", onclick:async()=>{ [p.schema[ci+1],p.schema[ci]]=[p.schema[ci],p.schema[ci+1]]; await save(p.id,{schema:p.schema}); closePop(); redraw(); }},"→ Nach rechts") : null,
    col.type!=="title" ? h("button",{class:"item danger", onclick:async()=>{ if(!confirm(`Spalte „${col.name}“ löschen? Die Werte bleiben in den Einträgen gespeichert, werden aber nicht mehr angezeigt.`)) return; p.schema.splice(ci,1); await save(p.id,{schema:p.schema}); closePop(); redraw(); }},"Spalte löschen") : null);
  name.focus(); name.select();
}

function rowMenu(p, r, e, redraw){
  const pop = popover(null, e.clientX, e.clientY);
  pop.append(
    h("button",{class:"item", onclick:()=>{closePop(); go(r.id);}},"↗ Öffnen"),
    h("button",{class:"item", onclick:async()=>{ closePop(); const n = await api("POST","/api/page",{kind:"row", parent_id:p.id, title:r.title+" (Kopie)", props:{...r.props}}); const full = await api("GET",`/api/page/${r.id}`); await api("PUT",`/api/page/${n.id}`,{content:full.content, title:r.title+" (Kopie)"}); openPage(p.id); }},"⧉ Duplizieren"),
    h("button",{class:"item danger", onclick:async()=>{ closePop(); await api("DELETE",`/api/page/${r.id}`); p.rows = p.rows.filter(x=>x.id!==r.id); redraw(); toast("In den Papierkorb verschoben"); }},"🗑 Löschen"));
}

// ---------------------------------------------------------------------------
// Popover / Dialoge
// ---------------------------------------------------------------------------
let POP = null;
function popover(anchor, x, y){
  closePop();
  const pop = h("div",{class:"pop"});
  document.body.append(pop);
  const r = anchor ? anchor.getBoundingClientRect() : {left:x, bottom:y, top:y};
  pop.style.left = Math.min(r.left, innerWidth-260)+"px";
  pop.style.top = Math.min(r.bottom+4, innerHeight-320)+"px";
  POP = pop;
  setTimeout(()=>document.addEventListener("mousedown", outside), 0);
  return pop;
}
function outside(e){ if (POP && !POP.contains(e.target)) closePop(); }
function closePop(){ if (POP){ POP.remove(); POP=null; document.removeEventListener("mousedown", outside); } }

function dialog(content){
  const ov = h("div",{class:"overlay", onclick:e=>{ if(e.target===ov) ov.remove(); }}, h("div",{class:"dialog"}, content));
  document.body.append(ov);
  const onKey = e => { if (e.key==="Escape"){ ov.remove(); document.removeEventListener("keydown", onKey); } };
  document.addEventListener("keydown", onKey);
  return ov;
}

function openSearch(){
  const q = h("input",{class:"q", placeholder:"Alles durchsuchen …"});
  const res = h("div",{class:"res"});
  let sel = 0, items = [];
  const ov = dialog([q, res]);
  const draw = () => { res.innerHTML = ""; items.forEach((r,i)=>res.append(h("a",{class:"r"+(i===sel?" sel":""), onclick:()=>{ov.remove(); go(r.id);}},
    (r.icon||defaultIcon(r.kind))+" "+(r.title||"Ohne Titel"), r.kind==="row"?h("span",{class:"hint"}," · Eintrag"):null, r.snippet?h("small",{},r.snippet):null))); };
  q.oninput = debounce(async ()=>{ items = await api("GET","/api/search?q="+encodeURIComponent(q.value)); sel=0; draw(); }, 150);
  q.onkeydown = e => {
    if (e.key==="ArrowDown"){ sel=Math.min(sel+1, items.length-1); draw(); e.preventDefault(); }
    if (e.key==="ArrowUp"){ sel=Math.max(sel-1,0); draw(); e.preventDefault(); }
    if (e.key==="Enter" && items[sel]){ ov.remove(); go(items[sel].id); }
  };
  q.focus();
}

function openImport(){
  const inp = h("input",{type:"file", accept:".zip", style:"display:none", multiple:true});
  const zone = h("div",{class:"drop-zone"},"Notion-Export (.zip) hierher ziehen oder klicken");
  const log = h("div",{class:"log", style:"display:none"});
  const ov = dialog(h("div",{class:"body"},
    h("h2",{},"📥 Notion importieren"),
    h("ol",{},
      h("li",{},"In Notion: ", h("b",{},"Einstellungen → Arbeitsbereich → Allgemein → Inhalte exportieren"), " (bzw. „Export all workspace content“)."),
      h("li",{},"Format: ", h("b",{},"Markdown & CSV"), ", „Inklusive Unterseiten“ und „Ordner für Unterseiten erstellen“ aktivieren, Dateien & Bilder einschließen."),
      h("li",{},"Die heruntergeladene ZIP-Datei hier ablegen (nicht entpacken).")),
    zone, inp, log,
    h("p",{class:"hint"},"Sehr große Exporte (mehrere GB) lieber über das Terminal importieren: ", h("code",{},"python3 app.py import Export.zip"), ". Ein erneuter Import desselben Exports aktualisiert vorhandene Seiten.")));
  zone.onclick = () => inp.click();
  zone.ondragover = e => { e.preventDefault(); zone.classList.add("on"); };
  zone.ondragleave = () => zone.classList.remove("on");
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove("on"); run([...e.dataTransfer.files]); };
  inp.onchange = () => run([...inp.files]);
  async function run(files){
    log.style.display = "block";
    for (const f of files){
      log.textContent += `Lade ${f.name} (${(f.size/1048576).toFixed(1)} MB) …\n`;
      try {
        const r = await api("POST","/api/import", f, true);
        log.textContent += r.log.join("\n") + "\n";
      } catch(e){ log.textContent += "Fehler: " + e.message + "\n"; }
    }
    await loadTree(); route();
    log.textContent += "✓ Fertig.";
  }
}

async function openTrash(){
  const list = await api("GET","/api/trash");
  const body = h("div",{class:"body"}, h("h2",{},"🗑️ Papierkorb"));
  if (!list.length) body.append(h("p",{class:"hint"},"Der Papierkorb ist leer."));
  const ov = dialog(body);
  for (const t of list){
    body.append(h("div",{style:"display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)"},
      h("a",{href:"#/p/"+t.id, style:"flex:1;text-decoration:none", onclick:()=>ov.remove()}, (t.icon||defaultIcon(t.kind))+" "+(t.title||"Ohne Titel")),
      h("button",{class:"btn", onclick:async()=>{ await api("POST",`/api/restore/${t.id}`); ov.remove(); await loadTree(); toast("Wiederhergestellt"); openTrash(); }},"Wiederherstellen"),
      h("button",{class:"btn", style:"color:var(--danger)", onclick:async()=>{ if(!confirm("Endgültig löschen? Das kann nicht rückgängig gemacht werden.")) return; await api("DELETE",`/api/page/${t.id}?endgueltig=1`); ov.remove(); openTrash(); }},"Endgültig löschen")));
  }
}

async function newPage(parent_id=null, kind="page"){
  const r = await api("POST","/api/page",{kind, parent_id, title:""});
  if (parent_id){ EXPANDED.add(parent_id); saveExpanded(); }
  await loadTree(); go(r.id);
  setTimeout(()=>$("h1.title")?.focus(), 150);
}

function moreMenu(e){
  if (!CURRENT) return;
  const p = CURRENT;
  const pop = popover(e.currentTarget);
  pop.style.left = Math.min(e.currentTarget.getBoundingClientRect().left-180, innerWidth-260)+"px";
  pop.append(
    p.kind==="page" ? h("button",{class:"item", onclick:()=>{closePop(); newPage(p.id);}},"＋ Unterseite") : null,
    p.kind==="page" ? h("button",{class:"item", onclick:()=>{closePop(); newPage(p.id,"database");}},"＋ Unter-Datenbank") : null,
    p.kind!=="row" ? h("button",{class:"item", onclick:()=>{closePop(); movePage(p);}},"↪ Verschieben nach …") : null,
    h("button",{class:"item", onclick:()=>{closePop(); navigator.clipboard?.writeText(`[${p.title}](#/p/${p.id})`); toast("Link kopiert – in eine Seite einfügen");}},"🔗 Link zu dieser Seite kopieren"),
    h("div",{class:"hint", style:"padding:4px 8px"}, "Erstellt: "+p.created.replace("T"," ")+"\nGeändert: "+p.updated.replace("T"," ")),
    h("button",{class:"item danger", onclick:async()=>{ closePop(); await api("DELETE",`/api/page/${p.id}`); await loadTree(); toast("In den Papierkorb verschoben"); if (p.parent_id) go(p.parent_id); else location.hash=""; }},"🗑 Löschen"));
}

function movePage(p){
  const q = h("input",{class:"q", placeholder:"Ziel suchen … (leer = oberste Ebene)"});
  const res = h("div",{class:"res"});
  const ov = dialog([q,res]);
  const draw = () => { res.innerHTML = "";
    res.append(h("a",{class:"r", onclick:()=>mv(null)},"⬆ Oberste Ebene"));
    const s = q.value.toLowerCase();
    for (const n of TREE.filter(n=>n.kind==="page" && n.id!==p.id && (n.title||"").toLowerCase().includes(s)).slice(0,50))
      res.append(h("a",{class:"r", onclick:()=>mv(n.id)}, (n.icon||defaultIcon(n.kind))+" "+(n.title||"Ohne Titel"))); };
  const mv = async target => { try{ await api("PUT",`/api/page/${p.id}`,{parent_id:target}); ov.remove(); await loadTree(); openPage(p.id); toast("Verschoben"); }catch(e){ toast(e.message); } };
  q.oninput = draw; draw(); q.focus();
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
$("#btnSearch").onclick = openSearch;
$("#btnImport").onclick = openImport;
$("#btnExport").onclick = () => { location.href = "/api/export.zip"; };
$("#btnTrash").onclick = openTrash;
$("#btnNewPage").onclick = () => newPage(null);
$("#btnNewDb").onclick = () => newPage(null, "database");
$("#btnMore").onclick = moreMenu;
$("#menuBtn").onclick = () => document.body.classList.toggle("side-open");
document.addEventListener("keydown", e => { if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); } });
window.addEventListener("beforeunload", () => { if (saveTimer) saveTimer.flush(); });
loadTree().then(route);
</script>
