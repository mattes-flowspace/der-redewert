function notifyDb(dbId){ for (const inst of LIVE) if (inst.p.id===dbId) inst.reload(); }
let DRAG = null;   // laufender Karten-Drag
document.addEventListener("touchmove", e => { if (DRAG) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", e => { if (DRAG) e.preventDefault(); });

async function mountDatabase(host, dbId, viewKey, opt={}){
  let p = opt.preloaded;
  if (!p){
    host.append(h("div",{class:"hint"},"Lädt …"));
    try { p = await api("GET", `/api/page/${dbId}`); }
    catch(e){ host.innerHTML=""; host.append(h("div",{class:"hint"},"⚠️ Eingebettete Datenbank nicht gefunden.")); return; }
  }
  host.innerHTML = "";
  const hasSelect = p.schema.some(c=>c.type==="select");
  const st = Object.assign({view: hasSelect?"board":"table", sort:null, dir:1, filter:"", group:null, hidden:[], cardProps:null}, META.views[viewKey]||{});
  const persist = () => { const {view,sort,dir,filter,group,hidden,cardProps} = st; META.views[viewKey] = {view,sort,dir,filter,group,hidden,cardProps}; saveMeta("views"); };
  const saveSchema = () => save(p.id,{schema:p.schema});
  const tcol = () => p.schema.find(c=>c.type==="title")?.name || "Name";
  let qaGroup = null, editRowId = null;

  const body = h("div");
  const filterInp = h("input",{class:"filter", placeholder:"🔍 Filtern …", value:st.filter});
  filterInp.oninput = debounce(()=>{ st.filter = filterInp.value; persist(); draw(); }, 200);
  const tabs = h("span",{style:"display:flex"});
  const bar = h("div",{class:"dbbar"}, tabs, h("span",{class:"sp"}), filterInp,
    h("button",{class:"btn", title:"Ansicht anpassen", onclick:e=>viewMenu(e.currentTarget)},"⚙ Ansicht"),
    h("button",{class:"btn primary", onclick:()=>quickNew()},"＋ Neu"));
  if (opt.embed) host.append(h("div",{class:"embed-h"}, h("a",{href:"#/p/"+p.id, title:"Als ganze Seite öffnen"}, (p.icon||"🗃️")+" "+(p.title||"Ohne Titel"))));
  host.append(bar, body);

  const inst = { p, reload: debounce(async () => {
    try { const np = await api("GET", `/api/page/${dbId}`); p.rows = np.rows; p.schema = np.schema; p.title = np.title; draw(); } catch(e){}
  }, 300) };
  LIVE.push(inst);

  const sortedRows = () => {
    let rows = p.rows.slice().sort((a,b)=>(a.sort-b.sort) || String(a.title).localeCompare(String(b.title),"de"));
    const q = st.filter.trim().toLowerCase();
    if (q) rows = rows.filter(r => (r.title+" "+Object.values(r.props).join(" ")).toLowerCase().includes(q));
    if (st.sort){
      const col = p.schema.find(c=>c.name===st.sort);
      if (col){
        const key = r => { const v = col.type==="title" ? r.title : (r.props[st.sort]||""); if (col.type==="number") return parseFloat(String(v).replace(/\./g,"").replace(",","."))||0; if (col.type==="date") return dateSortKey(v); if (col.type==="checkbox") return isOn(v)?1:0; return String(v).toLowerCase(); };
        rows.sort((a,b)=>{ const x=key(a), y=key(b); return (x<y?-1:x>y?1:0)*st.dir; });
      }
    }
    return rows;
  };

  const draw = () => {
    tabs.innerHTML = "";
    for (const [k,lb] of [["board","▥ Board"],["table","▦ Tabelle"]]) tabs.append(h("button",{class:"tab"+(st.view===k?" on":""), onclick:()=>{st.view=k; persist(); draw();}}, lb));
    const sl = body.querySelector(".board")?.scrollLeft, tl = body.querySelector(".tablewrap")?.scrollLeft;
    body.innerHTML = "";
    body.append(st.view==="board" ? drawBoard() : drawTable());
    if (sl && body.querySelector(".board")) body.querySelector(".board").scrollLeft = sl;
    if (tl && body.querySelector(".tablewrap")) body.querySelector(".tablewrap").scrollLeft = tl;
    body.querySelector("textarea.qa")?.focus();
  };

  const createRow = async (title, props={}) => {
    const full = {...props, [tcol()]: title};
    const r = await api("POST","/api/page",{kind:"row", parent_id:p.id, title, props:full});
    const maxSort = Math.max(0, ...p.rows.map(x=>x.sort||0)) + 1;
    const row = {id:r.id, title, props:full, icon:"", sort:maxSort, has_content:false};
    p.rows.push(row);
    return row;
  };
  const quickNew = async () => {
    if (st.view==="board"){ const gc = groupCol(); const first = gc && visibleGroups(gc)[0]; qaGroup = first ? first.key : ""; draw(); return; }
    const row = await createRow(""); editRowId = row.id; draw();
  };
  const removeRow = async r => {
    await api("DELETE",`/api/page/${r.id}`); p.rows = p.rows.filter(x=>x.id!==r.id); draw();
    toast("„"+(r.title||"Ohne Titel")+"“ gelöscht", "Rückgängig", async()=>{ await api("POST",`/api/restore/${r.id}`); inst.reload(); });
  };
  const rowMenu = (r, e) => {
    const pop = popover(null, e.clientX, e.clientY);
    pop.append(
      h("button",{class:"item", onclick:()=>{closePop(); openPeek(r.id);}},"◧ In Seitenleiste öffnen"),
      h("button",{class:"item", onclick:()=>{closePop(); go(r.id);}},"⤢ Als ganze Seite öffnen"),
      h("button",{class:"item", onclick:async()=>{ closePop(); await api("POST",`/api/duplicate/${r.id}`); inst.reload(); }},"⧉ Duplizieren"),
      h("hr"),
      h("button",{class:"item danger", onclick:()=>{ closePop(); removeRow(r); }},"🗑 Löschen"));
  };

  // ---------------- Tabelle ----------------
  const drawTable = () => {
    const rows = sortedRows();
    const tw = h("div",{class:"tablewrap"});
    const t = h("table",{class:"db"});
    const tr = h("tr");
    p.schema.forEach((col, ci) => {
      tr.append(h("th",{class:col.type==="checkbox"?"narrow":"", title:col.name, onclick:e=>colMenu(ci, e.currentTarget)}, col.type==="checkbox" ? col.name : [h("span",{style:"opacity:.6;margin-right:6px"}, typeIcon(col.type)), col.name], st.sort===col.name ? (st.dir>0?" ↑":" ↓") : ""));
    });
    tr.append(h("th",{title:"Spalte hinzufügen", style:"width:36px;text-align:center", onclick:e=>addColumn(e.currentTarget)},"＋"));
    t.append(h("thead",{},tr));
    const tb = h("tbody");
    for (const r of rows){
      const row = h("tr");
      for (const col of p.schema){
        const cell = h("div",{class:"cell"});
        if (col.type==="title"){
          const drawT = () => { cell.innerHTML=""; cell.append(...(r.icon?[h("span",{},r.icon)]:[]), h("span",{class:"tt"}, r.title || h("span",{style:"color:var(--muted);font-weight:400"},"Ohne Titel")), h("button",{class:"open", onclick:e=>{e.stopPropagation(); openPeek(r.id);}},"ÖFFNEN")); };
          drawT();
          cell.onclick = e => { if (e.target.closest("button")) return; const tt=$(".tt",cell); if(!tt) return; editCell(tt, {type:"title"}, r.title, async val => { r.title = val; r.props[col.name]=val; drawT(); await save(r.id,{title:val}); }, p, drawT); };
          if (editRowId===r.id) setTimeout(()=>{ editRowId=null; cell.click(); },0);
          row.append(h("td",{class:"tcell"}, cell));
        } else {
          const redraw = () => renderCellValue(cell, col, r.props[col.name]);
          redraw();
          cell.onclick = e => { if (e.target.closest("a")) return; editCell(cell, col, r.props[col.name]||"", async val => { r.props[col.name]=val; redraw(); await save(r.id,{props:r.props}); }, p, redraw); };
          row.append(h("td",{class:col.type==="checkbox"?"narrow":""}, cell));
        }
      }
      row.append(h("td",{style:"min-width:36px;text-align:center"}, h("button",{style:"color:var(--muted);padding:6px 8px", title:"Mehr", onclick:e=>{ const b=e.currentTarget.getBoundingClientRect(); rowMenu(r,{clientX:b.left-200,clientY:b.bottom}); }},"⋯")));
      row.oncontextmenu = e => { if (e.target.closest("input,textarea")) return; e.preventDefault(); rowMenu(r, e); };
      tb.append(row);
    }
    t.append(tb);
    tw.append(t);
    return h("div",{}, tw, h("div",{class:"newrow", onclick:quickNew},"＋ Neu"),
      h("div",{class:"hint", style:"padding:2px 8px"}, rows.length===p.rows.length ? `${rows.length} Einträge` : `${rows.length} von ${p.rows.length} Einträgen`));
  };

  // ---------------- Board ----------------
  const groupable = () => p.schema.filter(c=>c.type==="select" || c.type==="multi_select" || c.type==="checkbox");
  const groupCol = () => { const g = groupable(); if (!g.length) return null; return g.find(c=>c.name===st.group) || g.find(c=>/status|phase|stage/i.test(c.name)) || g.find(c=>c.type==="select") || g[0]; };
  const allGroups = col => col.type==="checkbox" ? [{key:"Yes", label:"✓ Ja"},{key:"No", label:"Nein"}]
      : [{key:"", label:"Ohne "+col.name}, ...colOptions(p, col).map(o=>({key:o.name, label:o.name}))];
  const visibleGroups = col => allGroups(col).filter(g=>!st.hidden.includes(g.key));
  const inGroup = (r, col, g) => { const v=(r.props[col.name]||"").trim();
    if (col.type==="checkbox") return (isOn(v)?"Yes":"No")===g;
    if (col.type==="multi_select") return g==="" ? !v : v.split(",").map(s=>s.trim()).includes(g);
    return v===g; };
  const defaultCardProps = col => p.schema.filter(c=>c.name!==col.name && ["select","multi_select","date"].includes(c.type)).map(c=>c.name);

  const drawBoard = () => {
    const col = groupCol();
    if (!col) return h("div",{class:"hint", style:"padding:20px"},"Für das Board wird eine Spalte vom Typ „Auswahl“ benötigt (z. B. Status). ",
      h("button",{class:"btn", style:"text-decoration:underline", onclick:async()=>{ p.schema.push({name:"Status", type:"select", options:[{name:"Offen",color:"gray"},{name:"In Arbeit",color:"blue"},{name:"Erledigt",color:"green"}]}); await saveSchema(); draw(); }},"Status-Spalte anlegen"));
    const rows = sortedRows();
    const shown = st.cardProps || defaultCardProps(col);
    const board = h("div",{class:"board"});
    const hiddenBox = h("div",{class:"hiddencols"});
    for (const g of allGroups(col)){
      const items = rows.filter(r=>inGroup(r, col, g.key));
      if (g.key==="" && !items.length && qaGroup!=="") continue;
      if (st.hidden.includes(g.key)){
        hiddenBox.append(h("div",{class:"hc", title:"Einblenden", onclick:()=>{ st.hidden = st.hidden.filter(x=>x!==g.key); persist(); draw(); }}, g.key ? tagEl(col,g.key) : g.label, h("span",{}, items.length)));
        continue;
      }
      const c = h("div",{class:"col", "data-g":g.key, style:`background:${g.key && col.type!=="checkbox" ? `color-mix(in srgb, ${optColor(col,g.key)} 38%, transparent)` : "var(--hover)"}`});
      c.append(h("h4",{}, g.key && col.type!=="checkbox" ? tagEl(col,g.key) : h("span",{style:"color:var(--muted)"}, g.label), h("span",{class:"n"}, items.length), h("span",{class:"sp"}),
        h("button",{title:"Spalte bearbeiten", onclick:e=>groupMenu(col, g, e.currentTarget)},"⋯"),
        h("button",{title:"Karte hinzufügen", onclick:()=>{ qaGroup=g.key; draw(); }},"＋")));
      const cards = h("div",{class:"cards"});
      for (const r of items) cards.append(cardEl(r, col, shown));
      c.append(cards);
      if (qaGroup===g.key){
        const ta = h("textarea",{class:"qa", rows:2, placeholder:"Titel eingeben · Enter legt an · Esc schließt"});
        const create = async keep => { const t = ta.value.trim(); if (!t){ if(!keep){ qaGroup=null; draw(); } return; } ta.value="";
          const props = {}; if (g.key) props[col.name] = g.key; else if (col.type==="checkbox") props[col.name]="No";
          let row; try { row = await createRow(t, props); } catch(e){ toast(e.message); ta.value = t; return; }
          if (keep && ta.isConnected){ cards.append(cardEl(row, col, shown)); const n = $("h4 .n", c); n.textContent = +n.textContent+1; ta.focus(); ta.scrollIntoView({block:"nearest"}); }
          else { qaGroup=null; draw(); } };
        ta.onkeydown = e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); create(true); } if (e.key==="Escape"){ e.preventDefault(); qaGroup=null; draw(); } };
        ta.onblur = () => { if (qaGroup===g.key) create(false); };
        c.append(ta);
      } else c.append(h("div",{class:"newrow", onclick:()=>{ qaGroup=g.key; draw(); }},"＋ Neu"));
      board.append(c);
    }
    if (col.type!=="checkbox") board.append(h("div",{class:"addgroup", onclick:async()=>{ const n=(prompt("Name der neuen Spalte:")||"").replace(/,/g," ").trim(); if(!n) return; if(!col.options.some(o=>o.name===n)){ col.options.push({name:n}); await saveSchema(); } draw(); }},"＋ Spalte"));
    if (hiddenBox.childNodes.length){ hiddenBox.prepend(h("div",{class:"hint", style:"margin:0 6px"},"Ausgeblendet")); board.append(hiddenBox); }
    return board;
  };

  const cardEl = (r, col, shown) => {
    const card = h("div",{class:"cardx", "data-id":r.id});
    card.append(h("div",{class:"t"}, (r.icon?r.icon+" ":"")+(r.title||"Ohne Titel")));
    for (const name of shown){
      const x = p.schema.find(c=>c.name===name); if (!x || x.type==="title") continue;
      const v = r.props[name];
      if (x.type==="checkbox"){
        const cb = h("input",{type:"checkbox", class:"cb", checked:isOn(v), style:"margin:0"});
        cb.onclick = async e => { e.stopPropagation(); r.props[name] = cb.checked?"Yes":"No"; await save(r.id,{props:r.props}); };
        card.append(h("label",{class:"m", onclick:e=>e.stopPropagation()}, cb, h("span",{}, name)));
        continue;
      }
      if (!v) continue;
      const m = h("div",{class:"m"}); renderCellValue(m, x, v);
      if (x.type==="date") m.prepend(h("span",{class:"k"},"📅"));
      else if (!["select","multi_select"].includes(x.type)) m.prepend(h("span",{class:"k"}, name+":"));
      card.append(m);
    }
    if (r.has_content) card.append(h("div",{class:"m", title:"Hat Inhalt"},"≡"));
    card.onclick = () => { if (card._dragged){ card._dragged=false; return; } openPeek(r.id); };
    card.oncontextmenu = e => { e.preventDefault(); if (!DRAG) rowMenu(r, e); };
    enableDrag(card, r, col);
    return card;
  };

  // Drag & Drop mit Maus und Touch (langes Drücken)
  const enableDrag = (card, r, col) => {
    card.addEventListener("pointerdown", e => {
      if (e.button!==0 || e.target.closest("input,button,a,textarea,label")) return;
      const touch = e.pointerType!=="mouse", pid = e.pointerId, sx = e.clientX, sy = e.clientY;
      let active = false, ghost, ph, timer, scrollTimer, lx = sx, ly = sy, ox, oy;
      const board = card.closest(".board");
      const start = () => {
        active = true; DRAG = card; closePop();
        const b = card.getBoundingClientRect(); ox = sx-b.left; oy = sy-b.top;
        ghost = card.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width = b.width+"px";
        document.body.append(ghost);
        ph = h("div",{class:"ph", style:`height:${b.height}px`});
        card.classList.add("dragging"); card.after(ph);
        document.body.style.userSelect = "none";
        scrollTimer = setInterval(()=>{ const br = board.getBoundingClientRect();
          if (lx > br.right-50) board.scrollLeft += 14; else if (lx < br.left+50) board.scrollLeft -= 14;
          const m = card.closest(".peek-body") || $("#main"), mr = m.getBoundingClientRect();
          if (ly > mr.bottom-50) m.scrollTop += 12; else if (ly < mr.top+70) m.scrollTop -= 12;
          place(); }, 30);
        move();
      };
      const place = () => {
        // Spalte anhand der horizontalen Position bestimmen – so zählt auch der leere Bereich unter kurzen Spalten
        const br = board.getBoundingClientRect();
        const c = (ly > br.top-80 && ly < br.bottom+200) ? [...board.querySelectorAll(".col")].find(x => { const b=x.getBoundingClientRect(); return lx>=b.left-5 && lx<=b.right+5; }) : null;
        board.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"));
        if (!c) return;
        c.classList.add("over");
        const list = $(".cards", c);
        const others = [...list.querySelectorAll(".cardx:not(.dragging)")];
        const before = others.find(o => { const b=o.getBoundingClientRect(); return ly < b.top + b.height/2; });
        if (before) list.insertBefore(ph, before); else list.append(ph);
      };
      const move = () => { ghost.style.left = (lx-ox)+"px"; ghost.style.top = (ly-oy)+"px"; place(); };
      const onMove = ev => {
        if (ev.pointerId!==pid) return;
        lx = ev.clientX; ly = ev.clientY;
        if (!active){
          const d = Math.hypot(lx-sx, ly-sy);
          if (touch){ if (d>10) cleanup(); return; }
          if (d<6) return;
          start();
        }
        ev.preventDefault(); move();
      };
      const cleanup = () => {
        clearTimeout(timer); clearInterval(scrollTimer);
        document.removeEventListener("pointermove", onMove); document.removeEventListener("pointerup", onUp); document.removeEventListener("pointercancel", onCancel);
        document.body.style.userSelect = "";
      };
      const endVisual = () => { ghost?.remove(); card.classList.remove("dragging"); board.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over")); DRAG = null; };
      const onCancel = ev => { if (ev.pointerId!==pid) return; cleanup(); if (active){ ph.remove(); endVisual(); } };
      const onUp = async ev => {
        if (ev.pointerId!==pid) return;
        cleanup();
        if (!active) return;
        card._dragged = true; setTimeout(()=>{ card._dragged=false; }, 50);
        const c = ph.closest(".col");
        const g = c?.dataset.g;
        // Neue Reihenfolge der Zielspalte: Platzhalter steht für die gezogene Karte
        const final = [];
        for (const x of (c ? [...$(".cards",c).children] : [])){ if (x===ph) final.push(r.id); else if (x!==card && x.dataset.id) final.push(x.dataset.id); }
        ph.remove(); endVisual();
        if (!c) return;
        const updates = {};
        const prevVal = r.props[col.name] || "";
        let nv;
        if (col.type==="checkbox") nv = g;
        else if (col.type==="multi_select"){
          const from = card.closest(".col")?.dataset.g;
          let toks = prevVal.split(",").map(s=>s.trim()).filter(Boolean).filter(t=>t!==from);
          if (g && !toks.includes(g)) toks.push(g);
          nv = g==="" ? "" : toks.join(", ");
        } else nv = g;
        if (nv !== prevVal){ r.props[col.name] = nv; updates[r.id] = {id:r.id, props:r.props}; }
        if (!st.sort){
          const byId = Object.fromEntries(p.rows.map(x=>[x.id,x]));
          final.forEach((id,i) => { const row = byId[id]; if (row && row.sort!==i){ row.sort = i; (updates[id] ||= {id}).sort = i; } });
        }
        draw();
        const list = Object.values(updates);
        if (list.length){ setStatus("Speichert …"); try { await api("POST","/api/batch",{updates:list}); setStatus("✓ Gespeichert"); setTimeout(()=>setStatus(""),1200); } catch(err){ setStatus("⚠️ Nicht gespeichert"); toast(err.message); inst.reload(); } }
      };
      document.addEventListener("pointermove", onMove); document.addEventListener("pointerup", onUp); document.addEventListener("pointercancel", onCancel);
      if (touch) timer = setTimeout(()=>{ start(); navigator.vibrate?.(12); }, 320);
    });
  };

  // ---------------- Menüs ----------------
  const groupMenu = (col, g, anchor) => {
    const pop = popover(anchor);
    const hide = h("button",{class:"item", onclick:()=>{ st.hidden=[...st.hidden, g.key]; persist(); closePop(); draw(); }},"🙈 Spalte ausblenden");
    if (col.type==="checkbox" || g.key===""){ pop.append(hide); return; }
    const o = col.options.find(x=>x.name===g.key); const idx = col.options.indexOf(o);
    const name = h("input",{value:g.key});
    const rename = async () => { const nn = name.value.replace(/,/g," ").trim(); if (!nn || nn===g.key) return closePop();
      try { const res = await api("POST",`/api/db/${p.id}/op`,{op:"rename_option", column:col.name, from:g.key, to:nn});
        st.hidden = st.hidden.map(x=>x===g.key?nn:x); persist(); closePop(); p.schema = res.schema; inst.reload(); } catch(e){ toast(e.message); } };
    name.onkeydown = e => { if (e.key==="Enter") rename(); };
    const sw = h("div",{class:"swatches"}, TAGCOLORS.map(c=>h("button",{title:COLORNAMES[c], class:(o.color||hashColor(o.name))===c?"on":"", style:`background:var(--t-${c})`, onclick:async()=>{ o.color=c; await saveSchema(); closePop(); draw(); }})));
    const mv = async d => { const j = idx+d; if (j<0 || j>=col.options.length) return; [col.options[idx], col.options[j]] = [col.options[j], col.options[idx]]; await saveSchema(); closePop(); draw(); };
    pop.append(h("label",{},"Name"), name, h("label",{},"Farbe"), sw, h("hr"),
      idx>0 ? h("button",{class:"item", onclick:()=>mv(-1)},"← Nach links") : null,
      idx<col.options.length-1 ? h("button",{class:"item", onclick:()=>mv(1)},"→ Nach rechts") : null,
      hide, h("hr"),
      h("button",{class:"item danger", onclick:async()=>{ const n = p.rows.filter(r=>inGroup(r,col,g.key)).length;
        if (n && !confirm(`Spalte „${g.key}“ löschen? ${n} Karte(n) bleiben erhalten und landen unter „Ohne ${col.name}“.`)) return;
        try { await api("POST",`/api/db/${p.id}/op`,{op:"delete_option", column:col.name, name:g.key}); closePop(); inst.reload(); } catch(e){ toast(e.message); } }},"🗑 Spalte löschen"));
    name.focus(); name.select();
  };

  const viewMenu = anchor => {
    const pop = popover(anchor);
    const sortSel = h("select",{}, h("option",{value:""}, st.view==="board" ? "Manuell (Karten ziehen)" : "Manuell"), p.schema.map(c=>h("option",{value:c.name, selected:st.sort===c.name}, c.name)));
    sortSel.onchange = () => { st.sort = sortSel.value || null; persist(); draw(); };
    const dirSel = h("select",{}, h("option",{value:"1", selected:st.dir>0},"Aufsteigend"), h("option",{value:"-1", selected:st.dir<0},"Absteigend"));
    dirSel.onchange = () => { st.dir = +dirSel.value; persist(); draw(); };
    pop.append(h("label",{},"Sortieren nach"), sortSel, dirSel);
    if (st.view==="board"){
      const col = groupCol();
      if (col){
        const g = h("select",{}, groupable().map(c=>h("option",{value:c.name, selected:c.name===col.name}, c.name)));
        g.onchange = () => { st.group = g.value; st.hidden = []; st.cardProps = null; persist(); closePop(); draw(); };
        pop.append(h("label",{},"Gruppieren nach"), g, h("label",{},"Auf den Karten anzeigen"));
        const shown = new Set(st.cardProps || defaultCardProps(col));
        for (const c of p.schema.filter(c=>c.type!=="title" && c.name!==col.name)){
          const cb = h("input",{type:"checkbox", checked:shown.has(c.name)});
          cb.onchange = () => { cb.checked ? shown.add(c.name) : shown.delete(c.name); st.cardProps = p.schema.map(x=>x.name).filter(n=>shown.has(n)); persist(); draw(); };
          pop.append(h("label",{class:"chk"}, cb, c.name));
        }
        pop.append(h("label",{},"Spalten"));
        for (const gr of allGroups(col)){
          const cb = h("input",{type:"checkbox", checked:!st.hidden.includes(gr.key)});
          cb.onchange = () => { st.hidden = cb.checked ? st.hidden.filter(x=>x!==gr.key) : [...st.hidden, gr.key]; persist(); draw(); };
          pop.append(h("label",{class:"chk"}, cb, gr.label));
        }
      }
    }
    pop.append(h("hr"), h("button",{class:"item", onclick:e=>{ addColumn(anchor); }},"＋ Eigenschaft hinzufügen"));
  };

  const addColumn = anchor => {
    const pop = popover(anchor);
    const name = h("input",{placeholder:"Name der Eigenschaft"});
    const type = h("select",{}, Object.entries(TYPES).filter(([k])=>k!=="title").map(([k,v])=>h("option",{value:k},v)));
    const ok = async () => { const n=name.value.trim(); if(!n) return; if (p.schema.some(c=>c.name===n)) return toast("Diesen Namen gibt es schon");
      p.schema.push({name:n, type:type.value}); await saveSchema(); closePop(); draw(); };
    name.onkeydown = e => { if (e.key==="Enter") ok(); };
    pop.append(h("label",{},"Name"), name, h("label",{},"Typ"), type, h("button",{class:"item", style:"color:var(--accent)", onclick:ok},"Hinzufügen"));
    name.focus();
  };

  const colMenu = (ci, anchor) => {
    const col = p.schema[ci];
    const pop = popover(anchor);
    const name = h("input",{value:col.name});
    const type = h("select",{disabled: col.type==="title"}, Object.entries(TYPES).filter(([k])=>col.type==="title"||k!=="title").map(([k,v])=>h("option",{value:k, selected:k===col.type},v)));
    const apply = async () => {
      const nn = name.value.trim() || col.name;
      try {
        if (nn !== col.name){
          const res = await api("POST",`/api/db/${p.id}/op`,{op:"rename_column", from:col.name, to:nn});
          for (const r of p.rows) if (col.name in r.props){ r.props[nn] = r.props[col.name]; delete r.props[col.name]; }
          if (st.sort===col.name) st.sort = nn; if (st.group===col.name) st.group = nn;
          if (st.cardProps) st.cardProps = st.cardProps.map(x=>x===col.name?nn:x);
          persist(); p.schema = res.schema;
        }
        const c2 = p.schema[ci];
        if (c2.type !== type.value){ c2.type = type.value; if (["select","multi_select"].includes(c2.type)) colOptions(p, c2); await saveSchema(); }
      } catch(e){ toast(e.message); }
      closePop(); draw();
    };
    name.onkeydown = e => { if (e.key==="Enter") apply(); };
    const mv = async d => { [p.schema[ci+d],p.schema[ci]]=[p.schema[ci],p.schema[ci+d]]; await saveSchema(); closePop(); draw(); };
    pop.append(h("label",{},"Name"), name, h("label",{},"Typ"), type,
      h("button",{class:"item", style:"color:var(--accent)", onclick:apply},"Übernehmen"), h("hr"),
      h("button",{class:"item", onclick:()=>{st.sort=col.name; st.dir=1; persist(); closePop(); draw();}},"↑ Aufsteigend sortieren"),
      h("button",{class:"item", onclick:()=>{st.sort=col.name; st.dir=-1; persist(); closePop(); draw();}},"↓ Absteigend sortieren"),
      st.sort ? h("button",{class:"item", onclick:()=>{st.sort=null; persist(); closePop(); draw();}},"Sortierung entfernen") : null,
      ci>1 ? h("button",{class:"item", onclick:()=>mv(-1)},"← Nach links") : null,
      ci>0 && ci<p.schema.length-1 ? h("button",{class:"item", onclick:()=>mv(1)},"→ Nach rechts") : null,
      col.type!=="title" ? [h("hr"), h("button",{class:"item danger", onclick:async()=>{ if(!confirm(`Eigenschaft „${col.name}“ ausblenden? Die Werte bleiben in den Einträgen gespeichert und erscheinen wieder, wenn du eine Eigenschaft mit demselben Namen anlegst.`)) return; p.schema.splice(ci,1); await saveSchema(); closePop(); draw(); }},"Eigenschaft entfernen")] : null);
    name.focus(); name.select();
  };

  draw();
}

// ===========================================================================
// Seitenleiste rechts: Eintrag öffnen, ohne das Board zu verlassen
// ===========================================================================
async function openPeek(id){
  flushAll();
  let p;
  try { p = await api("GET", `/api/page/${id}`); } catch(e){ toast(e.message); return; }
  PEEK = p;
  const el = $("#peek"); el.innerHTML = "";
  const body = h("div",{class:"peek-body"});
  el.append(h("div",{class:"ph-bar"},
    h("button",{title:"Schließen (Esc)", onclick:closePeek},"» Schließen"),
    h("button",{onclick:()=>{ closePeek(); location.hash="#/p/"+p.id; }},"⤢ Als Seite öffnen"),
    h("span",{class:"sp"}),
    h("button",{title:"Löschen", onclick:async()=>{ await api("DELETE",`/api/page/${p.id}`); closePeek(); notifyDb(p.parent_id);
      toast("„"+(p.title||"Ohne Titel")+"“ gelöscht","Rückgängig", async()=>{ await api("POST",`/api/restore/${p.id}`); notifyDb(p.parent_id); }); }},"🗑")), body);
  renderPageInto(body, p, true);
  el.classList.add("on");
  if (!p.title) setTimeout(()=>$("h1.title", body)?.focus(), 50);
}
function closePeek(){ if (!PEEK) return; flushAll(); const dbId = PEEK.parent_id; PEEK = null; $("#peek").classList.remove("on"); $("#peek").innerHTML=""; notifyDb(dbId); }
document.addEventListener("mousedown", e => { if (PEEK && !e.target.closest("#peek, .pop, .overlay, #toast, .cardx, .open, #lightbox")) closePeek(); });

// ===========================================================================
// Popover / Dialoge
// ===========================================================================
let POP = null;
function popover(anchor, x, y){
  closePop();
  const pop = h("div",{class:"pop"});
  document.body.append(pop);
  const r = anchor ? anchor.getBoundingClientRect() : {left:x, bottom:y, top:y};
  POP = pop;
  requestAnimationFrame(()=>{ if (POP!==pop) return;
    const w = pop.offsetWidth, ht = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth-w-8))+"px";
    let top = r.bottom+4; if (top+ht > innerHeight-8) top = Math.max(8, (r.top||r.bottom)-ht-4);
    pop.style.top = top+"px"; });
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth-330))+"px"; pop.style.top = (r.bottom+4)+"px";
  setTimeout(()=>document.addEventListener("mousedown", outside), 0);
  return pop;
}
function outside(e){ if (POP && !POP.contains(e.target)) closePop(); }
function closePop(){ if (POP){ POP.remove(); POP=null; document.removeEventListener("mousedown", outside); } }

function dialog(content){
  const ov = h("div",{class:"overlay", onmousedown:e=>{ if(e.target===ov) close(); }}, h("div",{class:"dialog"}, content));
  const onKey = e => { if (e.key==="Escape"){ e.stopPropagation(); close(); } };
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey, true); };
  document.addEventListener("keydown", onKey, true);
  document.body.append(ov); ov.close = close;
  return ov;
}

function openSearch(){
  const q = h("input",{class:"q", placeholder:"Alles durchsuchen …"});
  const res = h("div",{class:"res"});
  let sel = 0, items = [];
  const ov = dialog([q, res]);
  const pick = r => { ov.close(); go(r.id); };
  const draw = () => { res.innerHTML = ""; if (!items.length && q.value.trim()) res.append(h("div",{class:"hint", style:"padding:10px 12px"},"Nichts gefunden."));
    items.forEach((r,i)=>res.append(h("a",{class:"r"+(i===sel?" sel":""), onclick:()=>pick(r)},
    (r.icon||defaultIcon(r.kind))+" "+(r.title||"Ohne Titel"), r.kind==="row"?h("span",{class:"hint"}," · Eintrag"):null, r.snippet?h("small",{},r.snippet):null))); };
  const recent = () => { items = (META.favorites||[]).map(id=>NODE[id]).filter(Boolean); draw(); };
  q.oninput = debounce(async ()=>{ if (!q.value.trim()) return recent(); try { items = await api("GET","/api/search?q="+encodeURIComponent(q.value)); } catch(e){ items=[]; } sel=0; draw(); }, 150);
  q.onkeydown = e => {
    if (e.key==="ArrowDown"){ sel=Math.min(sel+1, items.length-1); draw(); e.preventDefault(); }
    if (e.key==="ArrowUp"){ sel=Math.max(sel-1,0); draw(); e.preventDefault(); }
    if (e.key==="Enter" && items[sel]) pick(items[sel]);
  };
  recent(); q.focus();
}

function pickPage(placeholder, onPick, filter, extra){
  const q = h("input",{class:"q", placeholder});
  const res = h("div",{class:"res"});
  const ov = dialog([q,res]);
  const draw = () => { res.innerHTML = "";
    if (extra) res.append(h("a",{class:"r", style:"color:var(--accent)", onclick:()=>{ ov.close(); extra.fn(); }}, extra.label));
    const s = q.value.toLowerCase();
    const list = TREE.filter(n=>filter(n) && (n.title||"").toLowerCase().includes(s)).slice(0,60);
    for (const n of list) res.append(h("a",{class:"r", onclick:()=>{ ov.close(); onPick(n); }}, (n.icon||defaultIcon(n.kind))+" "+(n.title||"Ohne Titel")));
    if (!list.length && !extra) res.append(h("div",{class:"hint", style:"padding:10px 12px"},"Nichts gefunden.")); };
  q.oninput = draw; draw(); q.focus();
}

function openImport(){
  const inp = h("input",{type:"file", accept:".zip", style:"display:none", multiple:true});
  const zone = h("div",{class:"drop-zone"},"Notion-Export (.zip) hierher ziehen oder klicken");
  const log = h("div",{class:"log", style:"display:none"});
  dialog(h("div",{class:"body"},
    h("h2",{},"📥 Notion importieren"),
    h("ol",{},
      h("li",{},"In Notion: ", h("b",{},"Einstellungen → Allgemein → Alle Inhalte des Arbeitsbereichs exportieren"), "."),
      h("li",{},"Format: ", h("b",{},"Markdown & CSV"), ", alles einschließen, ", h("b",{},"Ordner für Unterseiten erstellen"), " aktivieren."),
      h("li",{},"Die heruntergeladene ZIP-Datei hier ablegen (nicht entpacken).")),
    zone, inp, log,
    h("p",{class:"hint"},"Sehr große Exporte (mehrere GB) lieber über das Terminal importieren: ", h("code",{},"python3 app.py import Export.zip"), ". Ein erneuter Import aktualisiert vorhandene Seiten; Board-Spalten, Farben und Ansichten bleiben erhalten.")));
  zone.onclick = () => inp.click();
  zone.ondragover = e => { e.preventDefault(); zone.classList.add("on"); };
  zone.ondragleave = () => zone.classList.remove("on");
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove("on"); run([...e.dataTransfer.files]); };
  inp.onchange = () => run([...inp.files]);
  async function run(files){
    log.style.display = "block";
    for (const f of files){
      log.textContent += `Lade ${f.name} (${(f.size/1048576).toFixed(1)} MB) … bitte warten\n`;
      try { const r = await api("POST","/api/import", f, true); log.textContent += r.log.join("\n") + "\n"; }
      catch(e){ log.textContent += "Fehler: " + e.message + "\n"; }
    }
    await loadTree(); route();
    log.textContent += "✓ Fertig.";
  }
}

async function openTrash(){
  const list = await api("GET","/api/trash");
  const body = h("div",{class:"body"}, h("h2",{},"🗑️ Papierkorb"));
  if (!list.length) body.append(h("p",{class:"hint"},"Der Papierkorb ist leer."));
  const ov = dialog(body);
  for (const t of list){
    body.append(h("div",{style:"display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)"},
      h("a",{href:"#/p/"+t.id, style:"flex:1;text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap", onclick:()=>ov.close()}, (t.icon||defaultIcon(t.kind))+" "+(t.title||"Ohne Titel")),
      h("button",{class:"btn", onclick:async()=>{ await api("POST",`/api/restore/${t.id}`); ov.close(); await loadTree(); if (CURRENT) openPage(CURRENT.id); toast("Wiederhergestellt"); }},"Wiederherstellen"),
      h("button",{class:"btn", style:"color:var(--danger)", onclick:async()=>{ if(!confirm("Endgültig löschen? Das kann nicht rückgängig gemacht werden.")) return; await api("DELETE",`/api/page/${t.id}?endgueltig=1`); ov.close(); openTrash(); }},"Endgültig löschen")));
  }
}

async function newPage(parent_id=null, kind="page"){
  const r = await api("POST","/api/page",{kind, parent_id, title:""});
  if (parent_id) EXPANDED.add(parent_id);
  await loadTree(); go(r.id);
  setTimeout(()=>$("#view h1.title")?.focus(), 200);
}

function moreMenu(e){
  if (!CURRENT) return;
  const p = CURRENT;
  const pop = popover(e.currentTarget);
  const wide = isWide(p);
  pop.append(
    p.kind!=="database" ? h("button",{class:"item", onclick:()=>{closePop(); newPage(p.id);}},"＋ Unterseite") : null,
    p.kind!=="database" ? h("button",{class:"item", onclick:()=>{closePop(); newPage(p.id,"database");}},"＋ Unter-Datenbank") : null,
    h("button",{class:"item", onclick:()=>{ closePop(); META.home = META.home===p.id ? null : p.id; saveMeta("home"); toast(META.home ? "Als Startseite festgelegt" : "Startseite entfernt"); }}, META.home===p.id ? "🏠 Nicht mehr Startseite" : "🏠 Als Startseite festlegen"),
    h("button",{class:"item", onclick:()=>{ closePop(); META.wide[p.id] = !wide; saveMeta("wide"); openPage(p.id); }}, wide ? "↔ Normale Breite" : "↔ Volle Breite"),
    p.kind!=="row" ? h("button",{class:"item", onclick:()=>{closePop(); pickPage("Verschieben nach …", async n=>{ try{ await api("PUT",`/api/page/${p.id}`,{parent_id:n.id}); await loadTree(); openPage(p.id); toast("Verschoben"); }catch(err){ toast(err.message); } }, n=>n.kind==="page" && n.id!==p.id,
        {label:"⬆ Auf die oberste Ebene", fn: async()=>{ await api("PUT",`/api/page/${p.id}`,{parent_id:null}); await loadTree(); openPage(p.id); }});}},"↪ Verschieben nach …") : null,
    h("button",{class:"item", onclick:async()=>{closePop(); const r = await api("POST",`/api/duplicate/${p.id}`); await loadTree(); go(r.id);}},"⧉ Duplizieren"),
    h("button",{class:"item", onclick:()=>{closePop(); navigator.clipboard?.writeText(`[${p.title}](#/p/${p.id})`); toast("Link kopiert – im Editor einfügen");}},"🔗 Link zu dieser Seite kopieren"),
    h("div",{class:"hint", style:"padding:4px 8px;white-space:pre-line"}, "Erstellt: "+p.created.replace("T"," ")+"\nGeändert: "+p.updated.replace("T"," ")),
    h("hr"),
    h("button",{class:"item danger", onclick:async()=>{ closePop(); await api("DELETE",`/api/page/${p.id}`); await loadTree();
      toast("In den Papierkorb verschoben","Rückgängig", async()=>{ await api("POST",`/api/restore/${p.id}`); await loadTree(); go(p.id); });
      if (p.parent_id) go(p.parent_id); else location.hash="#/alle"; }},"🗑 Löschen"));
}

// ===========================================================================
// Start
// ===========================================================================
$("#btnSearch").onclick = openSearch;
$("#btnImport").onclick = openImport;
$("#btnExport").onclick = () => { location.href = "/api/export.zip"; };
$("#btnTrash").onclick = openTrash;
$("#btnNewPage").onclick = () => newPage(null);
$("#btnNewDb").onclick = () => newPage(null, "database");
$("#btnMore").onclick = moreMenu;
$("#homeBtn").onclick = () => { closePeek(); if (META.home && NODE[META.home]) go(META.home); else location.hash = "#/alle"; };
$("#btnTheme").onclick = () => { META.theme = ({auto:"light", light:"dark", dark:"auto"})[META.theme||"auto"]; saveMeta("theme"); applyTheme(); };
$("#btnFav").onclick = () => { if (!CURRENT) return; const id = CURRENT.id; const on = META.favorites.includes(id);
  META.favorites = on ? META.favorites.filter(x=>x!==id) : [...META.favorites, id]; saveMeta("favorites"); $("#btnFav").textContent = on ? "☆" : "★"; renderTree(); };
$("#menuBtn").onclick = () => { if (innerWidth <= 760) document.body.classList.toggle("side-open"); else { document.body.classList.toggle("side-collapsed"); try{ localStorage.setItem("nl_side", document.body.classList.contains("side-collapsed")?"0":"1"); }catch{} } };
$("#main").addEventListener("click", () => document.body.classList.remove("side-open"));
$("#lightbox").onclick = () => { $("#lightbox").style.display = "none"; };
document.addEventListener("keydown", e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); return; }
  if (e.key==="Escape"){
    if ($("#lightbox").style.display==="flex"){ $("#lightbox").style.display="none"; return; }
    if (POP){ closePop(); return; }
    if (e.target.matches?.("textarea, input, [contenteditable]")) return;
    if (PEEK && !$(".overlay")) closePeek();
  }
});
window.addEventListener("beforeunload", flushAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushAll(); });
try { if (localStorage.getItem("nl_side")==="0") document.body.classList.add("side-collapsed"); } catch {}

(async () => {
  try { Object.assign(META, await api("GET","/api/meta")); } catch(e){}
  for (const k of ["favorites","expanded"]) if (!Array.isArray(META[k])) META[k] = [];
  for (const k of ["wide","views","closed"]) if (!META[k] || typeof META[k]!=="object") META[k] = {};
  applyTheme();
  await loadTree();
  route();
  checkLock();
})();
</script>
