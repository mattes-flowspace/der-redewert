        const propSel = h("select",{}, p.schema.map(c=>h("option",{value:c.name, selected:c.name===col.name}, c.name)));
        const opSel = h("select",{}, ops.map(([k,l])=>h("option",{value:k, selected:k===f.op}, l)));
        const row = h("div",{class:"frow"}, propSel, opSel,
          h("button",{class:"fx", title:"Filter entfernen", onclick:()=>{ st.filters.splice(i,1); persist(); draw(); redraw(); }},"×"));
        propSel.onchange = () => { f.prop = propSel.value; f.op = ""; f.value = ""; persist(); draw(); redraw(); };
        opSel.onchange = () => { f.op = opSel.value; persist(); draw(); redraw(); };
        if (["contains","not_contains","eq","gt","lt"].includes(f.op)){
          const inp = h("input",{value: Array.isArray(f.value) ? "" : (f.value||""), placeholder:"Wert"});
          inp.oninput = debounce(()=>{ f.value = inp.value; persist(); draw(); }, 250);
          row.append(inp);
        } else if (f.op==="any" || f.op==="none"){
          const cur = new Set(Array.isArray(f.value) ? f.value : []);
          const opts = h("div",{class:"fopts"});
          for (const o of colOptions(p, col)){
            const cb = h("input",{type:"checkbox", checked:cur.has(o.name)});
            cb.onchange = () => { cb.checked ? cur.add(o.name) : cur.delete(o.name); f.value = [...cur]; persist(); draw(); };
            opts.append(h("label",{class:"chk"}, cb, tagEl(col, o.name)));
          }
          row.append(opts);
        }
        box.append(row);
      });
      box.append(h("button",{class:"item", onclick:()=>{ const c = p.schema.find(c=>c.type==="select") || p.schema.find(c=>c.type==="multi_select") || p.schema[0];
        st.filters.push({prop:c.name, op:opsFor(effType(c, p.schema, p.rows[0]))[0][0], value:""}); persist(); draw(); redraw(); }},"+ Filter hinzufügen"));
      if (st.filters.length>1) box.append(h("div",{class:"hint", style:"padding:0 8px"},"Alle Filter müssen zutreffen."));
    };
    redraw();
    return box;
  };

  const viewMenu = anchor => {
    const pop = popover(anchor);
    pop.classList.add("viewpop");
    pop.append(h("label",{},"Filter"), filterEditor(), h("hr"));
    const sortSel = h("select",{}, h("option",{value:""}, st.view==="board" ? "Manuell (Karten ziehen)" : "Manuell"), p.schema.map(c=>h("option",{value:c.name, selected:st.sort===c.name}, c.name)));
    sortSel.onchange = () => { st.sort = sortSel.value || null; persist(); draw(); };
    const dirSel = h("select",{}, h("option",{value:"1", selected:st.dir>0},"Aufsteigend"), h("option",{value:"-1", selected:st.dir<0},"Absteigend"));
    dirSel.onchange = () => { st.dir = +dirSel.value; persist(); draw(); };
    pop.append(h("label",{},"Sortieren nach"), sortSel, dirSel);
    if (st.view==="year"){
      const tcs = p.schema.filter(c=>c.type==="text" || c.type==="title");
      if (tcs.length){
        const ts = h("select",{}, tcs.map(c=>h("option",{value:c.name, selected:textCol()?.name===c.name}, c.name)));
        ts.onchange = () => { st.textCol = ts.value; persist(); draw(); };
        pop.append(h("label",{},"„Satz pro Tag“ steht in"), ts);
      }
      pop.append(h("div",{class:"hint", style:"padding:4px 0 0;margin:0"},"Fotos werden beim Hochladen verkleinert (höchstens 2000 Pixel) und als Cover des Tages gespeichert, dazu eine kleine Vorschau für die Kacheln."));
    }
    if (st.view==="table"){
      const g = h("select",{}, h("option",{value:""},"Keine Gruppierung"),
        p.schema.filter(c=>c.type!=="title" && c.type!=="files").map(c=>h("option",{value:c.name, selected:st.tgroup===c.name}, c.name)));
      g.onchange = () => { st.tgroup = g.value || null; st.tcollapsed = []; persist(); draw(); };
      pop.append(h("label",{},"Gruppieren nach"), g,
        h("div",{class:"hint", style:"padding:2px 0 0;margin:0"},"Gruppen lassen sich auf- und zuklappen. Berechnungen aus der Fußzeile erscheinen auch je Gruppe."));
    }
    if (st.view==="board"){
      const col = groupCol();
      if (col){
        const g = h("select",{}, groupable().map(c=>h("option",{value:c.name, selected:c.name===col.name}, c.name)));
        g.onchange = () => { st.group = g.value; st.hidden = []; st.cardProps = null; persist(); closePop(); draw(); };
        pop.append(h("label",{},"Gruppieren nach"), g, h("label",{},"Auf den Karten anzeigen"));
        const shown = new Set(st.cardProps || defaultCardProps(col));
        for (const c of p.schema.filter(c=>c.type!=="title" && c.name!==col.name)){
          const cb = h("input",{type:"checkbox", checked:shown.has(c.name)});
          cb.onchange = () => { cb.checked ? shown.add(c.name) : shown.delete(c.name); st.cardProps = p.schema.map(x=>x.name).filter(n=>shown.has(n)); persist(); draw(); };
          pop.append(h("label",{class:"chk"}, cb, c.name));
        }
        pop.append(h("label",{},"Spalten"));
        for (const gr of allGroups(col)){
          const cb = h("input",{type:"checkbox", checked:!st.hidden.includes(gr.key)});
          cb.onchange = () => { st.hidden = cb.checked ? st.hidden.filter(x=>x!==gr.key) : [...st.hidden, gr.key]; persist(); draw(); };
          pop.append(h("label",{class:"chk"}, cb, gr.label));
        }
      }
    }
    if (st.view==="list" || st.view==="gallery"){
      if (st.view==="gallery"){
        const gs = h("select",{}, [["s","Klein"],["m","Mittel"],["l","Groß"]].map(([k,l])=>h("option",{value:k, selected:(st.gsize||"m")===k}, l)));
        gs.onchange = () => { st.gsize = gs.value; persist(); draw(); };
        pop.append(h("label",{},"Kartengröße"), gs);
      }
      pop.append(h("label",{}, st.view==="gallery" ? "Auf den Karten anzeigen" : "In der Liste anzeigen"));
      const shown = new Set(st.cardProps || p.schema.filter(c=>["select","multi_select","date"].includes(c.type)).map(c=>c.name));
      for (const c of p.schema.filter(c=>c.type!=="title" && c.type!=="checkbox")){
        const cb = h("input",{type:"checkbox", checked:shown.has(c.name)});
        cb.onchange = () => { cb.checked ? shown.add(c.name) : shown.delete(c.name); st.cardProps = p.schema.map(x=>x.name).filter(n=>shown.has(n)); persist(); draw(); };
        pop.append(h("label",{class:"chk"}, cb, c.name));
      }
    }
    if (dateCols().length){
      if (["timeline","calendar","year"].includes(st.view) && dateCols().length > 1){
        const ds = h("select",{}, dateCols().map(c=>h("option",{value:c.name, selected:c.name===dateCol().name}, c.name)));
        ds.onchange = () => { st.dateCol = ds.value; persist(); draw(); };
        pop.append(h("label",{},"Datum für diese Ansicht"), ds);
      }
      const cur = autoDateCol();
      const as = h("select",{}, h("option",{value:""},"Nicht automatisch"), dateCols().map(c=>h("option",{value:c.name, selected:cur && c.name===cur.name}, "Heute in „"+c.name+"“")));
      as.onchange = () => { META.dbs[p.id] = {...(META.dbs[p.id]||{}), autoDate: as.value || false}; saveMeta("dbs"); };
      pop.append(h("label",{},"Datum bei neuen Einträgen"), as);
    }
    pop.append(h("hr"), h("button",{class:"item", onclick:e=>{ addColumn(anchor); }},"＋ Eigenschaft hinzufügen"),
      subCol() ? null : h("button",{class:"item", title:"Legt „Übergeordnet“, „Unteraufgaben“ und „Fortschritt“ an", onclick:()=>{ closePop(); setupSub(); }},"↳ Unteraufgaben einrichten"));
  };

  // Zusatzeinstellungen für Verknüpfung, Rollup und Formel (beim Anlegen und Bearbeiten einer Spalte)
  const colExtra = (col, typeSel) => {
    const box = h("div",{class:"colx"});
    const cfg = {db:col.db||"", mirror:col.mirror||"", back:false, rel:col.rel||"", prop:col.prop||"", calc:col.calc||"show", expr:col.expr||""};
    let tok = 0;
    const redraw = async () => {
      const my = ++tok, t = typeSel.value, parts = [];
      if (t==="relation"){
        const dbs = TREE.filter(n=>n.kind==="database");
        const other = cfg.db ? await loadDb(cfg.db) : null;
        if (my !== tok) return;
        const dsel = h("select",{}, h("option",{value:""},"– Datenbank wählen –"),
          dbs.map(n=>h("option",{value:n.id, selected:n.id===cfg.db}, n.id===p.id ? "Diese Datenbank" : (n.icon ? n.icon+" " : "")+(n.title||"Ohne Titel"))));
        dsel.onchange = () => { cfg.db = dsel.value; cfg.mirror = ""; redraw(); };
        parts.push(h("label",{},"Verknüpft mit"), dsel);
        if (other){
          const cands = other.schema.filter(c=>c.type==="relation" && c.db===p.id && !c.mirror && c.name!==col.name);
          if (cands.length){
            const msel = h("select",{}, h("option",{value:""},"Eigene Auswahl in dieser Spalte"),
              cands.map(c=>h("option",{value:c.name, selected:c.name===cfg.mirror}, "Gegenstück zu „"+c.name+"“")));
            msel.onchange = () => { cfg.mirror = msel.value; redraw(); };
            parts.push(h("label",{},"Einträge"), msel);
          }
          if (cfg.mirror) parts.push(h("div",{class:"hint colhint"},"Zeigt, welche Einträge in „"+(other.title||"Ohne Titel")+"“ über „"+cfg.mirror+"“ auf diesen Eintrag verweisen. Änderungen wirken in beide Richtungen."));
          else if (other.id!==p.id && !(isRel(col) && col.db===other.id)){
            const cb = h("input",{type:"checkbox", checked:cfg.back}); cb.onchange = () => { cfg.back = cb.checked; };
            parts.push(h("label",{class:"chk"}, cb, "Gegenstück in „"+(other.title||"Ohne Titel")+"“ anlegen"));
          }
        }
      } else if (t==="rollup"){
        const rels = p.schema.filter(isRel);
        if (!rels.length) parts.push(h("div",{class:"hint colhint"},"Für ein Rollup brauchst du zuerst eine Verknüpfung zu einer Datenbank."));
        else {
          if (!rels.some(c=>c.name===cfg.rel)) cfg.rel = rels[0].name;
          const other = await loadDb(rels.find(c=>c.name===cfg.rel).db);
          if (my !== tok) return;
          const props = other?.schema || [];
          if (!props.some(c=>c.name===cfg.prop)) cfg.prop = props.find(c=>c.type==="number")?.name || props.find(c=>c.type==="title")?.name || "";
          const rsel = h("select",{}, rels.map(c=>h("option",{value:c.name, selected:c.name===cfg.rel}, c.name)));
          rsel.onchange = () => { cfg.rel = rsel.value; cfg.prop = ""; redraw(); };
          const psel = h("select",{}, props.map(c=>h("option",{value:c.name, selected:c.name===cfg.prop}, c.name)));
          psel.onchange = () => { cfg.prop = psel.value; };
          const csel = h("select",{}, ROLLUPS.map(([k,l])=>h("option",{value:k, selected:k===cfg.calc}, l)));
          csel.onchange = () => { cfg.calc = csel.value; };
          parts.push(h("label",{},"Verknüpfung"), rsel, h("label",{},"Eigenschaft in „"+(other?.title||"…")+"“"), psel, h("label",{},"Berechnen"), csel);
        }
      } else if (t==="formula"){
        const ta = h("textarea",{class:"fexpr", rows:3, placeholder:"z. B. {Budget} * 1.19", spellcheck:"false"});
        ta.value = cfg.expr;
        const prev = h("div",{class:"hint colhint"});
        const upd = () => {
          cfg.expr = ta.value; const src = cfg.expr.trim(), r0 = p.rows[0];
          if (!src){ prev.textContent = ""; return; }
          let tv = null; try { fParse(src); if (r0) tv = formulaValue(r0, {type:"formula", expr:src}, p.schema, 0); } catch(e){ tv = {t:"err", v:e.message}; }
          prev.classList.toggle("ferr", !!tv && tv.t==="err");
          prev.textContent = !tv ? "✓ Formel ist gültig" : tv.t==="err" ? "⚠ "+tv.v : "Ergebnis für „"+(r0.title||"Ohne Titel")+"“: "+(displayText(tv)||"(leer)");
        };
        ta.oninput = debounce(upd, 200);
        ta.onkeydown = e => e.stopPropagation();
        const chips = p.schema.filter(c=>c.name!==col.name).map(c=>h("button",{class:"fchip", title:"Einfügen", onclick:()=>{
          const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a, ins = "{"+c.name+"}";
          ta.value = ta.value.slice(0,a)+ins+ta.value.slice(b); ta.focus(); ta.selectionStart = ta.selectionEnd = a+ins.length; upd(); }}, c.name));
        parts.push(h("label",{},"Formel"), ta, prev, h("div",{class:"fchips"}, chips),
          h("details",{class:"fhelp"}, h("summary",{},"Was kann ich schreiben?"), h("div",{html:FORMULA_HELP})));
        upd();
      }
      box.innerHTML = ""; box.append(...parts);
    };
    redraw();
    return {el:box, cfg, redraw};
  };
  const applyExtra = (c, cfg) => {
    for (const k of ["db","mirror","rel","prop","calc","expr"]) delete c[k];
    if (c.type==="relation" && cfg.db){ c.db = cfg.db; if (cfg.mirror) c.mirror = cfg.mirror; }
    if (c.type==="rollup"){ c.rel = cfg.rel; c.prop = cfg.prop; c.calc = cfg.calc; }
    if (c.type==="formula") c.expr = cfg.expr.trim();
  };
  const extraOk = (type, cfg) => {
    if (type==="relation" && !cfg.db) return "Bitte eine Datenbank wählen";
    if (type==="rollup" && !p.schema.some(isRel)) return "Lege zuerst eine Verknüpfung an";
    if (type==="formula" && cfg.expr.trim()){ try { fParse(cfg.expr.trim()); } catch(e){ return "Formel: "+e.message; } }
    return "";
  };
  // nach dem Speichern einer (neuen) Verknüpfung: vorhandene Texte umwandeln, Gegenstück anlegen
  const afterRelation = async (c, cfg) => {
    if (!c.mirror){
      const res = await convertRelation(p, c);
      if (res && (res.done || res.missed)) toast(res.done+(res.done===1 ? " Eintrag" : " Einträge")+" verknüpft"+(res.missed ? ", "+res.missed+(res.missed===1 ? " Wert" : " Werte")+" nicht zugeordnet (bleibt als Text erhalten)" : ""));
      if (cfg.back){
        const other = await loadDb(c.db, true);
        if (other){
          let nm = p.title || "Verknüpft", i = 2; const base = nm;
          while (other.schema.some(x=>x.name===nm)) nm = base+" "+(i++);
          other.schema.push({name:nm, type:"relation", db:p.id, mirror:c.name});
          await save(other.id, {schema:other.schema}); notifyDb(other.id);
        }
      }
    }
    await refreshDeps(p.schema);
  };
  // Umbenennen: Formeln, Rollups und Gegenstücke (auch in anderen Datenbanken) mitziehen
  const renameRefs = async (from, to) => {
    const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const r1 = new RegExp("\\{\\s*"+esc(from)+"\\s*\\}", "g"), r2 = new RegExp("prop\\(\\s*\"" + esc(from) + "\"\\s*\\)", "g");
    const fix = (schema, here) => { let ch = false;
      for (const c of schema){
        if (here && c.type==="formula" && c.expr){ const e = c.expr.replace(r1, "{"+to+"}").replace(r2, "prop(\""+to+"\")"); if (e!==c.expr){ c.expr = e; ch = true; } }
        if (here && c.type==="rollup" && c.rel===from){ c.rel = to; ch = true; }
        if (c.type==="relation" && c.db===p.id && c.mirror===from){ c.mirror = to; ch = true; }
        if (c.type==="rollup" && c.prop===from && schema.find(x=>x.name===c.rel)?.db===p.id){ c.prop = to; ch = true; }
      }
      return ch; };
    if (fix(p.schema, true)) await saveSchema();
    for (const n of TREE.filter(n=>n.kind==="database" && n.id!==p.id)){
      const o = await loadDb(n.id); if (!o) continue;
      if (fix(o.schema, false)){ await save(o.id, {schema:o.schema}); notifyDb(o.id); }
    }
  };

  const addColumn = anchor => {
    const pop = popover(anchor);
    const name = h("input",{placeholder:"Name der Eigenschaft"});
    const type = h("select",{}, Object.entries(TYPES).filter(([k])=>k!=="title").map(([k,v])=>h("option",{value:k},v)));
    const ex = colExtra({}, type);
    type.onchange = () => ex.redraw();
    const ok = async () => { const n=name.value.trim(); if(!n) return; if (p.schema.some(c=>c.name===n)) return toast("Diesen Namen gibt es schon");
      const bad = extraOk(type.value, ex.cfg); if (bad) return toast(bad);
      const c = {name:n, type:type.value}; applyExtra(c, ex.cfg);
      p.schema.push(c); await saveSchema(); if (isRel(c)) await afterRelation(c, ex.cfg); closePop(); draw(); };
    name.onkeydown = e => { if (e.key==="Enter") ok(); };
    pop.classList.add("colpop");
    pop.append(h("label",{},"Name"), name, h("label",{},"Typ"), type, ex.el, h("button",{class:"item", style:"color:var(--accent)", onclick:ok},"Hinzufügen"));
    name.focus();
  };

  const colMenu = (ci, anchor) => {
    const col = p.schema[ci];
    const pop = popover(anchor);
    const name = h("input",{value:col.name});
    const type = h("select",{disabled: col.type==="title"}, Object.entries(TYPES).filter(([k])=>col.type==="title"||k!=="title").map(([k,v])=>h("option",{value:k, selected:k===col.type},v)));
    const apply = async () => {
      const nn = name.value.trim() || col.name;
      try {
        if (nn !== col.name){
          const res = await api("POST",`/api/db/${p.id}/op`,{op:"rename_column", from:col.name, to:nn});
          for (const r of p.rows) if (col.name in r.props){ r.props[nn] = r.props[col.name]; delete r.props[col.name]; }
          for (const v of views){
            if (v.sort===col.name) v.sort = nn; if (v.group===col.name) v.group = nn; if (v.tgroup===col.name) v.tgroup = nn; if (v.dateCol===col.name) v.dateCol = nn;
            if (v.cardProps) v.cardProps = v.cardProps.map(x=>x===col.name?nn:x);
            for (const f of v.filters) if (f.prop===col.name) f.prop = nn;
            if (col.name in v.calc){ v.calc[nn] = v.calc[col.name]; delete v.calc[col.name]; }
          }
          persist(); p.schema = res.schema;
          await renameRefs(col.name, nn);
        }
        const c2 = p.schema[ci];
        const bad = extraOk(type.value, ex.cfg); if (bad){ toast(bad); return; }
        const fmt = ["number","formula"].includes(type.value) ? fmtSel.value : "";
        const before = JSON.stringify(c2), oldDb = isRel(c2) && !c2.mirror ? c2.db : "";
        c2.type = type.value; if (fmt) c2.format = fmt; else delete c2.format;
        applyExtra(c2, ex.cfg);
        if (JSON.stringify(c2) !== before){
          if (["select","multi_select"].includes(c2.type)) colOptions(p, c2);
          await saveSchema();
          if (isRel(c2) && !c2.mirror && (c2.db !== oldDb || ex.cfg.back)) await afterRelation(c2, ex.cfg); else await refreshDeps(p.schema);
        }
      } catch(e){ toast(e.message); }
      closePop(); draw();
    };
    name.onkeydown = e => { if (e.key==="Enter") apply(); };
    const fmtSel = h("select",{}, Object.entries(NUMFORMATS).map(([k,v])=>h("option",{value:k, selected:(col.format||"")===k}, v)));
    const fmtWrap = h("div",{style: ["number","formula"].includes(col.type) ? "" : "display:none"}, h("label",{},"Zahlenformat"), fmtSel);
    const ex = colExtra(col, type);
    type.onchange = () => { fmtWrap.style.display = ["number","formula"].includes(type.value) ? "" : "none"; ex.redraw(); };
    pop.classList.add("colpop");
    fmtSel.onchange = () => apply();
    const mv = async d => { [p.schema[ci+d],p.schema[ci]]=[p.schema[ci],p.schema[ci+d]]; await saveSchema(); closePop(); draw(); };
    pop.append(h("label",{},"Name"), name, h("label",{},"Typ"), type, ex.el, fmtWrap,
      h("button",{class:"item", style:"color:var(--accent)", onclick:apply},"Übernehmen"), h("hr"),
      h("button",{class:"item", onclick:()=>{st.sort=col.name; st.dir=1; persist(); closePop(); draw();}},"↑ Aufsteigend sortieren"),
      h("button",{class:"item", onclick:()=>{st.sort=col.name; st.dir=-1; persist(); closePop(); draw();}},"↓ Absteigend sortieren"),
      st.sort ? h("button",{class:"item", onclick:()=>{st.sort=null; persist(); closePop(); draw();}},"Sortierung entfernen") : null,
      ci>1 ? h("button",{class:"item", onclick:()=>mv(-1)},"← Nach links") : null,
      ci>0 && ci<p.schema.length-1 ? h("button",{class:"item", onclick:()=>mv(1)},"→ Nach rechts") : null,
      col.type!=="title" ? [h("hr"), h("button",{class:"item danger", onclick:async()=>{ if(!confirm(`Eigenschaft „${col.name}“ ausblenden? Die Werte bleiben in den Einträgen gespeichert und erscheinen wieder, wenn du eine Eigenschaft mit demselben Namen anlegst.`)) return; p.schema.splice(ci,1); await saveSchema(); closePop(); draw(); }},"Eigenschaft entfernen")] : null);
    name.focus(); name.select();
  };

  DBC[p.id] = p;
  await refreshDeps(p.schema);
  draw();
}

// Bild verkleinern und als JPEG neu speichern (Handyfotos haben oft 5–10 MB)
const safeFile = s => String(s).replace(/[<>:"/\\|?*\x00-\x1f]/g, "").trim() || "Export";
async function shrinkImage(file, max){
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, max/Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width*sc)), ht = Math.max(1, Math.round(bmp.height*sc));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = ht;
  const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0,0,w,ht); cx.drawImage(bmp, 0, 0, w, ht);
  bmp.close?.();
  const blob = await new Promise(res=>cv.toBlob(res, "image/jpeg", max > 1000 ? 0.86 : 0.8));
  if (!blob) throw new Error("Bild konnte nicht umgewandelt werden");
  return blob;
}

const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
function recurEditor(p){
  META.recur ||= {};
  const box = h("div",{class:"recur"});
  const store = async () => {
    draw();
    try {
      await api("PUT","/api/meta/recur", META.recur);
      const r = await api("POST","/api/recur/run");
      if (r.made){ toast(r.made===1 ? "Der heute fällige Eintrag wurde angelegt." : r.made+" fällige Einträge angelegt."); notifyDb(p.parent_id); }
    } catch(e){ toast(e.message); }
  };
  const draw = () => {
    const c = META.recur[p.id] || null;
    box.innerHTML = "";
    const freq = h("select",{}, [["","Nicht wiederholen"],["daily","Täglich"],["weekly","Wöchentlich"],["monthly","Monatlich"]]
      .map(([k,l])=>h("option",{value:k, selected:(c?.freq||"")===k}, l)));
    freq.onchange = () => {
      if (!freq.value){ delete META.recur[p.id]; return store(); }
      const now = new Date();
      META.recur[p.id] = {...(c||{}), freq:freq.value, since:c?.since || isoOf(now),
        days:c?.days?.length ? c.days : [(now.getDay()+6)%7+1], mday:c?.mday || now.getDate()};
      store();
    };
    box.append(h("span",{},"🔁 Wiederholen:"), freq);
    if (c?.freq==="weekly") box.append(h("span",{class:"wdays"}, WD.map((n,i)=>{ const on = c.days.includes(i+1);
      return h("button",{class:"wd"+(on?" on":""), title:on ? "Abwählen" : "Auswählen", onclick:()=>{
        c.days = on ? c.days.filter(x=>x!==i+1) : [...c.days, i+1].sort((a,b)=>a-b);
        if (!c.days.length) c.days = [i+1];
        store(); }}, n); })));
    if (c?.freq==="monthly"){
      const inp = h("input",{type:"number", min:"1", max:"31", value:String(c.mday||1), style:"width:58px"});
      inp.onchange = () => { c.mday = Math.max(1, Math.min(31, parseInt(inp.value,10)||1)); store(); };
      box.append(h("span",{},"am"), inp, h("span",{},". des Monats (gibt es den Tag nicht, am Monatsletzten)"));
    }
    if (c?.freq) box.append(h("div",{class:"hint", style:"margin:0;flex-basis:100%"},
      "Am fälligen Tag legt die App aus dieser Vorlage einen Eintrag an: Titel ist der Name der Vorlage mit Datum, die Datumsspalte bekommt diesen Tag. "
      + "Das passiert, sobald die App läuft. War sie mehrere Tage aus, kommt nur der zuletzt fällige Eintrag dazu."));
  };
  draw();
  return box;
}

const DATE_SKIP_RE = /erstellt|created|geändert|bearbeitet|edited|letzte|last/i;
const DATE_DUE_RE = /fällig|faellig|due|deadline|frist|termin/i;
// Fototagebücher (Datenbanken mit Ansicht „Fotojahr“) sind keine Aufgaben: standardmäßig nicht in „Heute“
const agendaOff = (d, cfg) => cfg?.off ?? (META.dbviews?.[d.id] || []).some(v=>v.view==="year");
function agendaCol(d, cfg){
  const dates = d.schema.filter(c=>c.type==="date");
  return dates.find(c=>c.name===cfg?.col)
    || dates.find(c=>DATE_DUE_RE.test(c.name))
    || dates.find(c=>!DATE_SKIP_RE.test(c.name)) || null;
}

let TODAY_TOKEN = 0;
async function renderToday(){
  flushAll(); PENDING.clear();

  META.agenda ||= {};

  const over = [], now = [], week = [];
  for (const d of dbs){
    const cfg = META.agenda[d.id] || {};

    const col = agendaCol(d, cfg); if (!col) continue;
    const dc = doneCol(d.schema);
    for (const r of d.rows){
      const rg = dateRange(r.props?.[col.name]); if (!rg) continue;

      const it = {r, d, col, rg, dc};
      if (rg.end < today){ if (dc) over.push(it); }      // Überfälliges nur, wenn die Datenbank „erledigt“ kennt
      else if (rg.start <= today) now.push(it);
      else if (rg.start <= in7) week.push(it);

  }
  const byDate = (a,b) => (a.rg.start-b.rg.start) || (a.r.sort||0)-(b.r.sort||0) || String(a.r.title).localeCompare(String(b.r.title),"de");

  // Neu zeichnen, wenn ein Eintrag (z. B. in der Seitenleiste) geändert wurde

  LIVE = dbs.map(d=>({p:d, reload:again}));

  page.append(h("div",{class:"ag-btns"},
    h("button",{class:"btn", onclick:()=>{ META.home = isHome ? null : "heute"; saveMeta("home"); toast(isHome ? "Startseite entfernt" : "„Heute“ ist jetzt deine Startseite"); renderToday(); }},
      isHome ? "🏠 Nicht mehr Startseite" : "🏠 Als Startseite festlegen")));

  const markDone = async (it, row) => {
    const {r, dc} = it, prev = r.props[dc.name] ?? "";
    r.props[dc.name] = doneValue(dc); row.classList.add("gone");
    if (!await save(r.id, {props:r.props})){ r.props[dc.name] = prev; row.classList.remove("gone"); return; }
    setTimeout(()=>row.remove(), 400);
    toast("„"+(r.title||"Ohne Titel")+"“ erledigt", "Rückgängig", async()=>{ r.props[dc.name] = prev; await save(r.id, {props:r.props}); renderToday(); });
  };
  const toToday = async it => {
    const {r, col, rg} = it, raw = String(r.props[col.name]||"");
    const p0 = parseISO(raw.split("→")[0]), t0 = p0?.time ? " "+p0.time : "";
    const len = Math.round((rg.end-rg.start)/864e5);
    r.props[col.name] = isoOf(today)+t0 + (raw.includes("→") ? " → "+isoOf(plusDays(today, len)) : "");
    if (await save(r.id, {props:r.props})) renderToday();
  };
  const item = (it, isOver) => {
    const {r, d, col, dc} = it;
    const sc = d.schema.find(c=>c.type==="select" && /status/i.test(c.name)) || (dc?.type==="select" ? dc : null);
    const sv = sc ? String(r.props?.[sc.name]||"").trim() : "";
    const row = h("div",{class:"ag-row"});
    row.append(...[
      dc ? h("input",{type:"checkbox", class:"cb", title:"Als erledigt markieren", onclick:e=>{ e.stopPropagation(); markDone(it, row); }}) : h("span",{class:"ag-dot"}),
      h("button",{class:"ag-t", title:"Öffnen", onclick:()=>openPeek(r.id)}, (r.icon ? r.icon+" " : "")+(r.title||"Ohne Titel")),
      sv ? tagEl(sc, sv) : null,
      h("span",{class:"ag-db", title:"Datenbank öffnen", onclick:()=>go(d.id)}, (d.icon||"🗃️")+" "+(d.title||"Ohne Titel")),
      dateEl(r.props[col.name]),
      isOver ? h("button",{class:"btn ag-mv", title:"Datum auf heute verschieben", onclick:()=>toToday(it)},"Auf heute") : null].filter(x=>x!=null));
    return row;
  };
  const section = (cls, title, list, empty, fn) => {
    page.append(h("div",{class:"ag-sec "+cls}, title, h("span",{class:"n"}, list.length ? String(list.length) : "")));
    if (!list.length){ page.append(h("div",{class:"ag-empty"}, empty)); return; }
    fn ? fn(list) : list.forEach(it=>page.append(item(it, cls==="over")));
  };
  if (over.length) section("over","Überfällig", over, "");
  section("now","Heute", now, over.length ? "Für heute ist sonst nichts eingetragen." : "Für heute steht nichts an. 🎉");
  section("week","Nächste 7 Tage", week, "Nichts geplant.", list => {
    let last = "";
    for (const it of list){
      const k = isoOf(it.rg.start);
      if (k !== last){ last = k; const tm = +it.rg.start === +plusDays(today,1);
        page.append(h("div",{class:"ag-day"}, tm ? "Morgen" : it.rg.start.toLocaleDateString("de-DE",{weekday:"long", day:"numeric", month:"long"}))); }
      page.append(item(it, false));
    }
  });

  // Einstellungen: welche Datenbanken, welche Datumsspalte
  const det = h("details",{class:"ag-set"}, h("summary",{},"Welche Datenbanken erscheinen hier?"));
  if (!dbs.length) det.append(h("p",{class:"hint"},"Noch keine Datenbank mit einer Datumsspalte."));
  else {
    const tbl = h("table");
    for (const d of dbs){
      const cfg = META.agenda[d.id] || {}, col = agendaCol(d, cfg), dc = doneCol(d.schema);
      const on = h("input",{type:"checkbox", checked:!agendaOff(d, cfg)});
      on.onchange = () => { META.agenda[d.id] = {...cfg, off:!on.checked}; saveMeta("agenda"); renderToday(); };
      const sel = h("select",{}, d.schema.filter(c=>c.type==="date").map(c=>h("option",{value:c.name, selected:col && c.name===col.name}, c.name)));
      sel.onchange = () => { META.agenda[d.id] = {...cfg, col:sel.value}; saveMeta("agenda"); renderToday(); };
      tbl.append(h("tr",{}, h("td",{style:"width:24px"}, on), h("td",{}, (d.icon||"🗃️")+" "+(d.title||"Ohne Titel")),
        h("td",{}, sel),
        h("td",{class:"hint", style:"margin:0"}, dc ? "Erledigt über „"+dc.name+"“" : "Keine Erledigt-Spalte: Überfälliges wird nicht gezeigt")));
    }
    det.append(tbl, h("p",{class:"hint"},"Als erledigt gilt ein Eintrag mit angehakter Checkbox namens „Erledigt“ oder „Done“ oder mit einem Status wie „Fertig“, „Erledigt“ oder „Done“. Erledigtes erscheint hier nicht."));
  }
  page.append(det);
}

// Seitenverlauf: frühere Fassungen ansehen, vergleichen, wiederherstellen
// ===========================================================================
function lineDiff(oldText, newText){   // Zeilenvergleich (LCS) -> [{t:" "|"-"|"+", s}]
  const A = String(oldText||"").split("\n"), B = String(newText||"").split("\n");
  let pre = 0; while (pre<A.length && pre<B.length && A[pre]===B[pre]) pre++;
  let suf = 0; while (suf<A.length-pre && suf<B.length-pre && A[A.length-1-suf]===B[B.length-1-suf]) suf++;
  const a = A.slice(pre, A.length-suf), b = B.slice(pre, B.length-suf), n = a.length, m = b.length;
  const out = A.slice(0, pre).map(s=>({t:" ", s}));
  if (n*m > 3e6){ a.forEach(s=>out.push({t:"-", s})); b.forEach(s=>out.push({t:"+", s})); }
  else {
    const L = Array.from({length:n+1}, ()=>new Uint32Array(m+1));
    for (let i=n-1; i>=0; i--) for (let j=m-1; j>=0; j--) L[i][j] = a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
    let i = 0, j = 0;
    while (i<n && j<m){ if (a[i]===b[j]){ out.push({t:" ", s:a[i]}); i++; j++; } else if (L[i+1][j] >= L[i][j+1]) out.push({t:"-", s:a[i++]}); else out.push({t:"+", s:b[j++]}); }
    while (i<n) out.push({t:"-", s:a[i++]}); while (j<m) out.push({t:"+", s:b[j++]});
  }
  return out.concat(A.slice(A.length-suf).map(s=>({t:" ", s})));
}
function relTime(ts){
  const d = new Date(ts), s = (Date.now()-d.getTime())/1000;
  if (s < 90) return "gerade eben";
  if (s < 3600) return `vor ${Math.round(s/60)} Min.`;
  if (s < 86400) return `vor ${Math.round(s/3600)} Std.`;
  if (s < 86400*7){ const n = Math.round(s/86400); return n===1 ? "gestern" : `vor ${n} Tagen`; }
  return d.toLocaleDateString("de-DE",{day:"numeric", month:"short", year:"numeric"});
}
async function openHistory(p, inPeek){
  flushAll(); await new Promise(r=>setTimeout(r, 200));      // offene Änderungen erst speichern
  let list, cur;
  try { [list, cur] = await Promise.all([api("GET",`/api/history/${p.id}`), api("GET",`/api/page/${p.id}`)]); }
  catch(e){ toast(e.message); return; }
  const schema = cur.db_schema || [];
  const left = h("div",{class:"hist-list"}), right = h("div",{class:"hist-view"});
  const body = h("div",{class:"hist"},
    h("div",{class:"hist-head"}, h("h2",{},"🕘 Seitenverlauf"), h("span",{class:"hint", style:"margin:0"}, (cur.icon ? cur.icon+" " : "") + (cur.title||"Ohne Titel"))),
    h("div",{class:"hist-cols"}, left, right));
  const ov = dialog(body);
  ov.querySelector(".dialog").classList.add("histdlg");
  if (!list.length){
    left.append(h("div",{class:"hint", style:"padding:10px"},"Noch keine früheren Fassungen."));
    right.append(h("p",{class:"hint"},"Sobald du diese Seite änderst, merkt sich die App den vorherigen Stand: beim Bearbeiten höchstens alle 10 Minuten eine Fassung, die letzten 50 je Seite bleiben erhalten."));
    return;
  }
  const propText = (col, v) => {
    if (isRel(col) && !col.mirror){ const t = DBC[col.db]; const by = t ? rowsById(t) : null;
      return relIds(v).map(id=>by?.get(id)?.title || "(gelöscht)").join(", "); }
    return String(v ?? "");
  };
  const stored = schema.filter(c=>c.type!=="title" && !isCalc(c) && !(isRel(c) && c.mirror));
  let mode = "diff";
  const show = async (v, btn) => {
    left.querySelectorAll(".on").forEach(x=>x.classList.remove("on")); btn.classList.add("on");
    right.innerHTML = ""; right.append(h("div",{class:"hint"},"Lädt …"));
    let f; try { f = await api("GET",`/api/history/${p.id}/${v.id}`); } catch(e){ right.innerHTML = ""; right.append(h("div",{class:"hint"}, e.message)); return; }
    const render = () => {
      right.innerHTML = "";
      const tab = (k, lb) => h("button",{class:"btn"+(mode===k?" primary":""), onclick:()=>{ mode = k; render(); }}, lb);
      right.append(h("div",{class:"hist-bar"}, tab("diff","Änderungen"), tab("view","Vorschau"), h("span",{class:"sp"}),
        h("button",{class:"btn primary", onclick:async()=>{
          if (!confirm("Diese Fassung wiederherstellen?\n\nDer jetzige Stand bleibt im Verlauf erhalten, du kannst also jederzeit zurück.")) return;
          try { await api("POST",`/api/history/${p.id}/${v.id}`); } catch(e){ toast(e.message); return; }
          ov.close(); toast("Fassung wiederhergestellt. Der vorherige Stand liegt im Verlauf.");
          await loadTree();
          if (inPeek){ openPeek(p.id); notifyDb(p.parent_id); } else openPage(p.id);
        }},"Diese Fassung wiederherstellen")));
      const changedProps = stored.filter(c => String(f.props?.[c.name] ?? "") !== String(cur.props?.[c.name] ?? ""));
      if (mode==="diff"){
        right.append(h("p",{class:"hint", style:"margin:0 0 10px"},
          h("span",{style:"background:var(--t-green);padding:0 4px;border-radius:3px"},"Grün"), " kommt beim Wiederherstellen zurück, ",
          h("span",{style:"background:var(--t-red);padding:0 4px;border-radius:3px"},"Rot"), " fällt weg."));
        const tbl = h("table",{class:"hist-props"});
        if (f.title !== cur.title) tbl.append(h("tr",{}, h("td",{},"Titel"), h("td",{}, h("span",{class:"old"}, f.title||"Ohne Titel"), " ", h("span",{class:"new"}, cur.title||"Ohne Titel"))));
        if (f.icon !== cur.icon) tbl.append(h("tr",{}, h("td",{},"Icon"), h("td",{}, h("span",{class:"old"}, f.icon||"–"), " ", h("span",{class:"new"}, cur.icon||"–"))));
        for (const c of changedProps){
          const o = propText(c, f.props?.[c.name]), n = propText(c, cur.props?.[c.name]);
          tbl.append(h("tr",{}, h("td",{}, c.name), h("td",{}, o ? h("span",{class:"old"}, o) : h("span",{class:"hint", style:"margin:0"},"leer"), " ", n ? h("span",{class:"new"}, n) : null)));
        }
        if (tbl.childNodes.length) right.append(tbl);
        const d = lineDiff(f.content, cur.content);
        if (!d.some(x=>x.t!==" ")){
          if (!tbl.childNodes.length) right.append(h("p",{class:"hint"},"Diese Fassung entspricht dem jetzigen Stand."));
          else right.append(h("p",{class:"hint"},"Der Inhalt ist unverändert."));
          return;
        }
        const box = h("div",{class:"hist-diff"});
        // unveränderte Abschnitte einklappen, 2 Zeilen Kontext
        const keep = d.map((x,i)=> x.t!==" " || d.slice(Math.max(0,i-2), i+3).some(y=>y.t!==" "));
        for (let i=0; i<d.length; i++){
          if (!keep[i]){ let j = i; while (j<d.length && !keep[j]) j++; box.append(h("div",{class:"gap"}, `… ${j-i} unveränderte Zeile${j-i===1?"":"n"}`)); i = j-1; continue; }
          const x = d[i];
          box.append(h("div",{class: x.t==="-" ? "add" : x.t==="+" ? "del" : ""}, x.s || "\u00a0"));
        }
        right.append(box);
      } else {
        right.append(h("h1",{class:"title", style:"margin:0 0 8px;font-size:26px"}, (f.icon ? f.icon+" " : "") + (f.title||"Ohne Titel")));
        const vals = stored.filter(c=>String(f.props?.[c.name] ?? "").trim());
        if (vals.length) right.append(h("table",{class:"hist-props"}, vals.map(c=>h("tr",{}, h("td",{}, c.name), h("td",{}, propText(c, f.props[c.name]))))));
        right.append(h("div",{class:"doc", html: md(f.content)}));
      }
    };
    render();
  };
  for (const v of list){
    const d = new Date(v.ts);
    const btn = h("button",{onclick:()=>show(v, btn)},
      h("div",{class:"hl-d"}, d.toLocaleString("de-DE",{weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})),
      h("div",{class:"hl-s"}, relTime(v.ts) + (v.reason ? " · " + v.reason : "") + " · " + (v.chars||0).toLocaleString("de-DE") + " Zeichen"));
    left.append(btn);
  }
  show(list[0], left.firstChild);
}

let POP = null;
function popover(anchor, x, y){
  closePop();
  const pop = h("div",{class:"pop"});
  pop.append = (...a) => Element.prototype.append.apply(pop, a.flat(3).filter(x => x != null && x !== false));
  document.body.append(pop);
  const r = anchor ? anchor.getBoundingClientRect() : {left:x, bottom:y, top:y};
  POP = pop;
  requestAnimationFrame(()=>{ if (POP!==pop) return;
    const w = pop.offsetWidth, ht = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth-w-8))+"px";
    let top = r.bottom+4; if (top+ht > innerHeight-8) top = Math.max(8, (r.top||r.bottom)-ht-4);
    pop.style.top = top+"px"; });
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth-330))+"px"; pop.style.top = (r.bottom+4)+"px";
  setTimeout(()=>document.addEventListener("mousedown", outside), 0);
  return pop;
}
function outside(e){ if (POP && !POP.contains(e.target)) closePop(); }
function closePop(){ if (POP){ POP.remove(); POP=null; document.removeEventListener("mousedown", outside); } }

function dialog(content){
  const ov = h("div",{class:"overlay", onmousedown:e=>{ if(e.target===ov) close(); }}, h("div",{class:"dialog"}, content));
  const onKey = e => { if (e.key==="Escape"){ e.stopPropagation(); close(); } };
  const close = () => { ov.remove(); document.removeEventListener("keydown", onKey, true); };
  document.addEventListener("keydown", onKey, true);
  document.body.append(ov); ov.close = close;
  return ov;
}

function openSearch(){
  const q = h("input",{class:"q", placeholder:"Alles durchsuchen …"});
  const res = h("div",{class:"res"});
  let sel = 0, items = [];
  const ov = dialog([q, res]);
  const pick = r => { ov.close(); go(r.id); };
  const draw = () => { res.innerHTML = ""; if (!items.length && q.value.trim()) res.append(h("div",{class:"hint", style:"padding:10px 12px"},"Nichts gefunden."));
    items.forEach((r,i)=>res.append(h("a",{class:"r"+(i===sel?" sel":""), onclick:()=>pick(r)},
    (r.icon||defaultIcon(r.kind))+" "+(r.title||"Ohne Titel"), r.kind==="row"?h("span",{class:"hint"}," · Eintrag"):null, r.snippet?h("small",{},r.snippet):null))); };
  const recent = () => { items = (META.favorites||[]).map(id=>NODE[id]).filter(Boolean); draw(); };
  q.oninput = debounce(async ()=>{ if (!q.value.trim()) return recent(); try { items = await api("GET","/api/search?q="+encodeURIComponent(q.value)); } catch(e){ items=[]; } sel=0; draw(); }, 150);
  q.onkeydown = e => {
    if (e.key==="ArrowDown"){ sel=Math.min(sel+1, items.length-1); draw(); e.preventDefault(); }
    if (e.key==="ArrowUp"){ sel=Math.max(sel-1,0); draw(); e.preventDefault(); }
    if (e.key==="Enter" && items[sel]) pick(items[sel]);
  };
  recent(); q.focus();
}

function pickPage(placeholder, onPick, filter, extra){
  const q = h("input",{class:"q", placeholder});
  const res = h("div",{class:"res"});
  const ov = dialog([q,res]);
  const draw = () => { res.innerHTML = "";
    if (extra) res.append(h("a",{class:"r", style:"color:var(--accent)", onclick:()=>{ ov.close(); extra.fn(); }}, extra.label));
    const s = q.value.toLowerCase();
    const list = TREE.filter(n=>filter(n) && (n.title||"").toLowerCase().includes(s)).slice(0,60);
    for (const n of list) res.append(h("a",{class:"r", onclick:()=>{ ov.close(); onPick(n); }}, (n.icon||defaultIcon(n.kind))+" "+(n.title||"Ohne Titel")));
    if (!list.length && !extra) res.append(h("div",{class:"hint", style:"padding:10px 12px"},"Nichts gefunden.")); };
  q.oninput = draw; draw(); q.focus();
}

function openImport(){
  const inp = h("input",{type:"file", accept:".zip", style:"display:none", multiple:true});
  const zone = h("div",{class:"drop-zone"},"Notion-Export (.zip) hierher ziehen oder klicken");
  const log = h("div",{class:"log", style:"display:none"});
  dialog(h("div",{class:"body"},
    h("h2",{},"📥 Notion importieren"),
    h("ol",{},
      h("li",{},"In Notion: ", h("b",{},"Einstellungen → Allgemein → Alle Inhalte des Arbeitsbereichs exportieren"), "."),
      h("li",{},"Format: ", h("b",{},"Markdown & CSV"), ", alles einschließen, ", h("b",{},"Ordner für Unterseiten erstellen"), " aktivieren."),
      h("li",{},"Die heruntergeladene ZIP-Datei hier ablegen (nicht entpacken).")),
    zone, inp, log,
    h("p",{class:"hint"},"Sehr große Exporte (mehrere GB) lieber über das Terminal importieren: ", h("code",{},"python3 app.py import Export.zip"), ". Ein erneuter Import aktualisiert vorhandene Seiten; Board-Spalten, Farben und Ansichten bleiben erhalten.")));
  zone.onclick = () => inp.click();
  zone.ondragover = e => { e.preventDefault(); zone.classList.add("on"); };
  zone.ondragleave = () => zone.classList.remove("on");
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove("on"); run([...e.dataTransfer.files]); };
  inp.onchange = () => run([...inp.files]);
  async function run(files){
    log.style.display = "block";
    for (const f of files){
      log.textContent += `Lade ${f.name} (${(f.size/1048576).toFixed(1)} MB) … bitte warten\n`;
      try { const r = await api("POST","/api/import", f, true); log.textContent += r.log.join("\n") + "\n"; }
      catch(e){ log.textContent += "Fehler: " + e.message + "\n"; }
    }
    await loadTree(); route();
    log.textContent += "✓ Fertig.";
  }
}

  const p = CURRENT;
  const pop = popover(e.currentTarget);
  const wide = isWide(p);
  pop.append(
    p.kind!=="database" ? h("button",{class:"item", onclick:()=>{closePop(); newPage(p.id);}},"＋ Unterseite") : null,
    p.kind!=="database" ? h("button",{class:"item", onclick:()=>{closePop(); newPage(p.id,"database");}},"＋ Unter-Datenbank") : null,
    h("button",{class:"item", onclick:()=>{ closePop(); META.home = META.home===p.id ? null : p.id; saveMeta("home"); toast(META.home ? "Als Startseite festgelegt" : "Startseite entfernt"); }}, META.home===p.id ? "🏠 Nicht mehr Startseite" : "🏠 Als Startseite festlegen"),
    h("button",{class:"item", onclick:()=>{ closePop(); META.wide[p.id] = !wide; saveMeta("wide"); openPage(p.id); }}, wide ? "↔ Normale Breite" : "↔ Volle Breite"),
    p.kind!=="row" ? h("button",{class:"item", onclick:()=>{closePop(); pickPage("Verschieben nach …", async n=>{ try{ await api("PUT",`/api/page/${p.id}`,{parent_id:n.id}); await loadTree(); openPage(p.id); toast("Verschoben"); }catch(err){ toast(err.message); } }, n=>n.kind==="page" && n.id!==p.id,
        {label:"⬆ Auf die oberste Ebene", fn: async()=>{ await api("PUT",`/api/page/${p.id}`,{parent_id:null}); await loadTree(); openPage(p.id); }});}},"↪ Verschieben nach …") : null,
    h("button",{class:"item", onclick:async()=>{closePop(); const r = await api("POST",`/api/duplicate/${p.id}`); await loadTree(); go(r.id);}},"⧉ Duplizieren"),
    h("button",{class:"item", onclick:()=>{closePop(); openHistory(p, false);}},"🕘 Seitenverlauf"),
    h("button",{class:"item", onclick:()=>{closePop(); navigator.clipboard?.writeText(`[${p.title}](#/p/${p.id})`); toast("Link kopiert – im Editor einfügen");}},"🔗 Link zu dieser Seite kopieren"),
    h("div",{class:"hint", style:"padding:4px 8px;white-space:pre-line"}, "Erstellt: "+p.created.replace("T"," ")+"\nGeändert: "+p.updated.replace("T"," ")),
    h("hr"),
    h("button",{class:"item danger", onclick:async()=>{ closePop(); await api("DELETE",`/api/page/${p.id}`); await loadTree();
      toast("In den Papierkorb verschoben","Rückgängig", async()=>{ await api("POST",`/api/restore/${p.id}`); await loadTree(); go(p.id); });
      if (p.parent_id) go(p.parent_id); else location.hash="#/alle"; }},"🗑 Löschen"));
}

// ---- Updates ----------------------------------------------------------------
async function checkUpdate(manual){
  const btn = $("#btnUpdate");
  let u;
  try { u = await api("GET","/api/update"); } catch(e){ if (manual) toast(e.message); return; }
  btn.title = "Installierte Version: " + u.current;
  if (u.available){
    btn.textContent = "Update " + u.latest + " installieren"; btn.style.color = "var(--accent)"; btn.dataset.ready = "1";
    if (manual) installUpdate(u);
  } else {
    btn.textContent = "Nach Updates suchen"; btn.style.color = ""; delete btn.dataset.ready;
    if (manual) toast(u.reachable ? "Du hast die neueste Version (" + u.current + ")." : "Update-Server nicht erreichbar. Bist du online?");
  }
  return u;
}
async function installUpdate(u){
  if (!confirm(`Update auf Version ${u.latest} installieren?` + (u.notes ? `\n\nNeu: ${u.notes}` : "") + "\n\nDeine Daten bleiben unverändert. Die App startet kurz neu.")) return;
  // Lokal bearbeitete Programmdateien nicht stillschweigend überschreiben
  const mod = u.modified || [];
  if (mod.length && !confirm("Achtung: Diese Programmdateien wurden auf diesem Rechner verändert und würden durch das Update überschrieben:\n\n  " + mod.join("\n  ")
    + "\n\nDie bisherigen Dateien werden im Ordner „alte-versionen“ aufgehoben. Trotzdem aktualisieren?")) return;
  flushAll();
  const ov = dialog(h("div",{class:"body"}, h("h2",{},"⬆️ Update wird installiert …"), h("p",{class:"hint"},"Bitte einen Moment warten. Die Seite lädt danach von selbst neu.")));
  try { const res = await api("POST","/api/update", {force: mod.length > 0});
    if (res.blocked){ ov.close(); toast("Nicht aktualisiert: Programmdateien wurden lokal geändert (" + (res.modified||[]).join(", ") + "). Bitte erneut auf „Update“ klicken."); checkUpdate(false); return; } }
  catch(e){ ov.close(); toast("Update fehlgeschlagen: " + e.message); return; }
  // warten, bis der Server wieder antwortet, dann neu laden
  for (let i=0; i<40; i++){
    await new Promise(r=>setTimeout(r, 700));
    try { const r = await fetch("/api/update", {cache:"no-store"}); if (r.ok){ const j = await r.json(); if (j.current === u.latest || i > 6){ location.reload(); return; } } } catch(e){}
  }
  ov.close(); toast("Update eingespielt. Bitte die App einmal neu starten.");
}
$("#btnUpdate").onclick = () => checkUpdate(true);

// Passwortschutz
// ===========================================================================
function showLogin(){
  if ($("#login")) return;
  closePop(); document.querySelectorAll(".overlay").forEach(o=>o.remove());
  const pw = h("input",{type:"password", autocomplete:"current-password", placeholder:"Passwort"});
  const msg = h("div",{class:"hint err"});
  const btn = h("button",{class:"btn primary", type:"submit"},"Anmelden");
  const form = h("form",{class:"loginbox", onsubmit:async e=>{ e.preventDefault(); if (!pw.value) return;
    btn.disabled = true; msg.textContent = "";
    try { await api("POST","/api/auth/login",{password:pw.value}); location.reload(); }
    catch(err){ msg.textContent = err.message; btn.disabled = false; pw.select(); } }},
    h("div",{class:"lg-title"},"Notion Lokal"), h("div",{class:"hint"},"Diese Daten sind mit einem Passwort geschützt."), pw, msg, btn);
  document.body.append(h("div",{id:"login"}, form));
  setTimeout(()=>pw.focus(), 30);
}
async function openPassword(){
  let s; try { s = await api("GET","/api/auth"); } catch(e){ return toast(e.message); }
  const inp = ph => h("input",{type:"password", placeholder:ph, autocomplete:"new-password"});
  const cur = inp("Aktuelles Passwort"), n1 = inp(s.enabled ? "Neues Passwort" : "Passwort (mindestens 6 Zeichen)"), n2 = inp("Passwort wiederholen");
  const msg = h("div",{class:"hint err"});
  const send = async (body, done) => { msg.textContent = ""; try { await api("POST","/api/auth/set", body); ov.close(); toast(done); } catch(e){ msg.textContent = e.message; } };
  const setPw = () => { if (n1.value.length < 6) return msg.textContent = "Das Passwort braucht mindestens 6 Zeichen.";
    if (n1.value !== n2.value) return msg.textContent = "Die beiden Eingaben stimmen nicht überein.";
    send({current:cur.value, new:n1.value}, s.enabled ? "Passwort geändert" : "Passwortschutz ist aktiv"); };
  n2.onkeydown = e => { if (e.key==="Enter") setPw(); };
  const ov = dialog(h("div",{class:"body pwbox"},
    h("h2",{}, s.enabled ? "Passwort ändern" : "Passwortschutz einrichten"),
    h("p",{class:"hint"}, s.enabled ? "Der Passwortschutz ist aktiv. Nach 30 Tagen oder nach dem Abmelden wird das Passwort neu abgefragt."
      : "Danach fragt die App an jedem Gerät nach dem Passwort, bevor sie Seiten, Datenbanken oder Dateien zeigt."),
    s.enabled ? cur : null, n1, n2, msg,
    h("div",{class:"pwrow"},
      h("button",{class:"btn primary", onclick:setPw}, s.enabled ? "Passwort ändern" : "Passwort setzen"),
      s.enabled ? h("button",{class:"btn", onclick:async()=>{ try { await api("POST","/api/auth/logout"); } catch(e){} location.reload(); }},"Abmelden") : null,
      s.enabled ? h("button",{class:"btn danger", onclick:()=>{ if (!cur.value) return msg.textContent = "Gib zum Entfernen das aktuelle Passwort ein.";
        send({current:cur.value, new:""}, "Passwortschutz entfernt"); }},"Schutz entfernen") : null),
    h("p",{class:"hint"},"Wichtig: Das Passwort schützt den Zugriff über die App. Die Datei daten/notion.sqlite3 wird nicht verschlüsselt. Wer den Datenordner öffnen kann, kann die Inhalte auch ohne Passwort lesen. Passwort vergessen? Im Terminal „python3 app.py passwort-entfernen“ hebt den Schutz auf.")));
  setTimeout(()=>(s.enabled ? cur : n1).focus(), 30);
}
$("#btnPass").onclick = openPassword;
$("#btnTheme").onclick = () => { META.theme = ({auto:"light", light:"dark", dark:"auto"})[META.theme||"auto"]; saveMeta("theme"); applyTheme(); };
$("#btnFav").onclick = () => { if (!CURRENT) return; const id = CURRENT.id; const on = META.favorites.includes(id);
  META.favorites = on ? META.favorites.filter(x=>x!==id) : [...META.favorites, id]; saveMeta("favorites"); $("#btnFav").textContent = on ? "☆" : "★"; renderTree(); };
$("#menuBtn").onclick = () => { if (innerWidth <= 760) document.body.classList.toggle("side-open"); else { document.body.classList.toggle("side-collapsed"); try{ localStorage.setItem("nl_side", document.body.classList.contains("side-collapsed")?"0":"1"); }catch{} } };
$("#main").addEventListener("click", () => document.body.classList.remove("side-open"));
$("#lightbox").onclick = () => { $("#lightbox").style.display = "none"; };
document.addEventListener("keydown", e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); return; }
  if (e.key==="Escape"){
    if ($("#lightbox").style.display==="flex"){ $("#lightbox").style.display="none"; return; }
    if (POP){ closePop(); return; }
    if (e.target.matches?.("textarea, input, [contenteditable]")) return;
    if (PEEK && !$(".overlay")) closePeek();
  }
});
window.addEventListener("beforeunload", flushAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushAll(); });
try { if (localStorage.getItem("nl_side")==="0") document.body.classList.add("side-collapsed"); } catch {}

(async () => {
  try { Object.assign(META, await api("GET","/api/meta")); } catch(e){}
  for (const k of ["favorites","expanded"]) if (!Array.isArray(META[k])) META[k] = [];
  for (const k of ["wide","views","closed","dbs"]) if (!META[k] || typeof META[k]!=="object") META[k] = {};
  applyTheme();
  try { await loadTree(); } catch(e){ return; }   // z. B. nicht angemeldet: Anmeldebildschirm steht schon
  route();
  checkLock();
  checkUpdate(false);
})();
