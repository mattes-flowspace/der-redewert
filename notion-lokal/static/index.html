const PENDING = new Set();   // offene Speichervorgänge der Editoren
function flushAll(){ for (const f of PENDING) f.flush(); }

async function openPage(id){
  flushAll(); PENDING.clear();
  let p;
  try { p = await api("GET", `/api/page/${id}`); }
  catch(e){ $("#view").innerHTML = `<div class="page empty"><div class="big">🤷</div><h2>Seite nicht gefunden</h2><p><a href="#/alle">Zur Übersicht</a></p></div>`; return; }
  CURRENT = p; LIVE = [];
  for (const c of p.breadcrumbs) if (NODE[c.id]) EXPANDED.add(c.id);
  renderTree(); renderCrumbs(p);
  $("#btnFav").style.display=""; $("#btnMore").style.display="";
  $("#btnFav").textContent = META.favorites.includes(p.id) ? "★" : "☆";
  document.title = (p.title || "Ohne Titel") + " – Notion Lokal";
  const v = $("#view"); v.innerHTML = "";
  if (p.deleted) v.append(h("div",{style:"background:var(--t-red);padding:8px 16px;font-size:14px;text-align:center"},"Diese Seite liegt im Papierkorb. ",
    h("button",{class:"btn", style:"text-decoration:underline", onclick:async()=>{await api("POST",`/api/restore/${p.id}`); await loadTree(); openPage(p.id);}},"Wiederherstellen")));
  const wide = isWide(p);
  const page = h("div",{class:"page"+(wide?" wide":"")});
  v.append(page);
  renderPageInto(page, p, false);
  if (p.children && p.children.length && p.kind!=="database"){
    const linked = new Set([...p.content.matchAll(/#\/p\/([0-9a-zA-Z_-]+)/g)].map(m=>m[1]));
    const rest = p.children.filter(c=>!linked.has(c.id));
    if (rest.length) page.append(h("div",{class:"children"}, h("div",{class:"section-title", style:"padding-left:6px"},"UNTERSEITEN"),
      rest.map(c=>h("a",{href:"#/p/"+c.id}, h("span",{}, c.icon||defaultIcon(c.kind)), c.title||"Ohne Titel"))));
  }
  $("#main").scrollTop = 0;
}

// Datenbanken und Seiten mit eingebetteten Boards (Dashboards) nutzen standardmäßig die volle Breite
function isWide(p){ return META.wide[p.id] ?? (p.kind==="database" || [...(p.content||"").matchAll(/^\s*\[[^\n]*\]\(#\/p\/([0-9a-zA-Z_-]+)\)\s*$/gm)].some(m=>NODE[m[1]]?.kind==="database")); }

function renderPageInto(page, p, inPeek){
  const afterChange = () => { if (p.kind==="row" || p.kind==="template") notifyDb(p.parent_id); };
  if (p.kind==="template") page.append(h("div",{class:"tpl-banner"},
    h("span",{}, "Du bearbeitest eine Vorlage für ", h("b",{}, p.db_title || "die Datenbank"), "."),
    h("span",{class:"hint", style:"margin:0"}, "Neue Einträge übernehmen Icon, Cover, Eigenschaften und Inhalt. „@heute“ wird zum Datum des Anlegens.")),
    recurEditor(p));
  const iconEl = p.icon ? h("div",{class:"icon-big", title:"Icon ändern", onclick:e=>pickIcon(p, e.currentTarget, inPeek)}, p.icon)
                        : h("button",{class:"add-icon", onclick:e=>pickIcon(p, e.currentTarget, inPeek)},"Icon hinzufügen");
  // Cover: Farbverlauf, hochgeladenes Bild oder Bild-Link
  const setCover = async c => {
    closePop(); p.cover = c;
    await save(p.id, {cover:c}); afterChange();
    if (inPeek) openPeek(p.id); else openPage(p.id);
  };
  const coverMenu = anchor => {
    const pop = popover(anchor);
    pop.classList.add("coverpop");
    const fileInp = h("input",{type:"file", accept:"image/*", style:"display:none"});
    fileInp.onchange = async () => { const f = fileInp.files[0]; if (!f) return; try { setCover(await uploadFile(p.id, f)); } catch(e){ toast(e.message); } };
    const url = h("input",{placeholder:"Bild-Link einfügen (https://…), Enter"});
    url.onkeydown = e => { if (e.key==="Enter" && url.value.trim()) setCover(url.value.trim()); };
    pop.append(h("label",{},"Farbverlauf"),
      h("div",{class:"gradpick"}, GRADIENTS.map((g,i)=>h("button",{style:`background:${g}`, title:"Verlauf "+(i+1), onclick:()=>setCover("gradient:"+i)}))),
      h("label",{},"Eigenes Bild"),
      h("button",{class:"item", onclick:()=>fileInp.click()},"Bild hochladen …"), fileInp, url,
      p.cover ? [h("hr"), h("button",{class:"item danger", onclick:()=>setCover("")},"Cover entfernen")] : null);
  };
  page.parentElement?.querySelectorAll(":scope>.cover").forEach(x=>x.remove());
  page.classList.toggle("has-cover", !!p.cover);
  if (p.cover){
    const cv = h("div",{class:"cover", style:coverCss(p.cover)},
      h("div",{class:"cover-btns"},
        h("button",{onclick:e=>coverMenu(e.currentTarget)},"Cover ändern"),
        h("button",{onclick:()=>setCover("")},"Entfernen")));
    // auf ganzen Seiten über die volle Breite, in der Seitenleiste innerhalb des Inhalts
    if (inPeek || !page.parentElement) page.append(cv); else page.parentElement.insertBefore(cv, page);
  }
  page.append(h("div",{class:"page-actions"}, iconEl,
    p.cover ? null : h("button",{class:"add-icon", onclick:e=>coverMenu(e.currentTarget)},"Cover hinzufügen")));
  const titleEl = h("h1",{class:"title", spellcheck:"false"}, p.title);
  try { titleEl.contentEditable = "plaintext-only"; } catch { titleEl.contentEditable = "true"; }
  if (titleEl.contentEditable !== "plaintext-only") titleEl.contentEditable = "true";
  titleEl.onkeydown = e => { if (e.key==="Enter"){ e.preventDefault(); titleEl.blur(); } };
  titleEl.onpaste = e => { e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData.getData("text/plain")||"").replace(/\s+/g," ")); };
  const saveTitle = debounce(async ()=>{ p.title = titleEl.textContent.trim(); await save(p.id,{title:p.title}); const n=NODE[p.id]; if(n){n.title=p.title; renderTree();} if(!inPeek) renderCrumbs(p); afterChange(); }, 500);
  PENDING.add(saveTitle);
  titleEl.oninput = saveTitle; titleEl.onblur = () => saveTitle.flush();
  page.append(titleEl);
  if (p.kind==="row" || p.kind==="template") page.append(renderProps(p, afterChange));
  page.append(renderDoc(p, p.kind==="database"));
  if (p.kind==="database"){ const host = h("div"); page.append(host); mountDatabase(host, p.id, p.id, {preloaded:p}); }
}

function renderCrumbs(p){
  const c = $("#crumbs"); c.innerHTML = "";
  for (const b of [...p.breadcrumbs, p]){
    if (c.childNodes.length) c.append(h("span",{},"/"));
    c.append(h("span",{class:"crumb", onclick:()=>go(b.id)}, (b.icon||defaultIcon(b.kind))+" "+(b.title||"Ohne Titel")));
  }
}

async function save(id, data){
  setStatus("Speichert …");
  try { await api("PUT", `/api/page/${id}`, data); setStatus("✓ Gespeichert"); setTimeout(()=>{ if($("#status").textContent==="✓ Gespeichert") setStatus(""); },1500); return true; }
  catch(e){ setStatus("⚠️ Nicht gespeichert"); toast(e.message); return false; }
}

function renderDoc(p, compact){
  const wrap = h("div");
  const saver = debounce(()=>save(p.id,{content:p.content}), 700);
  PENDING.add(saver);

  p.content = p.content.replace(/^[ \t>]*(?:[-*+] (?:\[[ xX]\] )?|\d+[.)] |#{1,6} )?\u200b[ \t]*\n?/gm, "").replace(/\u200b/g, "");   // Reste leerer Blöcke
  const embeds = new Map();          // eingebettete Datenbanken über Neuaufbauten hinweg behalten (kein Flackern)
  let flushEdit = () => {};          // schreibt den gerade bearbeiteten Block in den Quelltext
  const colsMd = n => "<columns>\n" + Array.from({length:n}, (_,k)=>`<column>\n\nSpalte ${k+1}\n\n</column>`).join("\n") + "\n</columns>\n";
  const dateStr = add => { const d = new Date(); d.setDate(d.getDate()+add); return d.toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"}); };

  // Befehle des „/“-Menüs; api = {ins, linePrefix, upload} des jeweiligen Editors
  const buildCmds = ({ins, linePrefix, upload}) => {
    const newDb = async view => {
      const name = prompt("Name der neuen Datenbank:", view==="board" ? "Aufgaben" : "Tabelle"); if (!name) return;
      const r = await api("POST","/api/page",{kind:"database", parent_id:p.id, title:name});
      META.views[p.id+":"+r.id] = {view}; saveMeta("views");
      await loadTree(); ins(`\n[${name}](#/p/${r.id})\n`,"",true);
    };
    const newSub = async () => {
      const name = prompt("Titel der neuen Seite:", ""); if (name===null) return;
      const r = await api("POST","/api/page",{kind:"page", parent_id:p.id, title:name});
      await loadTree(); ins(`\n[${name||"Ohne Titel"}](#/p/${r.id})\n`,"",true);
    };
    return [
      ["Grundlagen"],
      ["T","Text","Einfacher Absatz","text absatz paragraph",()=>linePrefix("")],
      ["H1","Überschrift 1","Große Überschrift","heading h1 #",()=>linePrefix("# ")],
      ["H2","Überschrift 2","Mittlere Überschrift","heading h2 ##",()=>linePrefix("## ")],
      ["H3","Überschrift 3","Kleine Überschrift","heading h3 ###",()=>linePrefix("### ")],
      ["•","Aufzählung","Einfache Liste","bullet liste list",()=>linePrefix("- ")],
      ["1.","Nummerierte Liste","Liste mit Zahlen","numbered nummer liste list",()=>linePrefix("1. ")],
      ["☑","To-do-Liste","Aufgaben zum Abhaken","todo checkbox aufgabe task",()=>linePrefix("- [ ] ")],
      ["▸","Toggle","Aufklappbarer Bereich","toggle aufklappen details",()=>ins("<details><summary>Titel","</summary>\n\nInhalt\n\n</details>\n",true)],
      ["▸H","Toggle-Überschrift 1","Aufklappbare große Überschrift","toggle heading überschrift",()=>ins("<details><summary># Titel","</summary>\n\nInhalt\n\n</details>\n",true)],
      ["▸H","Toggle-Überschrift 2","Aufklappbare mittlere Überschrift","toggle heading überschrift",()=>ins("<details><summary>## Titel","</summary>\n\nInhalt\n\n</details>\n",true)],
      ["▸H","Toggle-Überschrift 3","Aufklappbare kleine Überschrift","toggle heading überschrift",()=>ins("<details><summary>### Titel","</summary>\n\nInhalt\n\n</details>\n",true)],
      ["▫","Seite","Neue Unterseite anlegen","page seite unterseite neu",newSub],
      ["↗","Link zu Seite","Vorhandene Seite verlinken","link page seite verweis",()=>pickPage("Seite verlinken …", n=>ins(`[${n.title||"Ohne Titel"}](#/p/${n.id})`), ()=>true)],
      ["!","Hinweis","Hervorgehobener Kasten","callout hinweis kasten info",()=>ins("<aside>\nHinweis","\n</aside>\n",true)],
      ["❝","Zitat","Zitat hervorheben","quote zitat",()=>linePrefix("> ")],
      ["▦","Tabelle","Einfache Tabelle","table tabelle",()=>ins("| Spalte 1 | Spalte 2 | Spalte 3 |\n| --- | --- | --- |\n|  |  |  |\n|  |  |  |\n","",true)],
      ["—","Trennlinie","Abschnitte optisch trennen","divider linie trenner hr",()=>ins("\n---\n","",true)],
      ["</>","Code","Codeblock","code",()=>ins("```\nCode","\n```\n",true)],
      ["Medien"],
      ["▣","Bild","Bild hochladen","image bild foto",()=>upload("image/*")],
      ["▶","Video","Video hochladen und abspielen","video film mp4",()=>upload("video/*")],
      ["♪","Audio","Audiodatei hochladen","audio musik ton mp3",()=>upload("audio/*")],
      ["↥","Datei","Beliebige Datei anhängen","file datei anhang pdf",()=>upload("")],
      ["☆","Web-Lesezeichen","Link auf eine Webseite","bookmark link url web lesezeichen",()=>{ const u = prompt("Adresse der Webseite:", "https://"); if (u && u!=="https://") ins(`[${u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"")}](${u})`); }],
      ["Datenbank"],
      ["▥","Board","Neues Kanban-Board anlegen","board kanban database datenbank",()=>newDb("board")],
      ["▦","Tabellen-Datenbank","Neue Datenbank als Tabelle","table database datenbank tabelle",()=>newDb("table")],
      ["▤","Vorhandene Datenbank","Bestehende Datenbank einbetten","linked database datenbank einbetten view",()=>pickPage("Datenbank einbetten …", n=>ins(`\n[${n.title||"Ohne Titel"}](#/p/${n.id})\n`,"",true), n=>n.kind==="database")],
      ["Layout"],
      ["▯▯","2 Spalten","Inhalte nebeneinander","columns spalten layout",()=>ins(colsMd(2),"",true)],
      ["▯▯▯","3 Spalten","Inhalte nebeneinander","columns spalten layout",()=>ins(colsMd(3),"",true)],
      ["▯▯▯▯","4 Spalten","Inhalte nebeneinander","columns spalten layout",()=>ins(colsMd(4),"",true)],
      ["☰","Inhaltsverzeichnis","Liste aller Überschriften","toc table of contents inhalt",()=>ins("[[inhalt]]\n","",true)],
      ["Im Text"],
      ["◷","Heute","Heutiges Datum einfügen","date today datum heute",()=>ins(dateStr(0))],
      ["◷","Morgen","Datum von morgen einfügen","date tomorrow datum morgen",()=>ins(dateStr(1))],
      ["𝗕","Fett","Text fett setzen","bold fett",()=>ins("**","**")],
      ["𝘐","Kursiv","Text kursiv setzen","italic kursiv",()=>ins("*","*")],
      ["S","Durchgestrichen","Text durchstreichen","strike durchgestrichen",()=>ins("~~","~~")],
    ];
  };

  // „/“-Menü, unabhängig vom Editor; ad = {text(), caret(), xy(), remove(start, caret)}
  const makeSlash = (ad, CMDS) => {
    let slash = null;
    const close = () => { if (slash){ slash.el.remove(); slash = null; } };
    const draw = () => {
      const q = ad.text().slice(slash.start+1, ad.caret()).toLowerCase().trim();
      const el = slash.el; el.innerHTML = ""; slash.items = [];
      let grp = null;
      for (const c of CMDS){
        if (c.length===1){ grp = c[0]; continue; }
        if (q && !(c[1]+" "+c[3]).toLowerCase().includes(q)) continue;
        if (grp){ el.append(h("div",{class:"grp"}, grp.toUpperCase())); grp = null; }
        const idx = slash.items.length;
        const it = h("button",{class:"item", onmousedown:e=>e.preventDefault(), onclick:()=>run(idx)},
          h("span",{class:"i"}, c[0]), h("span",{}, h("div",{}, c[1]), h("div",{class:"d"}, c[2])));
        slash.items.push({c, it}); el.append(it);
      }
      if (!slash.items.length){ if (q.length > 12 || /\s/.test(q)) return close(); el.append(h("div",{class:"hint", style:"padding:8px"},"Kein passender Befehl")); }
      if (slash.sel >= slash.items.length) slash.sel = Math.max(0, slash.items.length-1);
      slash.items.forEach((x,k)=>x.it.classList.toggle("sel", k===slash.sel));
      slash.items[slash.sel]?.it.scrollIntoView({block:"nearest"});
    };
    const open = () => {
      const el = h("div",{class:"pop slash"}); document.body.append(el);
      slash = {start: ad.caret()-1, el, items:[], sel:0};
      const {x,y} = ad.xy();
      el.style.left = Math.max(8, Math.min(x, innerWidth-312))+"px";
      el.style.top = (y+348 > innerHeight ? Math.max(8, y-22-348) : y+4)+"px";
      draw();
    };
    const run = idx => { const item = slash.items[idx]; if (!item) return; ad.remove(slash.start, ad.caret()); close(); item.c[4](); };
    const input = () => {
      const pos = ad.caret(), t = ad.text();
      if (slash){ if (pos <= slash.start || t[slash.start] !== "/" || t.slice(slash.start, pos).includes("\n")) close(); else draw(); return; }
      if (t[pos-1] === "/" && (pos===1 || /[\s\u200b]/.test(t[pos-2]))) open();
    };
    const key = e => {
      if (!slash) return false;
      if (e.key==="ArrowDown"){ slash.sel = Math.min(slash.sel+1, slash.items.length-1); draw(); }
      else if (e.key==="ArrowUp"){ slash.sel = Math.max(slash.sel-1, 0); draw(); }
      else if (e.key==="Enter" || e.key==="Tab"){ if (!slash.items.length){ close(); return false; } run(slash.sel); }
      else if (e.key==="Escape"){ close(); }
      else return false;
      e.preventDefault(); e.stopPropagation(); return true;
    };
    return {close, input, key, isOpen:()=>!!slash, start:()=>slash ? slash.start : -1};
  };

  const show = (focus) => {
    flushEdit = () => {};
    const kept = [...embeds.values()].map(el => [el.querySelector(".board, .tablewrap"), el.querySelector(".board, .tablewrap")?.scrollLeft]);
    wrap.innerHTML = "";
    MDX = {closed:new Set(META.closed[p.id]||[])};
    if (!p.content.trim()){
      wrap.append(h("div",{class:"doc blank", style:compact?"min-height:0":"", onclick:()=>{ p.content = ZW; show({line:0, offset:0}); }}, compact ? "Beschreibung hinzufügen" : "Hier klicken zum Schreiben"));
      return;
    }
    const doc = h("div",{class:"doc", style:compact?"min-height:0":"", html: md(p.content)});
    doc.onclick = e => {
      const t = e.target;
      if (t.matches("input[data-task]")){ toggleTask(+t.dataset.task, t.checked); return; }
      if (t.tagName==="IMG"){ const lb=$("#lightbox"); $("img",lb).src=t.src; lb.style.display="flex"; return; }
      if (t.closest("a, .embed, button, input")) return;
      if (getSelection().toString()) return;
      if (t.closest("summary")) return;
      const ed = t.closest(EDITABLE);
      if (ed && doc.contains(ed)){ if (!cur || cur.el !== ed) startEdit(ed, e); return; }
      const raw = t.closest("table[data-l], pre[data-l], hr[data-l]");     // Tabellen, Code, Linien: im Text-Editor
      if (raw) edit(+raw.dataset.l);
    };
    doc.addEventListener("toggle", e => {
      const d = e.target; if (!d.matches?.("details.tg")) return;
      const set = new Set(META.closed[p.id]||[]); d.open ? set.delete(d.dataset.s) : set.add(d.dataset.s);
      META.closed[p.id] = [...set]; if (!set.size) delete META.closed[p.id]; saveMeta("closed");
    }, true);
    // ----- Text markieren -> Formatierungsleiste (ohne in den Editor zu wechseln) -----
    const locate = () => {
      const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return null;
      const range = sel.getRangeAt(0), raw = sel.toString(), text = raw.trim();
      if (!text) return null;
      const elOf = n => (n.nodeType===1 ? n : n.parentElement);
      const sEl = elOf(range.startContainer)?.closest("[data-l]"), eEl = elOf(range.endContainer)?.closest("[data-l]");
      if (!sEl || !doc.contains(sEl) || elOf(range.startContainer).closest(".embed, .toc, pre")) return null;
      const a = +sEl.dataset.l, lines = p.content.split("\n");
      if (lines[a] === undefined) return null;
      let b = a;
      if (!/^(H[1-6]|SPAN|SUMMARY)$/.test(sEl.tagName)) while (b+1 < lines.length && lines[b+1].trim() !== "") b++;
      let lineStart = 0; for (let k=0; k<a; k++) lineStart += lines[k].length+1;
      let limit = lineStart; for (let k=a; k<=b; k++) limit += lines[k].length+1;
      const loc = {a, b, lineStart, limit, tag:sEl.tagName, text};
      if (sEl !== eEl || /\n/.test(text)){ loc.err = "Bitte Text innerhalb einer Zeile markieren."; return loc; }
      // die wievielte Fundstelle im Absatz ist markiert? -> dieselbe im Quelltext nehmen
      const pre = document.createRange(); pre.selectNodeContents(sEl); pre.setEnd(range.startContainer, range.startOffset);
      const beforeLen = pre.toString().length + (raw.length - raw.trimStart().length);
      const full = sEl.textContent; let n = 0, k = -1;
      while ((k = full.indexOf(text, k+1)) !== -1 && k < beforeLen) n++;
      let pos = lineStart-1;
      for (let i=0; i<=n; i++){ pos = p.content.indexOf(text, pos+1); if (pos < 0) break; }
      if (pos < 0 || pos+text.length > limit) loc.err = "Hier steckt schon Formatierung im markierten Text. Markiere einen kleineren Teil oder klicke in den Text, um ihn direkt zu bearbeiten.";
      else loc.pos = pos;
      return loc;
    };
    const commit = content => {
      const sc = wrap.closest(".peek-body") || $("#main"), top = sc.scrollTop;
      wrap.style.minHeight = wrap.offsetHeight+"px";
      cur = null; SL.close();
      p.content = content; saver(); saver.flush(); closeFmt(); getSelection().removeAllRanges(); show();
      sc.scrollTop = top; setTimeout(()=>{ wrap.style.minHeight = ""; }, 900);
    };
    const fmtAct = (kind, arg) => {
      flushEdit();
      const loc = locate(); if (!loc) return closeFmt();
      const c = p.content, lines = c.split("\n");
      if (kind==="type"){
        if (loc.tag==="SUMMARY") return toast("Der Titel eines Toggles lässt sich nur im Editor ändern.");
        lines[loc.a] = lines[loc.a].replace(PREFIX_RE, (m, ind) => ind + arg); return commit(lines.join("\n"));
      }
      if (kind==="clear"){ for (let k=loc.a; k<=loc.b; k++) lines[k] = stripFmt(lines[k]); return commit(lines.join("\n")); }
      if ((kind==="color" || kind==="bg") && !arg){ for (let k=loc.a; k<=loc.b; k++) lines[k] = (kind==="color"?stripColor:stripBg)(lines[k]); return commit(lines.join("\n")); }
      if (loc.err) return toast(loc.err);
      const {pos, text} = loc;
      if (kind==="link"){ const u = prompt("Link-Adresse:", "https://"); if (!u || u==="https://") return; return commit(c.slice(0,pos)+`[${text}](${u})`+c.slice(pos+text.length)); }
      const [o, cl] = fmtWrap(kind, arg);
      if (c.slice(pos-o.length, pos)===o && c.slice(pos+text.length, pos+text.length+cl.length)===cl)   // schon gesetzt -> wieder entfernen
        return commit(c.slice(0,pos-o.length)+text+c.slice(pos+text.length+cl.length));
      commit(c.slice(0,pos)+o+text+cl+c.slice(pos+text.length));
    };
    const selCheck = () => setTimeout(() => {
      const sel = getSelection();
      if (!sel.rangeCount || sel.isCollapsed || !doc.contains(sel.anchorNode) || !sel.toString().trim()) return;
      if (!locate()) return;
      showFmt(sel.getRangeAt(0).getBoundingClientRect(), fmtAct);
    }, 10);
    doc.addEventListener("mouseup", selCheck); doc.addEventListener("touchend", selCheck);
    doc.addEventListener("keyup", e => { if (e.shiftKey) selCheck(); });

    // ===== Direkt in der Ansicht schreiben: der angeklickte Block wird bearbeitbar =====

      ins(f.type.startsWith("image/") ? `![${f.name||"bild"}](${url})` : `[${f.name}](${url})`);
    };
    ta.ondragover = e => e.preventDefault();
    ta.ondrop = async e => {
      const files=[...(e.dataTransfer?.files||[])]; if(!files.length) return; e.preventDefault();
      for (const f of files){ const url=await uploadFile(p.id,f); ins((/^(image|video|audio)\//.test(f.type)?"!":"")+`[${f.name}](${url})\n`,"",true); }
    };
    const box = h("div",{class:"edwrap"}, bar, ta, fileInp);
    // Bearbeiten beenden, sobald außerhalb geklickt wird
    const outsideClick = e => { if (!box.isConnected){ document.removeEventListener("mousedown", outsideClick, true); return; }
      if (box.contains(e.target) || e.target.closest(".pop, .overlay, #toast")) return;
      document.removeEventListener("mousedown", outsideClick, true); done(); };
    setTimeout(()=>document.addEventListener("mousedown", outsideClick, true), 0);
    wrap.append(box, h("div",{class:"hint"},"Tippe / für Befehle · Bilder per Einfügen oder Hineinziehen · Esc oder „Fertig“ zum Beenden · wird automatisch gespeichert"));
    grow();
    const lines = ta.value.split("\n");
    const ln = Math.min(line, lines.length-1);
    let pos = 0; for (let k=0;k<=ln;k++) pos += lines[k].length + (k<ln?1:0);
    ta.focus({preventScroll:true}); ta.setSelectionRange(pos,pos);
    requestAnimationFrame(()=>{ const y = ta.getBoundingClientRect().top + 14 + ln*22.4; const sr = scroller.getBoundingClientRect();
      if (y < sr.top+90 || y > sr.bottom-60) scroller.scrollTop += y - (sr.top + sr.height*0.4); });
  };
  show();
  return wrap;
}

async function uploadFile(pid, f){
  setStatus("Lädt hoch …");
  try { const r = await api("POST", `/api/upload?page=${encodeURIComponent(pid)}&name=${encodeURIComponent(f.name||"bild.png")}`, f, true); setStatus(""); return r.url; }
  catch(e){ setStatus(""); toast(e.message); throw e; }
}

const TYPES = {title:"Titel", text:"Text", number:"Zahl", select:"Auswahl", multi_select:"Mehrfachauswahl", date:"Datum", checkbox:"Checkbox", url:"URL", email:"E-Mail", relation:"Verknüpfung", rollup:"Rollup", formula:"Formel", files:"Dateien"};
function typeIcon(t){ return ({title:"Aa", text:"≡", number:"#", select:"◉", multi_select:"☰", date:"◷", checkbox:"☑", url:"↗", email:"@", relation:"⇄", rollup:"∑", formula:"ƒ", files:"↥"})[t]||"≡"; }

function renderProps(p, afterChange){
  const box = h("div",{class:"props"});
  const db = {id:p.parent_id, schema:p.db_schema, rows:[], tpl:p.kind==="template"};
  const draws = [], drawAll = () => draws.forEach(f=>f());
  for (const col of p.db_schema){
    if (col.type==="title") continue;
    const v = h("div",{class:"v"});
    const draw = () => { renderCellValue(v, col, p.props[col.name] ?? "", p, p.db_schema); v.classList.toggle("isempty", !v.childNodes.length); };
    draws.push(draw); draw();
    v.onclick = e => { if (e.target.closest("a")) return; editCell(v, col, p.props[col.name] ?? "", async val => {
      p.props[col.name] = val; drawAll(); await save(p.id,{props:p.props}); afterChange(); }, db, drawAll, p); };
    box.append(h("div",{class:"prop"}, h("div",{class:"k", title:col.name}, h("span",{}, typeIcon(col.type)), col.name), v));
  }
  if (p.db_schema.some(c=>isRel(c) || isCalc(c))) refreshDeps(p.db_schema).then(drawAll);
  return box;
}

function renderCellValue(el, col, val, r, schema){
  if (r && (isRel(col) || isCalc(col))) return renderComputed(el, col, r, schema||[]);
  el.innerHTML = "";
  val = val ?? "";
  switch (col.type){
    case "checkbox": el.append(h("input",{type:"checkbox", class:"cb", checked:isOn(val), tabindex:"-1", style:"pointer-events:none"})); break;
    case "select": if (val) el.append(tagEl(col, val)); break;
    case "multi_select": for (const t of String(val).split(",").map(s=>s.trim()).filter(Boolean)) el.append(tagEl(col, t)); break;
    case "date": { const d = dateEl(val); if (d) el.append(d); break; }
    case "url": if (val) el.append(h("a",{href:safeUrl(val), target:"_blank", rel:"noopener"}, val.replace(/^https?:\/\/(www\.)?/,""))); break;
    case "email": if (val) el.append(h("a",{href:"mailto:"+val}, val)); break;
    case "number": el.classList.add("num"); el.textContent = col.format ? (fmtNum(val, col.format) || val) : val; break;
    default:
      if (/\]\(/.test(val)) el.innerHTML = inline(val);
      else el.textContent = val;
  }
}

function editCell(el, col, val, commit, db, redraw, row){
  if (isCalc(col)){ toast((col.type==="formula" ? "Formeln" : "Rollups")+" werden berechnet – einstellen über die Spaltenüberschrift der Datenbank"); return; }
  if (isRel(col)) return editRelation(el, col, row, val, commit, redraw);
  if (el.querySelector("input:not(.cb),textarea")) return;
  if (col.type==="checkbox"){ commit(isOn(val)?"No":"Yes"); return; }
  if (col.type==="select" || col.type==="multi_select") return editTags(el, col, val, commit, db);
  if (col.type==="date") return editDate(el, val, commit, !!db?.tpl);
  el.innerHTML = "";
  const multi = col.type==="text" || col.type==="relation" || col.type==="files";
  const inp = multi ? h("textarea",{rows:Math.min(8, Math.max(1, String(val).split("\n").length))}) : h("input",{type:"text", inputmode: col.type==="number"?"decimal":null});
  inp.value = val;
  let done = false;
  const finish = ok => { if (done) return; done = true; const nv = inp.value.trim(); if (ok && nv!==val) commit(nv); else if (redraw) redraw(); else renderCellValue(el, col, val); };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key==="Escape"){ e.preventDefault(); finish(false); } if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); finish(true); } };
  inp.onblur = () => finish(true);
  inp.onclick = e => e.stopPropagation();
  el.append(inp); inp.focus(); inp.select?.();
}

function editDate(el, val, commit, inTemplate){
  const parts = String(val||"").split("→").map(s=>s.trim());
  const a = parseISO(parts[0]), b = parseISO(parts[1]);
  const pop = popover(el);
  const s = h("input",{type:"date", value:a?a.iso:""}), e = h("input",{type:"date", value:b?b.iso:""});
  const apply = (close) => { const v = s.value ? (e.value && e.value>=s.value ? `${s.value} → ${e.value}` : s.value) : ""; commit(v); if (close) closePop(); };
  s.onchange = () => apply(false); e.onchange = () => apply(false);
  const quick = (label, days) => h("button",{class:"item", onclick:()=>{ const d=new Date(); d.setDate(d.getDate()+days); s.value=isoOf(d); e.value=""; apply(true); }}, label);
  pop.append(h("label",{},"Datum"), s, h("label",{},"Ende (optional)"), e,
    (!a && val) ? h("div",{class:"hint", style:"padding:0 8px"}, "Bisher: "+val) : null,
    h("hr"), inTemplate ? h("button",{class:"item", onclick:()=>{ commit("@heute"); closePop(); }},"@heute – Tag des Anlegens") : null,
    quick("Heute",0), quick("Morgen",1), quick("In einer Woche",7),
    h("button",{class:"item danger", onclick:()=>{ commit(""); closePop(); }},"Leeren"));
  s.focus();
}

function colOptions(db, col){
  col.options ||= [];
  const names = new Set(col.options.map(o=>o.name));
  for (const r of db.rows||[]){ const v = r.props?.[col.name]; if (!v) continue;
    for (const t of (col.type==="multi_select" ? v.split(",") : [v])){ const n=t.trim(); if (n && !names.has(n)){ col.options.push({name:n}); names.add(n); } } }
  return col.options;
}

function editTags(el, col, val, commit, db){
  const multi = col.type==="multi_select";
  let cur = multi ? String(val||"").split(",").map(s=>s.trim()).filter(Boolean) : (val ? [val] : []);
  const pop = popover(el);
  const inp = h("input",{placeholder: "Suchen oder neue Option anlegen …"});
  const list = h("div");
  const draw = () => {
    list.innerHTML = "";
    const q = inp.value.trim().toLowerCase();
    if (multi && cur.length) list.append(h("div",{style:"padding:2px 8px 6px"}, cur.map(t=>{ const s=tagEl(col,t); s.textContent=t+" ×"; s.style.cursor="pointer"; s.title="Entfernen"; s.onclick=()=>{cur=cur.filter(x=>x!==t); apply();}; return s; })));
    const opts = colOptions(db, col).map(o=>o.name).filter(o=>!q || o.toLowerCase().includes(q));
    for (const o of opts) list.append(h("button",{class:"item", onclick:()=>toggle(o)}, tagEl(col,o), cur.includes(o)?" ✓":""));
    if (q && !opts.some(o=>o.toLowerCase()===q)) list.append(h("button",{class:"item", onclick:()=>toggle(inp.value.trim())}, "Neu anlegen: ", tagEl(col, inp.value.trim())));
    if (!multi && cur.length) list.append(h("hr"), h("button",{class:"item danger", onclick:()=>{cur=[]; apply(); closePop();}},"Leeren"));
  };
  const toggle = o => { o = o.replace(/,/g," ").trim(); if (!o) return;
    if (!col.options.some(x=>x.name===o)){ col.options.push({name:o}); if (db.id) api("PUT",`/api/page/${db.id}`,{schema:db.schema}).catch(()=>{}); }
    if (multi) cur = cur.includes(o) ? cur.filter(x=>x!==o) : [...cur, o]; else cur = [o];
    inp.value=""; apply(); if(!multi) closePop(); else inp.focus(); };
  const apply = () => { commit(cur.join(", ")); draw(); };
  inp.oninput = draw;
  inp.onkeydown = e => { if (e.key==="Enter" && inp.value.trim()){ const q=inp.value.trim().toLowerCase(); const hit=colOptions(db,col).find(o=>o.name.toLowerCase().includes(q)); toggle(hit?hit.name:inp.value.trim()); } if (e.key==="Escape") closePop(); };
  pop.append(inp, list); draw(); inp.focus();
}

function notifyDb(dbId){ for (const inst of LIVE) if (inst.p.id===dbId) inst.reload(); }
let DRAG = null;   // laufender Karten-Drag
document.addEventListener("touchmove", e => { if (DRAG) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", e => { if (DRAG) e.preventDefault(); });

async function mountDatabase(host, dbId, viewKey, opt={}){
  let p = opt.preloaded;
  if (!p){
    host.append(h("div",{class:"hint"},"Lädt …"));
    try { p = await api("GET", `/api/page/${dbId}`); }
    catch(e){ host.innerHTML=""; host.append(h("div",{class:"hint"},"⚠️ Eingebettete Datenbank nicht gefunden.")); return; }
  }
  host.innerHTML = "";
  const hasSelect = p.schema.some(c=>c.type==="select");
  // Gespeicherte Ansichten: gehören zur Datenbank (META.dbviews). Welche davon an dieser Stelle
  // gerade gezeigt wird, merkt sich jede Seite bzw. Einbettung selbst (META.views[viewKey]).
  const VIEWTYPES = {board:"Board", table:"Tabelle", timeline:"Zeitleiste", calendar:"Kalender", list:"Liste", gallery:"Galerie", year:"Fotojahr"};
  const uid = () => Math.random().toString(36).slice(2,10);
  const normView = v => { v.name ||= VIEWTYPES[v.view] || "Ansicht"; v.filters ||= []; v.calc ||= {}; v.hidden ||= []; v.dir ||= 1; v.filter ??= ""; v.sort ??= null; v.group ??= null; v.cardProps ??= null; v.dateCol ??= null; v.zoom ||= "year"; v.tgroup ??= null; v.tcollapsed ||= []; v.subOpen ||= []; v.year ??= null; v.tsize ||= "m"; v.sentences ??= false; v.textCol ??= null; return v; };
  META.dbviews ||= {};
  let views = META.dbviews[p.id];
  const oldPlace = META.views[viewKey] || {};
  if (!Array.isArray(views) || !views.length){
    // bisherige Einstellungen (eine Ansicht je Stelle) in die fünf bekannten Reiter übernehmen
    const old = {...(META.views[p.id]||{}), ...(oldPlace.active ? {} : oldPlace)};
    const base = () => ({sort:old.sort??null, dir:old.dir||1, group:old.group??null, hidden:[...(old.hidden||[])], cardProps:old.cardProps ? [...old.cardProps] : null, dateCol:old.dateCol??null, zoom:old.zoom||"year"});
    views = META.dbviews[p.id] = ["board","table","timeline","calendar","list"].map(k=>normView({id:uid(), view:k, ...base(), filter: k===old.view ? (old.filter||"") : ""}));
  }
  views.forEach(normView);
  const place = {lock: !!oldPlace.lock,
    active: (views.find(v=>v.id===oldPlace.active) || views.find(v=>v.view===(oldPlace.view || (hasSelect?"board":"table"))) || views[0]).id};
  let st = views.find(v=>v.id===place.active);
  const persist = () => { place.active = st.id; META.views[viewKey] = {active:st.id, lock:place.lock}; saveMeta("views"); saveMeta("dbviews"); };
  const switchView = v => { st = v; filterInp.value = st.filter || ""; qaGroup = null; persist(); draw(); };
  const saveSchema = () => save(p.id,{schema:p.schema});
  const tcol = () => p.schema.find(c=>c.type==="title")?.name || "Name";
  let qaGroup = null, editRowId = null;

  const body = h("div");
  const filterInp = h("input",{class:"filter", placeholder:"Suchen", value:st.filter});
  filterInp.oninput = debounce(()=>{ st.filter = filterInp.value; persist(); draw(); }, 200);
  const tabs = h("span",{class:"tabs"});
  const bar = h("div",{class:"dbbar"}, tabs, h("span",{class:"sp"}), filterInp,
    h("button",{class:"btn", title:"Filter, Sortierung und Anzeige dieser Ansicht", onclick:e=>viewMenu(e.currentTarget)},"Ansicht"),
    h("span",{class:"split"},
      h("button",{class:"btn primary", onclick:()=>quickNew()},"Neu"),
      h("button",{class:"btn primary caret", title:"Vorlagen", onclick:e=>templateMenu(e.currentTarget.parentElement)},"▾")));
  if (opt.embed) host.append(h("div",{class:"embed-h"}, h("a",{href:"#/p/"+p.id, title:"Als ganze Seite öffnen"}, (p.icon ? p.icon+" " : "")+(p.title||"Ohne Titel"))));
  host.append(bar, body);

  const inst = { p, reload: debounce(async () => {
    try { const np = await api("GET", `/api/page/${dbId}`); p.rows = np.rows; p.schema = np.schema; p.title = np.title; p.templates = np.templates || []; await refreshDeps(p.schema); draw(); } catch(e){}
  }, 300) };
  LIVE.push(inst);

  const comp = c => isRel(c) || isCalc(c);
  // Unteraufgaben: Verknüpfung der Datenbank mit sich selbst („Übergeordnet“)
  const subCol = () => p.schema.find(c=>c.type==="relation" && c.db===p.id && !c.mirror && (c.sub || /übergeordnet|parent/i.test(c.name))) || null;
  const setupSub = async () => {
    const uniq = n => { let x = n, i = 2; while (p.schema.some(c=>c.name===x)) x = n+" "+(i++); return x; };
    const par = uniq("Übergeordnet"), kids = uniq("Unteraufgaben"), prog = uniq("Fortschritt");
    p.schema.push({name:par, type:"relation", db:p.id, sub:true}, {name:kids, type:"relation", db:p.id, mirror:par},
                  {name:prog, type:"rollup", rel:kids, calc:"progress"});
    await saveSchema(); DBC[p.id] = p; draw();
    toast("Unteraufgaben eingerichtet: „⋯“ an einem Eintrag → „Unteraufgabe hinzufügen“");
  };
  const addSub = async r => {
    const sc = subCol(); if (!sc) return;
    const row = await createRow("", {[sc.name]: r.id});
    if (!st.subOpen.includes(r.id)) st.subOpen.push(r.id);
    persist();
    if (st.view==="table"){ editRowId = row.id; draw(); } else { draw(); openPeek(row.id); }
  };
  const sortedRows = () => {
    let rows = p.rows.slice().sort((a,b)=>(a.sort-b.sort) || String(a.title).localeCompare(String(b.title),"de"));
    const q = (st.filter||"").trim().toLowerCase();
    if (q) rows = rows.filter(r => (r.title+" "+Object.values(r.props).join(" ")).toLowerCase().includes(q));
    for (const f of st.filters) rows = rows.filter(r => matchFilter(r, f, p.schema));
    if (st.sort){
      const col = p.schema.find(c=>c.name===st.sort);
      if (col){
        const et = effType(col, p.schema, p.rows[0]);
        const key = r => { const v = col.type==="title" ? r.title : comp(col) ? cellRaw(r, col, p.schema) : (r.props[st.sort]||""); if (et==="number"){ const n = parseNum(v); return isNaN(n) ? -Infinity : n; } if (et==="date") return dateSortKey(v); if (et==="checkbox") return isOn(v)?1:0; return String(v).toLowerCase(); };
        const keys = new Map(rows.map(r=>[r, key(r)]));
        rows.sort((a,b)=>{ const x=keys.get(a), y=keys.get(b); return (x<y?-1:x>y?1:0)*st.dir; });
      }
    }
    return rows;
  };

  const draw = () => {
    tabs.innerHTML = "";
    for (const v of (place.lock ? [st] : views)){
      const on = v===st;
      tabs.append(h("button",{class:"tab"+(on?" on":""), title: on ? "Ansicht umbenennen, duplizieren, löschen" : "Zu dieser Ansicht wechseln",
        onclick:e=>{ if (on) tabMenu(v, e.currentTarget); else switchView(v); }}, v.name,
        v.filters.length ? h("i",{class:"fdot", title:v.filters.length+" Filter aktiv"}) : null));
    }
    if (!place.lock) tabs.append(h("button",{class:"tab add", title:"Ansicht hinzufügen", onclick:e=>addViewMenu(e.currentTarget)},"+"));
    const sl = body.querySelector(".board")?.scrollLeft, tl = body.querySelector(".tablewrap")?.scrollLeft;
    body.innerHTML = "";
    if (st.view!=="year") host.classList.remove("pyhost", "pyfs");
    body.append(({board:drawBoard, table:drawTable, timeline:drawTimeline, calendar:drawCalendar, list:drawList, gallery:drawGallery, year:drawYear})[st.view]?.() || drawTable());
    if (sl && body.querySelector(".board")) body.querySelector(".board").scrollLeft = sl;
    if (tl && body.querySelector(".tablewrap")) body.querySelector(".tablewrap").scrollLeft = tl;
    body.querySelector("textarea.qa")?.focus();
  };

  // ---------------- Ansichten verwalten ----------------
  const addViewMenu = anchor => {
    const pop = popover(anchor);
    pop.append(h("label",{},"Neue Ansicht"));
    for (const [k,lb] of Object.entries(VIEWTYPES))
      pop.append(h("button",{class:"item", onclick:()=>{ closePop(); const v = normView({id:uid(), view:k}); views.push(v); switchView(v); }}, lb));
  };
  const tabMenu = (v, anchor) => {
    const pop = popover(anchor);
    const name = h("input",{value:v.name});
    const rename = () => { const n = name.value.trim(); if (n && n!==v.name){ v.name = n; persist(); draw(); } };
    name.onkeydown = e => { if (e.key==="Enter"){ rename(); closePop(); } };
    name.onblur = rename;
    const layout = h("select",{}, Object.entries(VIEWTYPES).map(([k,lb])=>h("option",{value:k, selected:v.view===k}, lb)));
    layout.onchange = () => { v.view = layout.value; persist(); closePop(); draw(); };
    pop.append(h("label",{},"Name der Ansicht"), name, h("label",{},"Layout"), layout, h("hr"),
      h("button",{class:"item", onclick:()=>{ closePop(); viewMenu(anchor); }},"Filter, Sortierung, Anzeige …"),
      h("button",{class:"item", onclick:()=>{ closePop(); const c = normView(JSON.parse(JSON.stringify(v))); c.id = uid(); c.name = v.name+" (Kopie)"; views.splice(views.indexOf(v)+1, 0, c); switchView(c); }},"Duplizieren"),
      opt.embed ? h("button",{class:"item", onclick:()=>{ closePop(); place.lock = !place.lock; persist(); draw(); }}, place.lock ? "Hier alle Ansichten zeigen" : "Hier nur diese Ansicht zeigen") : null,
      views.length>1 ? [h("hr"), h("button",{class:"item danger", onclick:()=>{ if (!confirm(`Ansicht „${v.name}“ löschen? Die Einträge bleiben erhalten.`)) return;
        closePop(); views.splice(views.indexOf(v),1); switchView(views[0]); }},"Ansicht löschen")] : null);
    name.focus(); name.select();
  };

  // ---------------- Vorlagen ----------------
  p.templates ||= [];
  const defaultTpl = () => { const id = META.dbs[p.id]?.tpl; return p.templates.find(t=>t.id===id) || null; };
  const setDefaultTpl = id => { META.dbs[p.id] = {...(META.dbs[p.id]||{}), tpl: id || null}; saveMeta("dbs"); };
  const fromTemplate = async (tpl, title="", props={}) => {
    const row = await api("POST", `/api/from-template/${tpl.id}`, {title, props});
    p.rows.push(row);
    return row;
  };
  const createRow = async (title, props={}, useTpl=true) => {
    const tpl = useTpl ? defaultTpl() : null;
    if (tpl) return fromTemplate(tpl, title, props);
    const full = {...props, [tcol()]: title};
    const ad = autoDateCol();                      // neue Einträge bekommen das heutige Datum
    if (ad && !full[ad.name]) full[ad.name] = isoOf(new Date());
    const r = await api("POST","/api/page",{kind:"row", parent_id:p.id, title, props:full});
    const maxSort = Math.max(0, ...p.rows.map(x=>x.sort||0)) + 1;
    const row = {id:r.id, title, props:full, icon:"", cover:"", thumb:"", sort:maxSort, has_content:false};
    p.rows.push(row);
    return row;
  };
  const quickNew = async () => {
    if (st.view==="board"){ const gc = groupCol(); const first = gc && visibleGroups(gc)[0]; qaGroup = first ? first.key : ""; draw(); return; }
    if (st.view!=="table"){ const row = await createRow(""); draw(); return openPeek(row.id); }
    const row = await createRow(""); editRowId = row.id; draw();
  };
  const newFrom = async tpl => {   // Eintrag aus dem Vorlagen-Menü anlegen und rechts öffnen
    closePop();
    try { const row = tpl ? await fromTemplate(tpl) : await createRow("", {}, false); draw(); openPeek(row.id); }
    catch(e){ toast(e.message); }
  };
  const newTemplate = async () => {
    closePop();
    const r = await api("POST","/api/page",{kind:"template", parent_id:p.id, title:""});
    p.templates.push({id:r.id, title:"", icon:""});
    openPeek(r.id);
  };
  const tplItemMenu = (t, anchor) => {
    const pop = popover(anchor);
    const isDef = defaultTpl()?.id === t.id;
    pop.append(
      h("button",{class:"item", onclick:()=>{ closePop(); openPeek(t.id); }},"Bearbeiten"),
      h("button",{class:"item", onclick:()=>{ closePop(); setDefaultTpl(isDef ? null : t.id); toast(isDef ? "Keine Standardvorlage mehr" : "„"+(t.title||"Ohne Titel")+"“ ist jetzt Standard"); }}, isDef ? "Nicht mehr Standard" : "Als Standard festlegen"),
      h("button",{class:"item", onclick:async()=>{ closePop(); const r = await api("POST",`/api/duplicate/${t.id}`); inst.reload(); openPeek(r.id); }},"Duplizieren"),
      h("hr"),
      h("button",{class:"item danger", onclick:async()=>{ closePop(); await api("DELETE",`/api/page/${t.id}`); if (isDef) setDefaultTpl(null);
        p.templates = p.templates.filter(x=>x.id!==t.id);
        toast("Vorlage gelöscht","Rückgängig", async()=>{ await api("POST",`/api/restore/${t.id}`); inst.reload(); }); }},"Löschen"));
  };
  const templateMenu = anchor => {
    const pop = popover(anchor);
    pop.classList.add("tplpop");
    const def = defaultTpl();
    pop.append(h("label",{},"Vorlagen für „"+(p.title||"Ohne Titel")+"“"));
    for (const t of p.templates){
      pop.append(h("div",{class:"tplrow"},
        h("button",{class:"item", onclick:()=>newFrom(t)},
          h("span",{class:"tt"}, (t.icon ? t.icon+" " : "")+(t.title || "Ohne Titel")+(META.recur?.[t.id] ? " 🔁" : "")),
          def?.id===t.id ? h("span",{class:"tdef"},"Standard") : null),
        h("button",{class:"tmore", title:"Vorlage bearbeiten …", onclick:e=>{ e.stopPropagation(); tplItemMenu(t, e.currentTarget); }},"⋯")));
    }
    pop.append(
      h("div",{class:"tplrow"}, h("button",{class:"item", onclick:()=>newFrom(null)}, h("span",{class:"tt"},"Leerer Eintrag"),
        !def ? h("span",{class:"tdef"},"Standard") : null)),
      h("hr"),
      h("button",{class:"item", onclick:newTemplate},"+ Neue Vorlage"),
      def ? h("button",{class:"item", onclick:()=>{ closePop(); setDefaultTpl(null); toast("„Neu“ legt wieder leere Einträge an"); }},"Leeren Eintrag als Standard") : null);
  };

  // ---------------- Datum: gemeinsame Helfer für Zeitleiste und Kalender ----------------
  const DAY = 864e5;
  const dateCols = () => p.schema.filter(c=>c.type==="date");
  const dateCol = () => dateCols().find(c=>c.name===st.dateCol) || dateCols().find(c=>/^(date|datum|fällig|due)/i.test(c.name)) || dateCols()[0];
  const autoDateCol = () => { const v = META.dbs[p.id]?.autoDate; if (v===false) return null; return dateCols().find(c=>c.name===v) || dateCol() || null; };
  const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
  const diffDays = (a, b) => Math.round((midnight(b)-midnight(a))/DAY);
  const spanOf = (r, col) => { const parts = String(r.props[col.name]||"").split("→"), a = parseISO(parts[0]), b = parseISO(parts[1]); if (!a) return null; const s = midnight(a.d), e = b ? midnight(b.d) : s; return {s, e: e<s ? s : e}; };
  const spanValue = (s, e) => isoOf(s) + (e > s ? " → "+isoOf(e) : "");
  const rowColor = r => { const gc = groupCol(); const v = gc && gc.type==="select" && r.props[gc.name]; return v ? optColor(gc, v) : "var(--t-gray)"; };
  const noDateCol = () => h("div",{class:"hint", style:"padding:24px 0"},"Diese Ansicht braucht eine Eigenschaft vom Typ „Datum“. ",
    h("button",{class:"btn", style:"text-decoration:underline", onclick:async()=>{ p.schema.push({name:"Datum", type:"date"}); await saveSchema(); draw(); }},"Datum-Eigenschaft anlegen"));
  let anchor = midnight(new Date());      // welcher Zeitraum gerade gezeigt wird
  const navBar = (label, step, extra) => h("div",{class:"tl-head"},
    h("div",{class:"tl-label"}, label), h("span",{class:"sp"}), extra,
    h("span",{class:"seg"},
      h("button",{title:"Zurück", onclick:()=>{ step(-1); draw(); }},"‹"),
      h("button",{onclick:()=>{ anchor = midnight(new Date()); draw(); }},"Heute"),
      h("button",{title:"Weiter", onclick:()=>{ step(1); draw(); }},"›")));
  const undated = (rows, col) => { const list = rows.filter(r=>!spanOf(r, col)); if (!list.length) return null;
    return h("details",{class:"tl-undated"}, h("summary",{}, `Ohne Datum · ${list.length}`),
      h("div",{}, list.map(r=>h("div",{class:"lv-row", onclick:()=>openPeek(r.id)}, h("span",{class:"lv-dot", style:`background:${rowColor(r)}`}), h("span",{class:"lv-t"}, r.title||"Ohne Titel"))))); };

  // ---------------- Zeitleiste ----------------
  const drawTimeline = () => {
    const col = dateCol(); if (!col) return noDateCol();
    const zoom = ["month","quarter","year"].includes(st.zoom) ? st.zoom : "year";
    const y = anchor.getFullYear(), m = anchor.getMonth();
    let rs, re, label;
    if (zoom==="year"){ rs = new Date(y,0,1); re = new Date(y,11,31); label = String(y); }
    else if (zoom==="quarter"){ const q = Math.floor(m/3); rs = new Date(y,q*3,1); re = new Date(y,q*3+3,0); label = `${q+1}. Quartal ${y}`; }
    else { rs = new Date(y,m,1); re = new Date(y,m+1,0); label = rs.toLocaleDateString("de-DE",{month:"long", year:"numeric"}); }
    const N = diffDays(rs, re)+1, pct = n => (n/N*100)+"%";
    const step = d => { anchor = zoom==="year" ? new Date(y+d,0,1) : zoom==="quarter" ? new Date(y, m+3*d, 1) : new Date(y, m+d, 1); };
    const seg = h("span",{class:"seg"}, [["month","Monat"],["quarter","Quartal"],["year","Jahr"]].map(([k,lb])=>h("button",{class:zoom===k?"on":"", onclick:()=>{ st.zoom=k; persist(); draw(); }}, lb)));
    const rows = sortedRows(), items = rows.map(r=>({r, sp:spanOf(r, col)})).filter(x=>x.sp && x.sp.e >= rs && x.sp.s <= re);
    if (!st.sort) items.sort((a,b)=>a.sp.s-b.sp.s || a.sp.e-b.sp.e);
    // Achse
    const axis = h("div",{class:"tl-axis"}), bg = h("div",{class:"tl-bg"});
    for (let d = new Date(rs); d <= re; d = new Date(d.getFullYear(), d.getMonth()+1, 1)){
      const ms = d < rs ? rs : d, me = new Date(d.getFullYear(), d.getMonth()+1, 0) > re ? re : new Date(d.getFullYear(), d.getMonth()+1, 0);
      axis.append(h("div",{class:"tl-m", style:`left:${pct(diffDays(rs,ms))};width:${pct(diffDays(ms,me)+1)}`}, d.toLocaleDateString("de-DE",{month: zoom==="year" ? "short" : "long"})));
      bg.append(h("i",{style:`left:${pct(diffDays(rs,ms))}`}));
    }
    if (zoom!=="year") for (let k=0; k<N; k++){ const d = addDays(rs,k), wd = d.getDay();
      if (zoom==="month" || wd===1) axis.append(h("div",{class:"tl-d"+(wd===0||wd===6?" we":""), style:`left:${pct(k)};width:${pct(zoom==="month"?1:7)}`}, zoom==="month" ? d.getDate() : d.getDate()+"."));
      if (zoom==="month" && (wd===0||wd===6)) bg.append(h("b",{style:`left:${pct(k)};width:${pct(1)}`}));
      if (zoom==="quarter" && wd===1) bg.append(h("i",{class:"wk", style:`left:${pct(k)}`})); }
    const today = midnight(new Date());
    if (today >= rs && today <= re){ bg.append(h("u",{style:`left:${pct(diffDays(rs,today)+.5)}`})); axis.append(h("div",{class:"tl-today", style:`left:${pct(diffDays(rs,today)+.5)}`})); }
    const bodyEl = h("div",{class:"tl-body"}, h("div",{class:"tl-bgwrap"}, bg));
    for (const {r, sp} of items){
      const s = sp.s < rs ? rs : sp.s, e = sp.e > re ? re : sp.e, len = diffDays(s,e)+1;
      const bar = h("div",{class:"tl-bar"+(sp.s<rs?" cutl":"")+(sp.e>re?" cutr":""), style:`left:${pct(diffDays(rs,s))};width:${pct(len)};background:${rowColor(r)}`, title:`${r.title||"Ohne Titel"} · ${dateEl(r.props[col.name])?.textContent||""}`},
        h("span",{}, r.title||"Ohne Titel"), h("i",{class:"rz"}));
      const track = h("div",{class:"tl-track"}, bar);
      // kurze Balken: Titel daneben statt abgeschnitten darin
      if (zoom!=="year" && len/N < 0.12){ bar.classList.add("short"); track.append(h("span",{class:"tl-lab", style:`left:calc(${pct(diffDays(rs,s)+len)} + 7px)`}, r.title||"Ohne Titel")); }
      bar.addEventListener("pointerdown", ev => {
        if (ev.button) return; ev.preventDefault();
        const pxDay = track.getBoundingClientRect().width / N, sx = ev.clientX, resize = ev.target.classList.contains("rz"), w0 = bar.getBoundingClientRect().width;
        let dd = 0, moved = false; bar.setPointerCapture(ev.pointerId);
        const mv = e2 => { const dx = e2.clientX-sx; if (Math.abs(dx) > 4) moved = true; dd = Math.round(dx/pxDay);
          if (resize) bar.style.width = Math.max(pxDay, w0+dd*pxDay)+"px"; else bar.style.transform = `translateX(${dd*pxDay}px)`; };
        const up = async () => { bar.removeEventListener("pointermove", mv); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up);
          if (!moved) return openPeek(r.id);
          if (dd){ const ns = resize ? sp.s : addDays(sp.s, dd); let ne = addDays(sp.e, dd); if (ne < ns) ne = ns;
            r.props[col.name] = spanValue(ns, ne); draw(); await save(r.id,{props:r.props}); } else draw(); };
        bar.addEventListener("pointermove", mv); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up);
      });
      const row = h("div",{class:"tl-row"}, h("div",{class:"tl-name", title:r.title, onclick:()=>openPeek(r.id)}, h("span",{class:"lv-dot", style:`background:${rowColor(r)}`}), h("span",{class:"lv-t"}, r.title||"Ohne Titel")), track);
      row.oncontextmenu = ev => { ev.preventDefault(); rowMenu(r, ev); };
      bodyEl.append(row);
    }
    if (!items.length) bodyEl.append(h("div",{class:"hint", style:"padding:18px 0 18px 232px"},"Keine Einträge in diesem Zeitraum."));
    const others = rows.filter(r=>{ const sp = spanOf(r,col); return sp && (sp.e < rs || sp.s > re); }).length;
    return h("div",{class:"tl"}, navBar(label, step, seg),
      h("div",{class:"tl-scroll"}, h("div",{class:"tl-grid z-"+zoom}, h("div",{class:"tl-axisrow"}, h("div",{class:"tl-name"}), axis), bodyEl)),
      h("div",{class:"hint", style:"padding:10px 0 0"}, `${items.length} Einträge im Zeitraum` + (others ? ` · ${others} außerhalb` : "") + " · Balken ziehen verschiebt, rechter Rand ändert das Ende"),
      undated(rows, col));
  };

  // ---------------- Kalender ----------------
  const drawCalendar = () => {
    const col = dateCol(); if (!col) return noDateCol();
    const y = anchor.getFullYear(), m = anchor.getMonth(), first = new Date(y,m,1);
    const start = addDays(first, -((first.getDay()+6)%7)), today = midnight(new Date());
    const rows = sortedRows(), spans = rows.map(r=>({r, sp:spanOf(r,col)})).filter(x=>x.sp);
    const grid = h("div",{class:"cal"});
    for (const wd of ["Mo","Di","Mi","Do","Fr","Sa","So"]) grid.append(h("div",{class:"cal-wd"}, wd));
    const weeks = (diffDays(start, new Date(y,m+1,0)) >= 35) ? 42 : 35;
    for (let k=0; k<weeks; k++){
      const d = addDays(start,k), iso = isoOf(d);
      const cell = h("div",{class:"cal-d"+(d.getMonth()!==m?" out":"")+(+d===+today?" today":"")+(d.getDay()===0||d.getDay()===6?" we":"")},
        h("div",{class:"cal-n"}, h("span",{}, d.getDate()), h("button",{title:"Eintrag an diesem Tag", onclick:ev=>{ ev.stopPropagation(); addAt(cell, iso); }},"+")));
      const list = spans.filter(x=>x.sp.s <= d && x.sp.e >= d);
      for (const {r, sp} of list.slice(0,4)){
        const en = h("div",{class:"cal-e", draggable:"true", title:r.title, onclick:ev=>{ ev.stopPropagation(); openPeek(r.id); }}, h("span",{class:"lv-dot", style:`background:${rowColor(r)}`}), h("span",{class:"lv-t"}, r.title||"Ohne Titel"));
        en.ondragstart = ev => { ev.dataTransfer.setData("text/nl-cal", JSON.stringify({id:r.id, from:iso})); };
        en.oncontextmenu = ev => { ev.preventDefault(); rowMenu(r, ev); };
        cell.append(en);
      }
      if (list.length > 4) cell.append(h("div",{class:"cal-more"}, `+ ${list.length-4} weitere`));
      cell.ondragover = ev => { ev.preventDefault(); cell.classList.add("over"); };
      cell.ondragleave = () => cell.classList.remove("over");
      cell.ondrop = async ev => { cell.classList.remove("over"); let data; try { data = JSON.parse(ev.dataTransfer.getData("text/nl-cal")); } catch { return; }
        const r = p.rows.find(x=>x.id===data.id), sp = r && spanOf(r,col); if (!sp) return;
        const dd = diffDays(parseISO(data.from).d, d); if (!dd) return;
        r.props[col.name] = spanValue(addDays(sp.s,dd), addDays(sp.e,dd)); draw(); await save(r.id,{props:r.props}); };
      grid.append(cell);
    }
    const addAt = (cell, iso) => {
      if (cell.querySelector("input")) return;
      const inp = h("input",{class:"cal-in", placeholder:"Titel, Enter"}); cell.append(inp); inp.focus();
      let done = false;
      const fin = async ok => { if (done) return; done = true; const t = inp.value.trim(); if (ok && t){ await createRow(t, {[col.name]: iso}); } draw(); };
      inp.onkeydown = ev => { if (ev.key==="Enter") fin(true); if (ev.key==="Escape") fin(false); };
      inp.onblur = () => fin(true);
    };
    return h("div",{class:"tl"}, navBar(first.toLocaleDateString("de-DE",{month:"long", year:"numeric"}), d => { anchor = new Date(y, m+d, 1); }),
      grid, undated(rows, col));
  };

  // ---------------- Liste ----------------
  const drawList = () => {
    const rows = sortedRows(), gc = groupCol();
    const shown = st.cardProps || p.schema.filter(c=>["select","multi_select","date"].includes(c.type)).map(c=>c.name);
    const box = h("div",{class:"lv"});
    for (const r of rows){
      const meta = h("span",{class:"lv-m"});
      for (const name of shown){ const x = p.schema.find(c=>c.name===name), v = r.props[name]; if (!x || (!v && !comp(x)) || x.type==="title" || x.type==="checkbox") continue; const sp = h("span",{}); renderCellValue(sp, x, v, r, p.schema); if (sp.childNodes.length) meta.append(sp); }
      const row = h("div",{class:"lv-row", onclick:()=>openPeek(r.id)}, h("span",{class:"lv-dot", style:`background:${rowColor(r)}`}), h("span",{class:"lv-t"}, (r.icon?r.icon+" ":"")+(r.title||"Ohne Titel")), meta);
      row.oncontextmenu = ev => { ev.preventDefault(); rowMenu(r, ev); };
      box.append(row);
    }
    if (!rows.length) box.append(h("div",{class:"hint", style:"padding:18px 0"},"Noch keine Einträge."));
    return h("div",{}, box, h("div",{class:"newrow", onclick:quickNew},"＋ Neu"));
  };
  // ---------------- Galerie ----------------
  const drawGallery = () => {
    const rows = sortedRows();
    const shown = st.cardProps || p.schema.filter(c=>["select","multi_select","date"].includes(c.type)).map(c=>c.name);
    const g = h("div",{class:"gallery g-"+(st.gsize||"m")});
    for (const r of rows){
      const img = coverCss(r.cover || r.thumb);
      const meta = h("div",{class:"gm"});
      for (const name of shown){ const x = p.schema.find(c=>c.name===name), v = r.props[name]; if (!x || (!v && !comp(x)) || x.type==="title" || x.type==="checkbox") continue; const sp = h("span",{}); renderCellValue(sp, x, v, r, p.schema); if (sp.childNodes.length) meta.append(sp); }
      const card = h("div",{class:"gcard", onclick:()=>openPeek(r.id)},
        h("div",{class:"gcover"+(img?"":" noimg"), style:img}, img ? null : h("span",{}, r.icon || "")),
        h("div",{class:"gbody"}, h("div",{class:"gt"}, (img && r.icon ? r.icon+" " : "")+(r.title||"Ohne Titel")), meta.childNodes.length ? meta : null));
      card.oncontextmenu = ev => { ev.preventDefault(); rowMenu(r, ev); };
      g.append(card);
    }
    g.append(h("div",{class:"gcard gnew", onclick:quickNew},"＋ Neu"));
    return h("div",{}, g, h("div",{class:"hint", style:"padding:10px 0 0"}, rows.length===p.rows.length ? `${rows.length} Einträge` : `${rows.length} von ${p.rows.length} Einträgen`));
  };
  const removeRow = async r => {
    await api("DELETE",`/api/page/${r.id}`); p.rows = p.rows.filter(x=>x.id!==r.id); draw();
    toast("„"+(r.title||"Ohne Titel")+"“ gelöscht", "Rückgängig", async()=>{ await api("POST",`/api/restore/${r.id}`); inst.reload(); });
  };
  const rowMenu = (r, e) => {
    const pop = popover(null, e.clientX, e.clientY);
    pop.append(
      h("button",{class:"item", onclick:()=>{closePop(); openPeek(r.id);}},"◧ In Seitenleiste öffnen"),
      h("button",{class:"item", onclick:()=>{closePop(); go(r.id);}},"⤢ Als ganze Seite öffnen"),
      h("button",{class:"item", onclick:async()=>{ closePop(); await api("POST",`/api/duplicate/${r.id}`); inst.reload(); }},"⧉ Duplizieren"),
      subCol() ? h("button",{class:"item", onclick:()=>{ closePop(); addSub(r); }},"↳ Unteraufgabe hinzufügen") : null,
      h("hr"),
      h("button",{class:"item danger", onclick:()=>{ closePop(); removeRow(r); }},"🗑 Löschen"));
  };

  // ---------------- Fotojahr: 365 Kacheln, ein Bild und ein Satz pro Tag ----------------
  const textCol = () => p.schema.find(c=>c.name===st.textCol && (c.type==="text" || c.type==="title"))
    || p.schema.find(c=>c.type==="text" && /satz|notiz|text|tagebuch|eintrag|note|caption/i.test(c.name))
    || p.schema.find(c=>c.type==="text") || null;
  const imgOf = r => r ? (r.cover && !/^gradient:/.test(r.cover) ? r.cover : (r.thumb || "")) : "";
  const thumbOf = r => (r?.props?._vorschau && r.cover && !/^gradient:/.test(r.cover)) ? r.props._vorschau : imgOf(r);
  const sentenceOf = (r, tc) => !r || !tc ? "" : String(tc.type==="title" ? (r.title||"") : (r.props?.[tc.name]||"")).trim();
  const dayMap = () => {             // Tag -> Eintrag (bei mehreren gewinnt der mit Bild)
    const col = dateCol(), m = new Map(); if (!col) return m;
    for (const r of p.rows){ const a = parseISO(String(r.props[col.name]||"").split("→")[0]); if (!a) continue;
      const k = isoOf(a.d), prev = m.get(k); if (!prev || (!imgOf(prev) && imgOf(r))) m.set(k, r); }
    return m;
  };
  const photoDays = y => [...dayMap()].filter(([k, r])=>k.startsWith(String(y)) && imgOf(r)).map(([k])=>k).sort();
  const dayTitle = iso => parseISO(iso).d.toLocaleDateString("de-DE",{weekday:"short", day:"numeric", month:"long", year:"numeric"});
  const rowFor = async (iso, extra={}) => {
    const col = dateCol(); let r = dayMap().get(iso);
    if (!r) r = await createRow(dayTitle(iso), {[col.name]: iso, ...extra}, false);
    return r;
  };
  const setDayImage = async (iso, file) => {
    if (!dateCol()) return null;
    let big, small;
    try { big = await shrinkImage(file, 2000); small = await shrinkImage(file, 480); }
    catch(e){ toast("Dieses Bildformat kann der Browser nicht lesen (z. B. HEIC vom iPhone). Bitte als JPG speichern."); return null; }
    try {
      const r = await rowFor(iso);
      const url = await uploadFile(r.id, new File([big], `foto-${iso}.jpg`, {type:"image/jpeg"}));
      const turl = await uploadFile(r.id, new File([small], `foto-${iso}-klein.jpg`, {type:"image/jpeg"}));
      r.cover = url; r.props._vorschau = turl;
      await save(r.id, {cover:url, props:r.props});
      return r;
    } catch(e){ toast(e.message); return null; }
  };
  const removeDayImage = async iso => {
    const r = dayMap().get(iso); if (!r) return;
    r.cover = ""; r.thumb = ""; delete r.props._vorschau;
    await save(r.id, {cover:"", props:r.props});
  };
  const setDaySentence = async (iso, text) => {
    const tc = textCol(); if (!tc || !dateCol()) return;
    const r = dayMap().get(iso);
    if (!r){ if (!text) return; const nr = await rowFor(iso, tc.type==="title" ? {} : {[tc.name]: text}); if (tc.type==="title"){ nr.title = text; nr.props[tc.name] = text; await save(nr.id, {title:text}); } return; }
    if (tc.type==="title"){ r.title = text; r.props[tc.name] = text; await save(r.id, {title:text}); }
    else { r.props[tc.name] = text; await save(r.id, {props:r.props}); }
  };
  // Echtes Vollbild des Browsers; wo das nicht geht (eingebettete Fenster), füllt die Ansicht das ganze Fenster
  const fsKey = e => { if (e.key==="Escape" && host.classList.contains("pyfs") && !dayBox){ e.preventDefault(); toggleFs(); } };
  const toggleFs = () => {
    if (document.fullscreenElement || host.classList.contains("pyfs")){
      if (document.fullscreenElement) document.exitFullscreen?.();
      host.classList.remove("pyfs"); document.removeEventListener("keydown", fsKey, true); return;
    }
    host.classList.add("pyhost");
    let ok = false;
    const fallback = () => { if (ok || document.fullscreenElement) return; ok = true; host.classList.add("pyfs"); document.addEventListener("keydown", fsKey, true); };
    try { const pr = host.requestFullscreen?.(); if (pr) pr.then(()=>{ ok = true; host.classList.remove("pyfs"); }).catch(fallback); else fallback(); }
    catch { fallback(); }
    setTimeout(fallback, 400);
  };
  const put = (el, ...kids) => el.append(...kids.flat().filter(x=>x!=null && x!==false));

  // Tagesansicht (liegt im Datenbank-Container, damit sie auch im Vollbild sichtbar ist)
  let dayBox = null, slide = null, daySaver = null;
  const stopSlide = () => { if (slide){ clearInterval(slide); slide = null; } };
  const closeDay = () => {

  // Kollage: alle Bilder eines Jahres als ein PNG, ohne Beschriftung
  const exportCollage = y => {
    const ds = photoDays(y);

    const opt = {mode:"packed", tile:"240", gap:"4", bg:"#ffffff", ...(st.collage||{})};

  // ---------------- Tabelle ----------------

  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

        if (!toks.length) add("", "", r, Infinity);

        tb.append(h("tr",{class:"grp"}, h("td",{colspan:String(p.schema.length+1)},
          h("button",{class:"grp-t", title: closed ? "Aufklappen" : "Zuklappen", onclick:()=>{
            st.tcollapsed = closed ? st.tcollapsed.filter(k=>k!==g.key) : [...st.tcollapsed, g.key]; persist(); draw(); }},
            h("span",{class:"grp-a"}, closed ? "▶" : "▼"), label, h("span",{class:"grp-n"}, String(g.rows.length))),
          gv!==undefined ? h("button",{class:"grp-add", title:"Neuer Eintrag in dieser Gruppe", onclick:async()=>{
            const row = await createRow("", {[gcol.name]: gv}); editRowId = row.id;
            if (closed) st.tcollapsed = st.tcollapsed.filter(k=>k!==g.key);
            persist(); draw(); }},"＋") : null)));
        if (closed) continue;
        for (const r of g.rows) tb.append(mkRow(r));
        if (hasCalc) tb.append(calcRow(g.rows, "grpcalc"));
      }
    } else if (subCol()){
      const sc = subCol(), inView = new Map(rows.map(r=>[r.id, r])), kids = new Map(), top = [];
      const parentOf = r => relIds(r.props[sc.name]).find(id=>id!==r.id && inView.has(id));
      for (const r of rows){
        // Ringverweise abfangen: wer über seine Eltern wieder bei sich landet, steht oben
        let pid = parentOf(r), cyc = false; const seen = new Set([r.id]);
        while (pid){ if (seen.has(pid)){ cyc = true; break; } seen.add(pid); pid = parentOf(inView.get(pid)); }
        const pr = !cyc && parentOf(r);
        if (pr){ if (!kids.has(pr)) kids.set(pr, []); kids.get(pr).push(r); } else top.push(r);
      }
      const walk = (r, depth) => {
        const ks = kids.get(r.id) || [], isOpen = st.subOpen.includes(r.id);
        tb.append(mkRow(r, {depth, n:ks.length, open:isOpen, toggle:()=>{
          st.subOpen = isOpen ? st.subOpen.filter(x=>x!==r.id) : [...st.subOpen, r.id]; persist(); draw(); }}));
        if (isOpen) for (const k of ks) walk(k, depth+1);
      };
      for (const r of top) walk(r, 0);
    } else for (const r of rows) tb.append(mkRow(r));
    t.append(tb);
    // Fußzeile mit Berechnungen (Summe, Anzahl, % angehakt …) über die gerade sichtbaren Einträge
    const fr = h("tr");
    for (const col of p.schema){
      const key = st.calc[col.name] || "", cl = calcsFor(col, p.schema, p.rows[0]), lb = (cl.find(c=>c[0]===key)||[])[1];
      fr.append(h("td",{class:"calc"+(key?" on":"")+(col.type==="checkbox"?" narrow":""), title:"Berechnung wählen", onclick:e=>{
        const pop = popover(e.currentTarget);
        pop.append(h("label",{},"Berechnung für „"+col.name+"“"));
        for (const [k,l] of cl) pop.append(h("button",{class:"item", onclick:()=>{ closePop(); if (k) st.calc[col.name] = k; else delete st.calc[col.name]; persist(); draw(); }}, l, k===key ? " ✓" : ""));
      }}, key ? [h("span",{class:"cl"}, lb), " ", h("span",{class:"cv"}, calcValue(rows, col, key, p.schema))] : h("span",{class:"cl"},"Berechnen")));
    }
    fr.append(h("td"));
    t.append(h("tfoot",{}, fr));
    tw.append(t);
    return h("div",{}, tw, h("div",{class:"newrow", onclick:quickNew},"＋ Neu"),
      h("div",{class:"hint", style:"padding:2px 8px"}, rows.length===p.rows.length ? `${rows.length} Einträge` : `${rows.length} von ${p.rows.length} Einträgen`));
  };

  // ---------------- Board ----------------
  const groupable = () => p.schema.filter(c=>c.type==="select" || c.type==="multi_select" || c.type==="checkbox");
  const groupCol = () => { const g = groupable(); if (!g.length) return null; return g.find(c=>c.name===st.group) || g.find(c=>/status|phase|stage/i.test(c.name)) || g.find(c=>c.type==="select") || g[0]; };
  const allGroups = col => col.type==="checkbox" ? [{key:"Yes", label:"✓ Ja"},{key:"No", label:"Nein"}]
      : [{key:"", label:"Ohne "+col.name}, ...colOptions(p, col).map(o=>({key:o.name, label:o.name}))];
  const visibleGroups = col => allGroups(col).filter(g=>!st.hidden.includes(g.key));
  const inGroup = (r, col, g) => { const v=(r.props[col.name]||"").trim();
    if (col.type==="checkbox") return (isOn(v)?"Yes":"No")===g;
    if (col.type==="multi_select") return g==="" ? !v : v.split(",").map(s=>s.trim()).includes(g);
    return v===g; };
  const defaultCardProps = col => p.schema.filter(c=>c.name!==col.name && (["select","multi_select","date"].includes(c.type) || (c.type==="rollup" && c.calc==="progress"))).map(c=>c.name);

  const drawBoard = () => {
    const col = groupCol();
    if (!col) return h("div",{class:"hint", style:"padding:20px"},"Für das Board wird eine Spalte vom Typ „Auswahl“ benötigt (z. B. Status). ",
      h("button",{class:"btn", style:"text-decoration:underline", onclick:async()=>{ p.schema.push({name:"Status", type:"select", options:[{name:"Offen",color:"gray"},{name:"In Arbeit",color:"blue"},{name:"Erledigt",color:"green"}]}); await saveSchema(); draw(); }},"Status-Spalte anlegen"));
    const rows = sortedRows();
    const shown = st.cardProps || defaultCardProps(col);
    const board = h("div",{class:"board"});
    const hiddenBox = h("div",{class:"hiddencols"});
    for (const g of allGroups(col)){
      const items = rows.filter(r=>inGroup(r, col, g.key));
      if (g.key==="" && !items.length && qaGroup!=="") continue;
      if (st.hidden.includes(g.key)){
        hiddenBox.append(h("div",{class:"hc", title:"Einblenden", onclick:()=>{ st.hidden = st.hidden.filter(x=>x!==g.key); persist(); draw(); }}, g.key ? tagEl(col,g.key) : g.label, h("span",{}, items.length)));
        continue;
      }
      const c = h("div",{class:"col", "data-g":g.key});
      c.append(h("h4",{}, g.key && col.type!=="checkbox" ? h("span",{class:"gh tag"}, h("i",{style:`background:${optColor(col,g.key)}`}), g.key) : h("span",{class:"gh", style:"color:var(--muted)"}, g.label), h("span",{class:"n"}, items.length), h("span",{class:"sp"}),
        h("button",{title:"Spalte bearbeiten", onclick:e=>groupMenu(col, g, e.currentTarget)},"⋯"),
        h("button",{title:"Karte hinzufügen", onclick:()=>{ qaGroup=g.key; draw(); }},"＋")));
      const cards = h("div",{class:"cards"});
      for (const r of items) cards.append(cardEl(r, col, shown));
      c.append(cards);
      if (qaGroup===g.key){
        const ta = h("textarea",{class:"qa", rows:2, placeholder:"Titel eingeben · Enter legt an · Esc schließt"});
        const create = async keep => { const t = ta.value.trim(); if (!t){ if(!keep){ qaGroup=null; draw(); } return; } ta.value="";
          const props = {}; if (g.key) props[col.name] = g.key; else if (col.type==="checkbox") props[col.name]="No";
          let row; try { row = await createRow(t, props); } catch(e){ toast(e.message); ta.value = t; return; }
          if (keep && ta.isConnected){ cards.append(cardEl(row, col, shown)); const n = $("h4 .n", c); n.textContent = +n.textContent+1; ta.focus(); ta.scrollIntoView({block:"nearest"}); }
          else { qaGroup=null; draw(); } };
        ta.onkeydown = e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); create(true); } if (e.key==="Escape"){ e.preventDefault(); qaGroup=null; draw(); } };
        ta.onblur = () => { if (qaGroup===g.key) create(false); };
        c.append(ta);
      } else c.append(h("div",{class:"newrow", onclick:()=>{ qaGroup=g.key; draw(); }},"＋ Neu"));
      board.append(c);
    }
    if (col.type!=="checkbox") board.append(h("div",{class:"addgroup", onclick:async()=>{ const n=(prompt("Name der neuen Spalte:")||"").replace(/,/g," ").trim(); if(!n) return; if(!col.options.some(o=>o.name===n)){ col.options.push({name:n}); await saveSchema(); } draw(); }},"＋ Spalte"));
    if (hiddenBox.childNodes.length){ hiddenBox.prepend(h("div",{class:"hint", style:"margin:0 6px"},"Ausgeblendet")); board.append(hiddenBox); }
    return board;
  };

  const cardEl = (r, col, shown) => {
    const card = h("div",{class:"cardx", "data-id":r.id});
    card.append(h("div",{class:"t"}, (r.icon?r.icon+" ":"")+(r.title||"Ohne Titel")));
    for (const name of shown){
      const x = p.schema.find(c=>c.name===name); if (!x || x.type==="title") continue;
      const v = r.props[name];
      if (x.type==="checkbox"){
        const cb = h("input",{type:"checkbox", class:"cb", checked:isOn(v), style:"margin:0"});
        cb.onclick = async e => { e.stopPropagation(); r.props[name] = cb.checked?"Yes":"No"; await save(r.id,{props:r.props}); };
        card.append(h("label",{class:"m", onclick:e=>e.stopPropagation()}, cb, h("span",{}, name)));
        continue;
      }
      if (!v && !comp(x)) continue;
      const m = h("div",{class:"m"}); renderCellValue(m, x, v, r, p.schema);
      if (!m.childNodes.length) continue;
      if (x.type==="date") {}
      else if (!["select","multi_select"].includes(x.type)) m.prepend(h("span",{class:"k"}, name+":"));
      card.append(m);
    }
    if (r.has_content) card.append(h("div",{class:"m", title:"Hat Inhalt"},"≡"));
    card.onclick = () => { if (card._dragged){ card._dragged=false; return; } openPeek(r.id); };
    card.oncontextmenu = e => { e.preventDefault(); if (!DRAG) rowMenu(r, e); };
    enableDrag(card, r, col);
    return card;
  };

  // Drag & Drop mit Maus und Touch (langes Drücken)
  const enableDrag = (card, r, col) => {
    card.addEventListener("pointerdown", e => {
      if (e.button!==0 || e.target.closest("input,button,a,textarea,label")) return;
      const touch = e.pointerType!=="mouse", pid = e.pointerId, sx = e.clientX, sy = e.clientY;
      let active = false, ghost, ph, timer, scrollTimer, lx = sx, ly = sy, ox, oy;
      const board = card.closest(".board");
      const start = () => {
        active = true; DRAG = card; closePop();
        const b = card.getBoundingClientRect(); ox = sx-b.left; oy = sy-b.top;
        ghost = card.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width = b.width+"px";
        document.body.append(ghost);
        ph = h("div",{class:"ph", style:`height:${b.height}px`});
        card.classList.add("dragging"); card.after(ph);
        document.body.style.userSelect = "none";
        scrollTimer = setInterval(()=>{ const br = board.getBoundingClientRect();
          if (lx > br.right-50) board.scrollLeft += 14; else if (lx < br.left+50) board.scrollLeft -= 14;
          const m = card.closest(".peek-body") || $("#main"), mr = m.getBoundingClientRect();
          if (ly > mr.bottom-50) m.scrollTop += 12; else if (ly < mr.top+70) m.scrollTop -= 12;
          place(); }, 30);
        move();
      };
      const place = () => {
        // Spalte anhand der horizontalen Position bestimmen – so zählt auch der leere Bereich unter kurzen Spalten
        const br = board.getBoundingClientRect();
        const c = (ly > br.top-80 && ly < br.bottom+200) ? [...board.querySelectorAll(".col")].find(x => { const b=x.getBoundingClientRect(); return lx>=b.left-5 && lx<=b.right+5; }) : null;
        board.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"));
        if (!c) return;
        c.classList.add("over");
        const list = $(".cards", c);
        const others = [...list.querySelectorAll(".cardx:not(.dragging)")];
        const before = others.find(o => { const b=o.getBoundingClientRect(); return ly < b.top + b.height/2; });
        if (before) list.insertBefore(ph, before); else list.append(ph);
      };
      const move = () => { ghost.style.left = (lx-ox)+"px"; ghost.style.top = (ly-oy)+"px"; place(); };
      const onMove = ev => {
        if (ev.pointerId!==pid) return;
        lx = ev.clientX; ly = ev.clientY;
        if (!active){
          const d = Math.hypot(lx-sx, ly-sy);
          if (touch){ if (d>10) cleanup(); return; }
          if (d<6) return;
          start();
        }
        ev.preventDefault(); move();
      };
      const cleanup = () => {
        clearTimeout(timer); clearInterval(scrollTimer);
        document.removeEventListener("pointermove", onMove); document.removeEventListener("pointerup", onUp); document.removeEventListener("pointercancel", onCancel);
        document.body.style.userSelect = "";
      };
      const endVisual = () => { ghost?.remove(); card.classList.remove("dragging"); board.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over")); DRAG = null; };
      const onCancel = ev => { if (ev.pointerId!==pid) return; cleanup(); if (active){ ph.remove(); endVisual(); } };
      const onUp = async ev => {
        if (ev.pointerId!==pid) return;
        cleanup();
        if (!active) return;
        card._dragged = true; setTimeout(()=>{ card._dragged=false; }, 50);
        const c = ph.closest(".col");
        const g = c?.dataset.g;
        // Neue Reihenfolge der Zielspalte: Platzhalter steht für die gezogene Karte
        const final = [];
        for (const x of (c ? [...$(".cards",c).children] : [])){ if (x===ph) final.push(r.id); else if (x!==card && x.dataset.id) final.push(x.dataset.id); }
        ph.remove(); endVisual();
        if (!c) return;
        const updates = {};
        const prevVal = r.props[col.name] || "";
        let nv;
        if (col.type==="checkbox") nv = g;
        else if (col.type==="multi_select"){
          const from = card.closest(".col")?.dataset.g;
          let toks = prevVal.split(",").map(s=>s.trim()).filter(Boolean).filter(t=>t!==from);
          if (g && !toks.includes(g)) toks.push(g);
          nv = g==="" ? "" : toks.join(", ");
        } else nv = g;
        if (nv !== prevVal){ r.props[col.name] = nv; updates[r.id] = {id:r.id, props:r.props}; }
        if (!st.sort){
          const byId = Object.fromEntries(p.rows.map(x=>[x.id,x]));
          final.forEach((id,i) => { const row = byId[id]; if (row && row.sort!==i){ row.sort = i; (updates[id] ||= {id}).sort = i; } });
        }
        draw();
        const list = Object.values(updates);
        if (list.length){ setStatus("Speichert …"); try { await api("POST","/api/batch",{updates:list}); setStatus("✓ Gespeichert"); setTimeout(()=>setStatus(""),1200); } catch(err){ setStatus("⚠️ Nicht gespeichert"); toast(err.message); inst.reload(); } }
      };
      document.addEventListener("pointermove", onMove); document.addEventListener("pointerup", onUp); document.addEventListener("pointercancel", onCancel);
      if (touch) timer = setTimeout(()=>{ start(); navigator.vibrate?.(12); }, 320);
    });
  };

  // ---------------- Menüs ----------------
  const groupMenu = (col, g, anchor) => {
    const pop = popover(anchor);
    const hide = h("button",{class:"item", onclick:()=>{ st.hidden=[...st.hidden, g.key]; persist(); closePop(); draw(); }},"🙈 Spalte ausblenden");
    if (col.type==="checkbox" || g.key===""){ pop.append(hide); return; }
    const o = col.options.find(x=>x.name===g.key); const idx = col.options.indexOf(o);

        st.hidden = st.hidden.map(x=>x===g.key?nn:x); persist(); closePop(); p.schema = res.schema; inst.reload(); } catch(e){ toast(e.message); } };
    name.onkeydown = e => { if (e.key==="Enter") rename(); };
    const sw = h("div",{class:"swatches"}, TAGCOLORS.map(c=>h("button",{title:COLORNAMES[c], class:(o.color||hashColor(o.name))===c?"on":"", style:`background:var(--t-${c})`, onclick:async()=>{ o.color=c; await saveSchema(); closePop(); draw(); }})));
    const mv = async d => { const j = idx+d; if (j<0 || j>=col.options.length) return; [col.options[idx], col.options[j]] = [col.options[j], col.options[idx]]; await saveSchema(); closePop(); draw(); };
    pop.append(h("label",{},"Name"), name, h("label",{},"Farbe"), sw, h("hr"),
      idx>0 ? h("button",{class:"item", onclick:()=>mv(-1)},"← Nach links") : null,
      idx<col.options.length-1 ? h("button",{class:"item", onclick:()=>mv(1)},"→ Nach rechts") : null,
      hide, h("hr"),
      h("button",{class:"item danger", onclick:async()=>{ const n = p.rows.filter(r=>inGroup(r,col,g.key)).length;
        if (n && !confirm(`Spalte „${g.key}“ löschen? ${n} Karte(n) bleiben erhalten und landen unter „Ohne ${col.name}“.`)) return;
        try { await api("POST",`/api/db/${p.id}/op`,{op:"delete_option", column:col.name, name:g.key}); closePop(); inst.reload(); } catch(e){ toast(e.message); } }},"🗑 Spalte löschen"));
    name.focus(); name.select();
  };

  const filterEditor = () => {
    const box = h("div",{class:"filters"});
    const redraw = () => {
      box.innerHTML = "";
      st.filters.forEach((f, i) => {
        const col = p.schema.find(c=>c.name===f.prop) || p.schema[0];
        const ops = opsFor(effType(col, p.schema, p.rows[0]));
